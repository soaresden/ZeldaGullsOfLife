- group: 0x30
  data:
  # Les cinq anneaux du jeu : leur nom, ce qu'ils font
  - name: TX_3041
    index: 0x41
    text: |-
      Anneau de Force
  - name: TX_3081
    index: 0x81
    text: |-
      Épée \up
      Blessures \up
  - name: TX_3044
    index: 0x44
    text: |-
      Anneau d'Armure
  - name: TX_3084
    index: 0x84
    text: |-
      Blessures \down
      Épée \down
  - name: TX_3056
    index: 0x56
    text: |-
      Anneau Tornade
  - name: TX_3096
    index: 0x96
    text: |-
      Le tourbillon
      se charge vite
  - name: TX_3078
    index: 0x78
    text: |-
      Anneau Caméléon
  - name: TX_30b8
    index: 0xb8
    text: |-
      Ta tunique,
      ta couleur
  - name: TX_3073
    index: 0x73
    text: |-
      Bague Easter Egg
  - name: TX_30b3
    index: 0xb3
    text: |-
      Donnée par
      Marine.

- group: 0x00
  data:
  # La sacoche (en anglais jusque-là)
  - name: TX_0052
    index: 0x52
    text: |-
      Ta \col(1)sacoche\col(0)
      est pleine!
  - name: TX_0080
    index: 0x80
    text: |-
      Ta \col(1)sacoche\col(0)
      peut porter plus
      de \col(1)graines\col(0)!
  # Nos anneaux (des textes d'Ages inutilisés : la boîte à anneaux, la poudre de fée...)
  - name: TX_0057
    index: 0x57
    text: |-
      L'\col(1)Anneau de
      Force\col(0)!\stop
      Ton épée frappe
      plus fort, mais
      tu prends plus
      cher. A dans le
      menu pour le
      porter.
  - name: TX_0058
    index: 0x58
    text: |-
      L'\col(1)Anneau
      d'Armure\col(0)!\stop
      Tu prends moins
      cher, mais ton
      épée frappe
      moins fort.
  - name: TX_0059
    index: 0x59
    text: |-
      L'\col(1)Anneau
      Tornade\col(0)!\stop
      Ton attaque
      tourbillon se
      charge bien plus
      vite.
  - name: TX_0055
    index: 0x55
    text: |-
      L'\col(1)Anneau
      Caméléon\col(0)!\stop
      Mets-le dans le
      menu: tu choisis
      la couleur de ta
      tunique!
  - name: TX_0056
    index: 0x56
    text: |-
      La \col(1)bague
      Easter Egg\col(0)!
  # Un anneau (il est identifié tout de suite)
  - name: TX_0054
    index: 0x54
    text: |-
      Tu as un
      \col(1)anneau\col(0)!
      Il est dans ta
      boîte (menu).
  # L'essence du 2e donjon : le deuxième couplet
  - name: TX_000f
    index: 0x0f
    text: |-
      \pos(2)\slow()Le Pantin n'a
      plus de fils.
      Les jouets de
      Lila dansent!\stop
      Tu as trouvé le
      \col(1)deuxième couplet\col(0)
      de la chanson de
      Marine!\stop
      \col(1)Marine\col(0): Deux
      couplets...\stop
      Celui-là parle
      d'une petite
      fille qui rêve
      d'un chevalier.\stop
      ...Il te
      ressemble un
      peu, non?

  - name: TX_0022
    index: 0x22
    text: |-
      Le \col(1)Boomerang-
      Toupie\col(0)! Il
      frappe de loin
      et revient!\stop
      Il atteint les
      cristaux qu'on
      ne touche pas
      à l'épée.
  # La Lagune : la bouteille (objet d'échange 1, l'ancien papier à lettres d'Ages)
  - name: TX_005b
    index: 0x5b
    text: |-
      Une \col(1)bouteille
      à la mer\col(0)!\stop
      Dedans, une
      vieille lettre,
      toute roulée.

  - name: TX_0031
    index: 0x31
    text: |-
      Les \col(1)Palmes de
      Zora\col(0)! Tu sais
      nager!\stop
      Va dans l'eau,
      et \bbtn pour
      plonger.

  # Les Écailles de Sirène (le costume de sirène d'Ages)
  - name: TX_0036
    index: 0x36
    text: |-
      Les \col(1)Écailles de
      Sirène\col(0)!\stop
      Tu nages dans
      l'eau profonde,
      et \bbtn: tu
      plonges!

  # L'essence du 3e donjon : le troisième couplet
  - name: TX_0010
    index: 0x10
    text: |-
      \pos(2)\slow()La Murène a
      rendu les mots
      doux qu'elle
      avait avalés.\stop
      Tu as trouvé le
      \col(1)troisième
      couplet\col(0) de la
      chanson de
      Marine!



  - name: TX_005a
    index: 0x5a
    text: |-
      Tu as retrouvé
      \col(1)Sire Bouchon\col(0)!\stop
      Le chevalier de
      bois de Lila...
      Il a l'air de
      s'ennuyer.

  - name: TX_0067
    index: 0x67
    text: |-
      Le \col(1)Sablier\col(0)!\stop
      Retourne-le: le
      temps s'arrête
      un instant.\stop
      Les coups donnés
      pendant ce temps
      éclatent tous à
      la fin, de plus
      en plus fort!

  - name: TX_0072
    index: 0x72
    text: |-
      Le \col(1)Carnet des
      Rêves\col(0)!\stop
      Les rêves que
      tu rends aux
      gens y sont
      notés.\stop
      Mets-le sur un
      bouton (Start)
      pour le lire.

  - name: TX_004d
    index: 0x4d
    text: |-
      Tu as eu dix
      \col(1)bombes\col(0)!

  - name: TX_004c
    index: 0x4c
    text: |-
      Tu as eu trois
      \col(1)cœurs\col(0)!
  - name: TX_006d
    index: 0x6d
    text: |-
      Une \col(1)fée en
      bouteille\col(0)! Elle
      te relèvera si
      tu n'as plus de
      cœurs!

  # L'essence du 1er donjon devient le premier couplet de la chanson de Marine
  - name: TX_000e
    index: 0x0e
    text: |-
      \pos(2)\slow()Le Veilleur dort
      enfin. Il rêve
      de sa femme, qui
      lui apporte la
      soupe...\stop
      Tu as trouvé le
      \col(1)premier couplet\col(0)
      de la chanson de
      Marine!\stop
      \col(1)Marine\col(0): Tu
      l'entends? Ce
      n'est pas la
      Ballade du
      Poisson-Rêve...\stop
      C'est la mienne.
      Ma chanson à
      moi!

  - name: TX_0016
    index: 0x16
    text: |-
      Tu as trouvé un
      \col(1)réceptacle de
      cœur\col(0)!

  - name: TX_001a
    index: 0x1a
    text: |-
      Tu as trouvé une
      \col(1)petite clé\col(0)!\stop
      Elle ouvre une
      porte ou un bloc
      verrouillé de ce
      donjon.

  - name: TX_001b
    index: 0x1b
    text: |-
      Tu as trouvé la
      \col(1)clé du boss\col(0)!

  - name: TX_001c
    index: 0x1c
    text: |-
      Tu as retrouvé
      ton \col(1)épée\col(0)!\stop
      Garde \abtn ou \bbtn
      enfoncé pour la
      charger, puis
      lâche pour une
      attaque
      tournoyante.

  - name: TX_001e
    index: 0x1e
    text: |-
      Tu as trouvé
      l'\col(1)Épée de
      Légende\col(0)!\stop
      Elle peut
      blesser ce que
      rien d'autre ne
      touche.

  - name: TX_0071
    index: 0x71
    text: |-
      Tu as trouvé la
      \col(1)Lanterne des
      Songes\col(0)!\stop
      Dans un donjon,
      sa flamme allume
      les torches.\stop
      Dehors, sa
      lumière t'ouvre
      le chemin du
      \col(1)Songe\col(0): le
      monde des rêves!

  # Rubis, cœurs, carte, boussole (traduits pour la démo)
  - name: TX_0000
    index: 0x00
    text: |-
      Tu as trouvé
      \col(1)1 rubis\col(0)!\stop
      ...
      C'est un début.
  - name: TX_0002
    index: 0x02
    text: |-
      Tu as trouvé
      \col(1)5 rubis\col(0)!
  - name: TX_0003
    index: 0x03
    text: |-
      Tu as trouvé
      \col(1)10 rubis\col(0)!
  - name: TX_0004
    index: 0x04
    text: |-
      Tu as trouvé
      \col(1)20 rubis\col(0)!
      Pas mal!
  - name: TX_0005
    index: 0x05
    text: |-
      Tu as trouvé
      \col(1)30 rubis\col(0)!
      Joli!
  - name: TX_0006
    index: 0x06
    text: |-
      Tu as trouvé
      \col(1)50 rubis\col(0)!
      Quelle chance!
  - name: TX_0007
    index: 0x07
    text: |-
      Tu as trouvé
      \col(1)100 rubis\col(0)!
      Tu dois être
      ravi!
  - name: TX_0008
    index: 0x08
    text: |-
      Tu as trouvé
      \col(1)150 rubis\col(0)!
      Bravo!!!
  - name: TX_0009
    index: 0x09
    text: |-
      Tu as trouvé
      \col(1)200 rubis\col(0)!
      Le bonheur!
  - name: TX_0017
    index: 0x17
    text: |-
      Tu as trouvé un
      \col(1)quart de cœur\col(0)!
      \heartpiece
      Réunis-en quatre
      pour gagner un
      cœur de plus!
  - name: TX_0018
    index: 0x18
    text: |-
      C'est la \col(1)carte
      du donjon\col(0)!
      Appuie sur
      \col(1)SELECT\col(0) pour la
      voir.
  - name: TX_0019
    index: 0x19
    text: |-
      Tu as trouvé la
      \col(1)boussole\col(0)!\stop
      Elle montre les
      coffres et le
      repaire du boss.
  - name: TX_0051
    index: 0x51
    text: |-
      Tu n'as récupéré
      qu'un cœur.
  - name: TX_0053
    index: 0x53
    text: |-
      Ta vie est
      au maximum!

  # Le Bracelet de force (Brasia)
  - name: TX_0026
    index: 0x26
    text: |-
      \pos(2)Le \col(1)Bracelet de
      force\col(0)!\stop
      Face à un
      rocher, garde
      le bouton
      enfoncé et
      tire: tu le
      soulèves!

  # Le tableau de la mer (Pinceau, l'objet d'échange 2 : l'ancien sac puant d'Ages)
  - name: TX_005c
    index: 0x5c
    text: |-
      Le \col(1)tableau de
      la mer\col(0)!\stop
      Des vagues, un
      soleil rouge...
      La peinture est
      encore fraîche.

  # La Canne des Songes (la canne de Somaria d'Ages)
  - name: TX_0073
    index: 0x73
    text: |-
      La \col(1)Canne des
      Songes\col(0)!\stop
      Elle fait
      apparaître un
      bloc devant toi.
      Un seul à la
      fois!

  # L'essence du 4e donjon : le quatrième couplet
  - name: TX_0011
    index: 0x11
    text: |-
      \pos(2)\slow()La Forge s'est
      réveillée. Plus
      deux épées
      pareilles!\stop
      Tu as trouvé le
      \col(1)quatrième
      couplet\col(0) de la
      chanson de
      Marine!\stop
      \col(1)Marine\col(0):
      "Invente-moi un
      chemin que
      personne n'a
      pris."\stop
      ...C'est joli,
      hein? C'est de
      moi!

  # La Pelle (Bêche)
  - name: TX_0025
    index: 0x25
    text: |-
      La \col(1)Pelle\col(0)!\stop
      Face au sol,
      utilise-la:
      tu creuses!

  # La clé de la cathédrale (la clé du cimetière d'Ages)
  - name: TX_0023
    index: 0x23
    text: |-
      La \col(1)clé de la
      cathédrale\col(0)!\stop
      Une vieille clé,
      toute rouillée.

  # L'essence du 5e donjon : le cinquième couplet
  - name: TX_0012
    index: 0x12
    text: |-
      \pos(2)\slow()Le souvenir
      s'est refermé,
      tout doux.\stop
      Tu as trouvé le
      \col(1)cinquième
      couplet\col(0) de la
      chanson de
      Marine!\stop
      \col(1)Marine\col(0): "Si un
      jour tu
      m'oublies,
      écoute la mer:
      je chante
      encore."\stop
      ...Celui-là, je
      l'ai écrit pour
      lui.

  # Le Grappin-Écho (le Switch Hook d'Ages)
  - name: TX_0030
    index: 0x30
    text: |-
      Le \col(1)Grappin-
      Écho\col(0)!\stop
      Vise un objet:
      tu prends sa
      place, et lui
      la tienne.

  # La Plume de Roc (Mère Plume)
  - name: TX_0027
    index: 0x27
    text: |-
      La \col(1)Plume de
      Roc\col(0)!\stop
      Appuie sur le
      bouton: tu
      sautes!

  # L'essence du 6e donjon : le sixième couplet
  - name: TX_0013
    index: 0x13
    text: |-
      \pos(2)\slow()L'Ombre s'est
      envolée. Le vent
      est revenu!\stop
      Tu as trouvé le
      \col(1)sixième
      couplet\col(0) de la
      chanson de
      Marine!\stop
      \col(1)Marine\col(0): "Ouvre
      les bras: le
      vent sait le
      chemin."\stop
      ...Celui-là, le
      vent me l'a
      soufflé.

  # La Cape de Roc (la plume, niveau 2)
  - name: TX_00_GET_ROCSCAPE
    index: auto
    text: |-
      La \col(1)Cape de
      Roc\col(0)!\stop
      Saute, puis
      appuie encore:
      tu sautes une
      deuxième fois!

  # Le Lance-Graines (le veilleur)
  - name: TX_002e
    index: 0x2e
    text: |-
      Le
      \col(1)Lance-Graines\col(0)!\stop
      Choisis tes
      graines, tire:
      elles
      rebondissent sur
      les murs.

  # La Clochette d'Aube (le Palais Givré)
  - name: TX_003b
    index: 0x3b
    text: |-
      La \col(1)Clochette
      d'Aube\col(0)!\stop
      Son tintement
      réveille les
      dormeurs.

  # L'essence du 7e donjon : le septième couplet
  - name: TX_0014
    index: 0x14
    text: |-
      \pos(2)\slow()Givrolin a
      fondu. L'île se
      réveille!\stop
      Tu as trouvé le
      \col(1)septième
      couplet\col(0) de la
      chanson de
      Marine!\stop
      \col(1)Marine\col(0): "Même
      la nuit la plus
      longue finit
      par un matin."
  - name: TX_001f
    index: 0x1f
    text: |-
      Tu as eu un
      \col(1)bouclier\col(0)!
  - name: TX_0020
    index: 0x20
    text: |-
      Tu as eu le
      \col(1)bouclier de fer\col(0)!
  - name: TX_0021
    index: 0x21
    text: |-
      Tu as eu le
      \col(1)bouclier miroir\col(0)!
  - name: TX_0024
    index: 0x24
    text: |-
      Tu as eu des
      \col(1)bombes\col(0)! Elles
      font sauter les
      murs fissurés.
      Pose-en une
      avec \abtn ou \bbtn.
  - name: TX_0029
    index: 0x29
    text: |-
      Tu as eu des
      \col(1)graines
      odorantes\col(0)!
      Leur odeur
      attire les
      monstres.
  - name: TX_002a
    index: 0x2a
    text: |-
      Tu as eu des
      \col(1)graines
      mystère\col(0)! Leur
      effet est un
      mystère...
  - name: TX_002b
    index: 0x2b
    text: |-
      Tu as eu des
      \col(1)graines
      Pégase\col(0)! Elles
      te rendent vif
      comme le vent!
  - name: TX_002c
    index: 0x2c
    text: |-
      Tu as eu des
      \col(1)graines de
      vent\col(0)! Leur
      bourrasque
      t'emporte.
  - name: TX_002d
    index: 0x2d
    text: |-
      \pos(2)Tu as eu une
      \col(1)sacoche\col(0)! Et
      20 \col(1)graines de
      feu\col(0) dedans!
  - name: TX_0049
    index: 0x49
    text: |-
      Quatre \col(1)quarts
      de cœur\col(0)! Ça
      fait un \col(1)cœur
      de plus\col(0)!
  - name: TX_004f
    index: 0x4f
    text: |-
      Tu as eu quatre
      \col(1)graines de feu\col(0)!
  - name: TX_0050
    index: 0x50
    text: |-
      Tu as eu dix
      \col(1)graines Pégase\col(0)!
  - name: TX_007e
    index: 0x7e
    text: |-
      Tu as eu
      \col(1)20 bombes\col(0)!


  # La boîte à anneaux (donnée d'office : cinq places)
  - name: TX_0917
    index: 0x17
    text: |-
      Anneau
      On le porte
      depuis le menu.
  - name: TX_091d
    index: 0x1d
    text: |-
      Boîte à anneaux
      A sur un anneau
      pour le porter.
  - name: TX_091e
    index: 0x1e
    text: |-
      Boîte à anneaux
      A sur un anneau
      pour le porter.
  - name: TX_091f
    index: 0x1f
    text: |-
      Boîte à anneaux
      A sur un anneau
      pour le porter.
  - name: TX_0902
    index: 0x02
    text: |-
      Deuxième couplet
      Une fille qui
      rêve d'un
      chevalier.

  - name: TX_0927
    index: 0x27
    text: |-
      Boomerang-Toupie
      Il frappe de

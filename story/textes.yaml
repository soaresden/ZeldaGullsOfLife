# Textes du jeu, en français (UTF-8 : é, è, à, ç, œ... sont acceptés tels quels).
# tools/make_text.py les ajoute au texte d'Oracle of Ages (groupe 0x5a, libre).
#
# Règles du moteur : 16 caractères par ligne au maximum (le style ">-" coupe
# les lignes tout seul, mais le style "|-" avec des
# retours à la ligne choisis à la main rend mieux), \stop = attendre A puis vider la boîte, \opt() = choix,
# \Link = nom du joueur. Pas d'espace avant ! et ? (comme la VF officielle).
#
# Chapitre 1 : la plage

groups:
- group: 0x5a
  data:

  # Prologue (film d'ouverture)
  - name: TX_5a00
    index: 0x00
    text: |-
      Le Poisson-Rêve
      s'était éveillé.
      L'île Cocolint
      avait disparu
      dans l'écume.\stop
      Accroché à une
      épave, le héros
      dériva de longs
      jours...\stop
      ...jusqu'à un
      archipel où plus
      personne ne
      rêvait.

  # La mouette se pose à côté de Link
  - name: TX_5a01
    index: 0x01
    text: |-
      Hé!
      Réveille-toi,
      gros dormeur!\stop
      ...\stop
      Tu ne me
      reconnais pas?\stop
      Pourtant, je
      t'ai déjà sorti
      de l'eau une
      fois.\stop
      Ça devient une
      habitude!

  # Link est debout
  - name: TX_5a02
    index: 0x02
    text: |-
      C'est moi,
      \col(1)Marine\col(0)!\stop
      Tu te souviens?
      Sur la plage, je
      t'avais dit que
      si j'étais une
      mouette, je
      volerais au-delà
      de la mer...\stop
      Avant de se
      réveiller, le
      Poisson-Rêve a
      entendu mon vœu.\stop
      Il m'a dit:
      "Ce qui est rêvé
      assez fort ne
      disparaît jamais
      vraiment."\stop
      Et voilà: vœu
      exaucé, mot pour
      mot!\stop
      J'aurais peut-
      être dû préciser
      que je voulais
      garder mes
      mains...\stop
      Mais je ne vais
      pas me plaindre!\stop
      Tu es content
      de me revoir?
        \opt()Oui \opt()Bien sûr

  - name: TX_5a03
    index: 0x03
    text: |-
      Juste "oui"?\stop
      Toujours aussi
      bavard, toi.\stop
      Ça m'avait
      manqué,
      figure-toi.\stop
      Allez, viens.
      Il y a quelque
      chose de bizarre
      sur cette île...

  - name: TX_5a04
    index: 0x04
    text: |-
      Hi hi!
      Moi aussi,
      tu sais.\stop
      Allez, viens.
      Il y a quelque
      chose de bizarre
      sur cette île...

  # Elle a froid : elle va se mettre dans la tunique de Link
  - name: TX_5a05
    index: 0x05
    text: |-
      Tu sens ça,
      \Link?
      Cet archipel est
      trop calme.\stop
      Brr! Et le vent
      de la mer est
      glacé...\stop
      Bon. Je me mets
      au chaud dans ta
      tunique!\stop
      Et pas de
      commentaire!

  # Depuis la tunique (elle y passera toute l'aventure)
  - name: TX_5a06
    index: 0x06
    text: |-
      Mmh... Ça sent
      le sel et
      l'aventure,
      là-dedans.\stop
      Allons voir s'il
      y a quelqu'un.\stop
      Et ne casse pas
      toutes leurs
      jarres, cette
      fois!\stop
      Si tu veux me
      parler, appuie
      sur \col(1)SELECT\col(0).\stop
      Pour ta carte,
      garde \col(1)SELECT\col(0)
      enfoncé.

  # ============================================================================
  # Select (appui court) : Marine parle depuis la tunique (code/ages/balladeMarine.s)
  # ============================================================================

  # Sur la plage du réveil
  - name: TX_5a07
    index: 0x07
    text: |-
      Personne sur la
      plage...\stop
      Les gens doivent
      vivre plus loin.
      Allons voir!

  # Port-Veille, devant l'auberge (1:9a)
  - name: TX_5a08
    index: 0x08
    text: |-
      Une auberge!\stop
      Ils doivent
      avoir des lits,
      non? Un lit,
      c'est fait pour
      dormir...\stop
      Et toi, quand tu
      dors, tu rêves.
      C'est ton vrai
      talent, ça.

  # La place de Port-Veille (1:9b)
  - name: TX_5a09
    index: 0x09
    text: |-
      Ils ont tous des
      cernes jusqu'au
      menton...\stop
      Personne ne dort
      sur cette île?
      Brr. Ça me donne
      des frissons.

  # La plage est (1:9c)
  - name: TX_5a0a
    index: 0x0a
    text: |-
      Des enfants qui
      ne jouent pas...
      Ce n'est pas
      normal.\stop
      Sur Cocolint, on
      passait nos
      journées à
      faire semblant!

  # Le port de pêche (1:ab)
  - name: TX_5a0b
    index: 0x0b
    text: |-
      Un phare...
      Tu l'as vu, au
      nord? Il est
      tout éteint.\stop
      Un phare éteint,
      c'est comme une
      chanson qu'on
      ne chante plus.

  # Le sentier au pont cassé (1:8a)
  - name: TX_5a0c
    index: 0x0c
    text: |-
      Le pont est
      cassé...\stop
      Si seulement on
      pouvait passer
      en rêve!\stop
      ...Attends. Et
      si on pouvait?

  # L'auberge, dedans (3:9e)
  - name: TX_5a0d
    index: 0x0d
    text: |-
      Le lit, là-bas!
      Pousse-le un
      moment pour te
      coucher.\stop
      Moi, je ne bouge
      pas d'ici. Il
      fait tellement
      bon, dans ta
      tunique!

  # Partout ailleurs : une réplique au hasard
  - name: TX_5a10
    index: 0x10
    text: |-
      Oui? Tu as
      besoin de moi?\stop
      Je faisais une
      petite sieste...

  - name: TX_5a11
    index: 0x11
    text: |-
      Hé! Arrête de
      me secouer!\stop
      Je suis très
      bien installée,
      moi!

  - name: TX_5a12
    index: 0x12
    text: |-
      Tu sais que tu
      ronfles, quand
      tu dors?\stop
      Comme mon père.\stop
      ...Ça me fait
      un peu de bien,
      en fait.

  - name: TX_5a13
    index: 0x13
    text: |-
      Perdu? Garde
      \col(1)SELECT\col(0) enfoncé
      pour ta carte.\stop
      Et pour moi, un
      petit appui
      suffit!

  # ============================================================================
  # Les habitants de Port-Veille (INTERAC_BALLADE_NPC, scripts/ages/ballade.s)
  # ============================================================================

  # L'aubergiste (3:9e)
  - name: TX_5a20
    index: 0x20
    text: |-
      Bienvenue à
      l'auberge de la
      Brume...\stop
      Une chambre?
      À quoi bon...\stop
      Personne ne dort
      plus, ici. Pas
      depuis que le
      phare s'est
      éteint.\stop
      On ferme les
      yeux, et...
      rien. Le noir.
      Comme si on
      avait vidé
      nos têtes.\stop
      Mais toi, tu as
      l'air épuisé.
      Le lit est au
      fond. Gratuit:
      plus personne
      ne s'en sert.

  # Le vieux pêcheur (1:ab)
  - name: TX_5a21
    index: 0x21
    text: |-
      Avant, la
      lumière du phare
      guidait nos
      bateaux...\stop
      ...et elle
      berçait nos
      nuits.\stop
      Depuis qu'elle
      s'est éteinte,
      la brume ne
      quitte plus
      l'île.\stop
      Et le sommeil
      non plus.\stop
      Le phare est au
      nord, au bout
      des falaises.
      Mais le pont du
      sentier s'est
      écroulé.

  # Un garçon (1:9c)
  - name: TX_5a22
    index: 0x22
    text: |-
      Jouer? C'est
      quoi, jouer?\stop
      Maman dit
      qu'avant, on
      faisait semblant
      d'être des
      chevaliers.\stop
      Moi, je n'arrive
      plus à faire
      semblant.

  # Un autre enfant (1:9c)
  - name: TX_5a23
    index: 0x23
    text: |-
      Je voulais faire
      un château de
      sable.\stop
      Mais je ne sais
      plus à quoi ça
      ressemble, un
      château...\stop
      Il faudrait que
      j'en rêve.

  # La dame insomniaque (1:9b)
  - name: TX_5a24
    index: 0x24
    text: |-
      Trois semaines
      que je n'ai pas
      fermé l'œil.\stop
      J'ai compté les
      étoiles, les
      vagues, les
      grains de
      sable...\stop
      Il m'en manquait
      toujours un.

  # Le vieux qui compte les moutons (1:9b)
  - name: TX_5a25
    index: 0x25
    text: |-
      Cent quarante-
      deux moutons...
      Cent quarante-
      trois...\stop
      Ah! Tu m'as fait
      perdre le
      compte!\stop
      Et il n'y a même
      pas de moutons,
      sur cette île!\stop
      \col(1)Marine\col(0):
      Pff! Hi hi!

  # L'ado qui rêve d'être marin (1:9a)
  - name: TX_5a26
    index: 0x26
    text: |-
      On dit qu'en
      haut du phare
      brûlait une
      lanterne qui
      faisait rêver
      tout l'archipel.\stop
      Moi, je voudrais
      devenir marin.\stop
      Mais pour ça,
      il faudrait
      d'abord que j'en
      rêve, non?

  # ============================================================================
  # Le Songe : Marine humaine (auberge du Songe, 2:9e)
  # ============================================================================

  # La première rencontre : la scène des mains
  - name: TX_5a27
    index: 0x27
    text: |-
      ...\stop
      Oh.\stop
      Oh!\stop
      J'ai des mains!
      Et des pieds!\stop
      J'avais oublié
      comme c'est nul
      pour
      l'équilibre,
      des pieds!\stop
      \Link!

  # Le câlin des retrouvailles
  - name: TX_5a2c
    index: 0x2c
    text: |-
      ...\stop
      Je suis là.
      Je suis vivante.
      J'ai un corps!\stop
      Je peux te
      serrer dans mes
      bras... Enfin!\stop
      Ne bouge pas.
      Encore un peu.\stop
      ...\stop
      Bon! Pardon.
      C'est que...
      j'ai eu si peur
      de disparaître
      pour toujours.

  # Ce qu'elle n'a jamais osé demander
  - name: TX_5a2d
    index: 0x2d
    text: |-
      Tu sais... sur
      Cocolint, je
      n'ai jamais su
      si tu m'avais
      vraiment vue.\stop
      Ou si j'étais
      juste la fille
      qui chante sur
      la plage.
        \opt()Je t'ai vue
        \opt()...

  - name: TX_5a28
    index: 0x28
    text: |-
      ...Idiot.\stop
      Je vais pleurer,
      et dans un rêve,
      ça mouille quand
      même.

  - name: TX_5a29
    index: 0x29
    text: |-
      Toujours aussi
      bavard.\stop
      Ce n'est pas
      grave. J'ai
      compris quand
      même.

  # Ensuite, quand on lui parle
  - name: TX_5a2a
    index: 0x2a
    text: |-
      Ici, c'est le
      \col(1)Songe\col(0): le
      monde tel qu'on
      le rêve.\stop
      Je ne peux être
      moi-même que
      quand tu dors.
      Alors ne te
      couche pas trop
      tard, d'accord?\stop
      Le pont cassé du
      sentier... Ici,
      il doit être
      entier!\stop
      De l'autre côté,
      appuie sur
      \col(1)SELECT\col(0): je te
      réveillerai.

  # Dans le Songe, Select : se réveiller ?
  - name: TX_5a14
    index: 0x14
    text: |-
      Tu veux te
      réveiller?
        \opt()Oui \opt()Non

  # ============================================================================
  # Le vieux pêcheur rend son épée à Link (la 1re fois qu'on lui parle)
  # ============================================================================
  - name: TX_5a2b
    index: 0x2b
    text: |-
      Hé, toi! C'est
      bien toi, le
      naufragé?\stop
      J'ai repêché ça
      hier, dans mes
      filets.\stop
      Une épée! Elle
      doit être à toi.\stop
      Prends-la. Le
      phare, au nord,
      n'est plus sûr
      depuis qu'il
      s'est éteint.

  # ============================================================================
  # Le Phare Éteint
  # ============================================================================

  # Marine, en entrant dans le phare (Select)
  - name: TX_5a0e
    index: 0x0e
    text: |-
      Brr... Il fait
      froid, là-
      dedans.\stop
      Le phare devrait
      briller tout là-
      haut. On monte?

# ==============================================================================
# Textes d'Ages remplacés (même nom) : les objets qu'on trouve parlent français
# ==============================================================================
- group: 0x00
  data:

  # L'essence du 1er donjon devient le premier couplet de la chanson de Marine
  - name: TX_000e
    index: 0x0e
    text: |-
      \pos(2)\slow()Le Veilleur dort
      enfin. Il rêve
      de sa femme, qui
      lui apporte la
      soupe...\stop
      Tu as trouvé le
      \col(1)premier couplet\col(0)
      de la chanson de
      Marine!\stop
      \col(1)Marine\col(0): Tu
      l'entends? Ce
      n'est pas la
      Ballade du
      Poisson-Rêve...\stop
      C'est la mienne.
      Ma chanson à
      moi!

  - name: TX_001a
    index: 0x1a
    text: |-
      Tu as trouvé une
      \col(1)petite clé\col(0)!\stop
      Elle ouvre une
      porte ou un bloc
      verrouillé de ce
      donjon.

  - name: TX_001b
    index: 0x1b
    text: |-
      Tu as trouvé la
      \col(1)clé du boss\col(0)!

  - name: TX_001c
    index: 0x1c
    text: |-
      Tu as retrouvé
      ton \col(1)épée\col(0)!\stop
      Garde \abtn ou \bbtn
      enfoncé pour la
      charger, puis
      lâche pour une
      attaque
      tournoyante.

  - name: TX_0071
    index: 0x71
    text: |-
      Tu as trouvé la
      \col(1)Lanterne des
      Songes\col(0)!\stop
      Sa lumière vient
      du monde des
      rêves...

# Textes du jeu, en français (UTF-8 : é, è, à, ç, œ... sont acceptés tels quels).
# tools/make_text.py les ajoute au texte d'Oracle of Ages (groupe 0x5a, libre).
#
# Règles du moteur : 16 caractères par ligne au maximum (le style ">-" coupe
# les lignes tout seul, mais le style "|-" avec des
# retours à la ligne choisis à la main rend mieux), \stop = attendre A puis vider la boîte, \opt() = choix,
# \Link = nom du joueur. Pas d'espace avant ! et ? (comme la VF officielle).
#
# Chapitre 1 : la plage

groups:
- group: 0x5a
  data:

  # Prologue (film d'ouverture)
  - name: TX_5a00
    index: 0x00
    text: |-
      Le Poisson-Rêve
      s'était éveillé.
      L'île Cocolint
      avait disparu
      dans l'écume.\stop
      Accroché à une
      épave, le héros
      dériva de longs
      jours...\stop
      ...jusqu'à un
      archipel où plus
      personne ne
      rêvait.

  # La mouette se pose à côté de Link
  - name: TX_5a01
    index: 0x01
    text: |-
      Hé!
      Réveille-toi,
      gros dormeur!\stop
      ...\stop
      Tu ne me
      reconnais pas?\stop
      Pourtant, je
      t'ai déjà sorti
      de l'eau une
      fois.\stop
      Ça devient une
      habitude!

  # Link est debout
  - name: TX_5a02
    index: 0x02
    text: |-
      C'est moi,
      \col(1)Marine\col(0)!\stop
      Tu te souviens?
      Sur la plage, je
      t'avais dit que
      si j'étais une
      mouette, je
      volerais au-delà
      de la mer...\stop
      Avant de se
      réveiller, le
      Poisson-Rêve a
      entendu mon vœu.\stop
      Il m'a dit:
      "Ce qui est rêvé
      assez fort ne
      disparaît jamais
      vraiment."\stop
      Et voilà: vœu
      exaucé, mot pour
      mot!\stop
      J'aurais peut-
      être dû préciser
      que je voulais
      garder mes
      mains...\stop
      Mais je ne vais
      pas me plaindre!\stop
      Tu es content
      de me revoir?
        \opt()Oui \opt()Carrément!

  - name: TX_5a03
    index: 0x03
    text: |-
      Juste "oui"?\stop
      Toujours aussi
      bavard, toi.\stop
      Ça m'avait
      manqué,
      figure-toi.\stop
      Allez, viens.
      Il y a quelque
      chose de bizarre
      sur cette île...

  - name: TX_5a04
    index: 0x04
    text: |-
      Hi hi!
      Moi aussi,
      tu sais.\stop
      Allez, viens.
      Il y a quelque
      chose de bizarre
      sur cette île...

  # Juste avant : où sont passés tous les objets de Link's Awakening ?
  - name: TX_5a15
    index: 0x15
    text: |-
      Attends...
      Il est où, ton
      barda?\stop
      Ta plume, ton
      bracelet, tes
      bottes, tes
      palmes...\stop
      Le grappin, le
      boomerang, le
      bouclier miroir,
      le bâton de
      feu...\stop
      L'arc, les
      bombes, et même
      la poudre
      magique?!\stop
      Tu as tout perdu
      en mer?!\stop
      ...\stop
      Bon. Tu m'as
      moi, c'est déjà
      pas mal, non?

  # Elle a froid : elle va se mettre dans la tunique de Link
  - name: TX_5a05
    index: 0x05
    text: |-
      Tu sens ça,
      \Link?
      Cet archipel est
      trop calme.\stop
      Brr! Et le vent
      de la mer est
      glacé...\stop
      Bon. Je me mets
      au chaud dans ta
      tunique!\stop
      Et pas de
      commentaire!

  # Depuis la tunique (elle y passera toute l'aventure)
  - name: TX_5a06
    index: 0x06
    text: |-
      Mmh... Ça sent
      le sel et
      l'aventure,
      là-dedans.\stop
      Allons voir s'il
      y a quelqu'un.\stop
      Et ne casse pas
      toutes leurs
      jarres, cette
      fois!\stop
      Si tu veux me
      parler, garde
      \col(1)SELECT\col(0) enfoncé.\stop
      Pour ta carte,
      un petit appui
      suffit.

  # ============================================================================
  # Select gardé enfoncé : Marine parle depuis la tunique (code/ages/balladeMarine.s)
  # ============================================================================

  # Sur la plage du réveil
  - name: TX_5a07
    index: 0x07
    text: |-
      Personne sur la
      plage...\stop
      Les gens doivent
      vivre plus loin.
      Allons voir!

  # Port-Veille, devant l'auberge (1:9a)
  - name: TX_5a08
    index: 0x08
    text: |-
      Une auberge!\stop
      Ils doivent
      avoir des lits,
      non? Un lit,
      c'est fait pour
      dormir...\stop
      Et toi, quand tu
      dors, tu rêves.
      C'est ton vrai
      talent, ça.

  # La place de Port-Veille (1:9b)
  - name: TX_5a09
    index: 0x09
    text: |-
      Ils ont tous des
      cernes jusqu'au
      menton...\stop
      Personne ne dort
      sur cette île?
      Brr. Ça me donne
      des frissons.

  # La plage est (1:9c)
  - name: TX_5a0a
    index: 0x0a
    text: |-
      Des enfants qui
      ne jouent pas...
      Ce n'est pas
      normal.\stop
      Sur Cocolint, on
      passait nos
      journées à
      faire semblant!

  # Le port de pêche (1:ab)
  - name: TX_5a0b
    index: 0x0b
    text: |-
      Un phare...
      Tu l'as vu, au
      nord? Il est
      tout éteint.\stop
      Un phare éteint,
      c'est comme une
      chanson qu'on
      ne chante plus.

  # Le sentier au pont cassé (1:8a)
  - name: TX_5a0c
    index: 0x0c
    text: |-
      Le pont s'est
      effondré... Il
      n'en reste rien!\stop
      L'île est coupée
      en deux, et la
      mer passe au
      milieu.\stop
      Et pas un seul
      ouvrier sur
      cette île pour
      le reconstruire!\stop
      Si seulement on
      pouvait passer
      en rêve!\stop
      ...Attends. Et
      si on pouvait?

  # L'auberge, dedans (3:9e)
  - name: TX_5a0d
    index: 0x0d
    text: |-
      Le lit, là-bas!
      Mets-toi devant
      et appuie sur
      \col(1)A\col(0) pour te
      coucher.\stop
      Moi, je ne bouge
      pas d'ici. Il
      fait tellement
      bon, dans ta
      tunique!

  # Partout ailleurs : une réplique au hasard
  - name: TX_5a10
    index: 0x10
    text: |-
      Oui? Tu as
      besoin de moi?\stop
      Je faisais une
      petite sieste...

  - name: TX_5a11
    index: 0x11
    text: |-
      Hé! Arrête de
      me secouer!\stop
      Je suis très
      bien installée,
      moi!

  - name: TX_5a12
    index: 0x12
    text: |-
      Tu sais que tu
      ronfles, quand
      tu dors?\stop
      Comme mon père.\stop
      ...Ça me fait
      un peu de bien,
      en fait.

  - name: TX_5a13
    index: 0x13
    text: |-
      Perdu? Un petit
      appui sur
      \col(1)SELECT\col(0): la
      carte.\stop
      Et pour moi,
      garde-le
      enfoncé!

  # ============================================================================
  # Les habitants de Port-Veille (INTERAC_BALLADE_NPC, scripts/ages/ballade.s)
  # ============================================================================

  # L'aubergiste (3:9e)
  - name: TX_5a20
    index: 0x20
    text: |-
      Bienvenue à
      l'auberge de la
      Brume...\stop
      Une chambre?
      À quoi bon...\stop
      Personne ne dort
      plus, ici. Pas
      depuis que le
      phare s'est
      éteint.\stop
      On ferme les
      yeux, et...
      rien. Le noir.
      Comme si on
      avait vidé
      nos têtes.\stop
      Mais toi, tu as
      l'air épuisé.
      Le lit est au
      fond. Gratuit:
      plus personne
      ne s'en sert.

  # Le vieux pêcheur (1:ab)
  - name: TX_5a21
    index: 0x21
    text: |-
      Avant, la
      lumière du phare
      guidait nos
      bateaux...\stop
      ...et elle
      berçait nos
      nuits.\stop
      Depuis qu'elle
      s'est éteinte,
      la brume ne
      quitte plus
      l'île.\stop
      Et le sommeil
      non plus.\stop
      Le phare est au
      nord, au bout
      des falaises.
      Mais le pont du
      sentier s'est
      écroulé.\stop
      Il n'en reste
      rien: l'île est
      coupée en deux!\stop
      Et des ouvriers,
      ici? Il n'y en a
      pas. On est des
      pêcheurs, nous.

  # Un garçon (1:9c)
  - name: TX_5a22
    index: 0x22
    text: |-
      Jouer? C'est
      quoi, jouer?\stop
      Maman dit
      qu'avant, on
      faisait semblant
      d'être des
      chevaliers.\stop
      Moi, je n'arrive
      plus à faire
      semblant.

  # Un autre enfant (1:9c)
  - name: TX_5a23
    index: 0x23
    text: |-
      Je voulais faire
      un château de
      sable.\stop
      Mais je ne sais
      plus à quoi ça
      ressemble, un
      château...\stop
      Il faudrait que
      j'en rêve.

  # La dame insomniaque (1:9b)
  - name: TX_5a24
    index: 0x24
    text: |-
      Trois semaines
      que je n'ai pas
      fermé l'œil.\stop
      J'ai compté les
      étoiles, les
      vagues, les
      grains de
      sable...\stop
      Il m'en manquait
      toujours un.

  # Le vieux qui compte les moutons (1:9b)
  - name: TX_5a25
    index: 0x25
    text: |-
      Cent quarante-
      deux moutons...
      Cent quarante-
      trois...\stop
      Ah! Tu m'as fait
      perdre le
      compte!\stop
      Et il n'y a même
      pas de moutons,
      sur cette île!\stop
      \col(1)Marine\col(0):
      Pff! Hi hi!

  # L'ado qui rêve d'être marin (1:9a)
  - name: TX_5a26
    index: 0x26
    text: |-
      On dit qu'en
      haut du phare
      brûlait une
      lanterne qui
      faisait rêver
      tout l'archipel.\stop
      Moi, je voudrais
      devenir marin.\stop
      Mais pour ça,
      il faudrait
      d'abord que j'en
      rêve, non?

  # ============================================================================
  # Le Songe : Marine humaine (auberge du Songe, 2:9e)
  # ============================================================================

  # La première rencontre : la scène des mains
  - name: TX_5a27
    index: 0x27
    text: |-
      ...\stop
      Oh.\stop
      Oh!\stop
      J'ai des mains!
      Et des pieds!\stop
      J'avais oublié
      comme c'est nul
      pour
      l'équilibre,
      des pieds!\stop
      \Link!

  # Le câlin des retrouvailles : elle le dit, puis elle se jette dans ses bras
  - name: TX_5a2c
    index: 0x2c
    text: |-
      ...\stop
      Je suis là.
      Je suis vivante.
      J'ai un corps!\stop
      Alors je peux
      enfin te serrer
      dans mes bras!

  # Dans ses bras
  - name: TX_5a2f
    index: 0x2f
    text: |-
      Je suis
      tellement,
      tellement
      heureuse!\stop
      Ne bouge pas.
      Encore un peu.\stop
      ...\stop
      Bon! Pardon.
      C'est que...
      j'ai eu si peur
      de disparaître
      pour toujours.

  # Elle recule d'un pas... et le taquine
  - name: TX_5a32
    index: 0x32
    text: |-
      Mais hé...\stop
      Je suis dans
      TON rêve!\stop
      Qu'est-ce que ça
      veut dire, ça?\stop
      Tu rêves de
      moi?! Hi hi!

  # Ce qu'elle n'a jamais osé demander
  - name: TX_5a2d
    index: 0x2d
    text: |-
      Tu sais... sur
      Cocolint, je
      n'ai jamais su
      si tu m'avais
      vraiment vue.\stop
      Ou si j'étais
      juste la fille
      qui chante sur
      la plage.
        \opt()Je t'ai vue
        \opt()...

  - name: TX_5a28
    index: 0x28
    text: |-
      ...Idiot.\stop
      Je vais pleurer,
      et dans un rêve,
      ça mouille quand
      même.

  - name: TX_5a29
    index: 0x29
    text: |-
      Toujours aussi
      bavard.\stop
      Ce n'est pas
      grave. J'ai
      compris quand
      même.

  # Ensuite, quand on lui parle
  - name: TX_5a2a
    index: 0x2a
    text: |-
      Ici, c'est le
      \col(1)Songe\col(0): le
      monde tel qu'on
      le rêve.\stop
      Je ne peux être
      moi-même que
      quand tu dors.
      Alors ne te
      couche pas trop
      tard, d'accord?\stop
      Dans le monde
      des rêves, tout
      est possible!\stop
      Même ouvrir la
      mer en deux,
      comme Moïse!\stop
      Va donc voir là
      où il y avait
      le pont!\stop
      Hi hi! Te voilà
      noctambule: tu
      te promènes en
      dormant!\stop
      Et tu te
      réveilleras pile
      là où tu seras.\stop
      Mais fais vite!
      Dehors, le jour
      arrive vite...\stop
      Cours, ne
      traîne pas!

  # À l'auberge, A devant le lit
  - name: TX_5a16
    index: 0x16
    text: |-
      Ce lit a l'air
      bien douillet...
      Dormir un peu?
        \opt()Oui \opt()Non

  # Dans le Songe, Select : se réveiller ?
  - name: TX_5a14
    index: 0x14
    text: |-
      Tu veux te
      réveiller?
        \opt()Oui \opt()Non

  # ============================================================================
  # Le vieux pêcheur rend son épée à Link (la 1re fois qu'on lui parle)
  # ============================================================================
  - name: TX_5a2b
    index: 0x2b
    text: |-
      Hé, toi! C'est
      bien toi, le
      naufragé?\stop
      J'ai repêché ça
      hier, dans mes
      filets.\stop
      Une épée! Elle
      doit être à toi.\stop
      Le reste de ton
      matos? Oh, j'ai
      bien vu des
      trucs flotter,
      au loin...\stop
      Mais ramer
      jusque-là?
      Flemme!\stop
      Hé hé! Tu vas
      tout recommencer
      à zéro, mon
      gars!\stop
      Prends-la. Le
      phare, au nord,
      n'est plus sûr
      depuis qu'il
      s'est éteint.

  # Juste après : Marine, depuis la tunique, sur l'épée retrouvée
  - name: TX_5a2e
    index: 0x2e
    text: |-
      \col(1)Marine\col(0):
      Attends... Ton
      épée, ce n'était
      pas une épée de
      niveau 3?\stop
      Là, c'est écrit
      niveau 1!\stop
      Le sel de la mer
      l'a rouillée?
      Ou alors tu
      l'as mal
      rangée...\stop
      Pas de sac à
      dos, voilà le
      problème!

  # ============================================================================
  # Le Phare Éteint
  # ============================================================================

  # Marine, en entrant dans le phare (Select)
  - name: TX_5a0e
    index: 0x0e
    text: |-
      Brr... Il fait
      froid, là-
      dedans.\stop
      Le phare devrait
      briller tout là-
      haut. On monte?

  # ============================================================================
  # Après le Phare : sur fond noir, Marine parle depuis la tunique, puis « À suivre »
  # ============================================================================
  - name: TX_5a30
    index: 0x30
    text: |-
      \col(1)Marine\col(0): Link!
      Regarde! Le
      phare brille de
      nouveau!\stop
      Ce soir, tout
      Port-Veille va
      rêver...\stop
      Viens, allons
      voir ça!

  - name: TX_5a31
    index: 0x31
    text: |-
      
         À suivre...

  # Le noctambule : un peu avant de se réveiller (INTERAC_BALLADE_DREAM_FX)
  - name: TX_5a33
    index: 0x33
    text: |-
      \col(1)Marine\col(0): Le
      jour se lève...
      Tu vas te
      réveiller!

  # Le Phare, salle du boss : Jack (la citrouille) menace, Marine réplique
  - name: TX_5a34
    index: 0x34
    text: |-
      \col(2)Jack\col(0): Hé hé
      hé... Un petit
      héros et sa
      mouette?\stop
      Ce phare est à
      moi! Il restera
      éteint pour
      toujours!\stop
      Je vais vous
      souffler comme
      deux bougies!

  - name: TX_5a35
    index: 0x35
    text: |-
      \col(1)Marine\col(0): C'est
      ça! J'aime pas
      la citrouille,
      mais on va te
      piquer quand
      même, Jack!

  # Le boss de fin en rythme (INTERAC_BALLADE_RHYTHM) : les encouragements de Marine (idées de
  # Denis). Deux lignes seulement (une 3e attendrait A) ; elle parle juste : la bulle se ferme
  # toute seule après ~3 secondes (\wait), pendant les mesures sans note à frapper.
  # Au début, pendant le décompte
  - name: TX_5a36
    index: 0x36
    text: |-
      Allez, donne-moi
      le 'La'!\wait(120)

  # Un bon tour : la chanson revient (niveau 2)
  - name: TX_5a37
    index: 0x37
    text: |-
      Ouais...
      Je reconnais!...\wait(120)

  # Encore un bon tour (niveau 3) : elle se concentre, elle prend son souffle
  - name: TX_5a38
    index: 0x38
    text: |-
      Je reprends mon
      souffle...\wait(120)

  # Le dernier bon tour : elle va chanter
  - name: TX_5a39
    index: 0x39
    text: |-
      Tu as retenu
      \heart!\wait(120)

  # Elle commence à chanter
  - name: TX_5a3a
    index: 0x3a
    text: |-
      Je vais me le
      faire!\wait(120)

  # Le coup de grâce, à la fin de son chant
  - name: TX_5a3b
    index: 0x3b
    text: |-
      RETOURNE D'OÙ
      TU VIENS!\wait(120)

  # Après le niveau 2 (5 niveaux, comme les 5 étapes de Lorule Castle)
  - name: TX_5a3c
    index: 0x3c
    text: |-
      C'est ça!
      Plus fort!\wait(120)

  # Après le niveau 4 : sa voix revient
  - name: TX_5a3d
    index: 0x3d
    text: |-
      Ma voix...
      Elle revient!\wait(120)

  # La fin du chapitre 1 : le tour du village (INTERAC_MARINE $05), puis les habitants gardent ces
  # répliques (scripts/ages/ballade.s)
  - name: TX_5a3e
    index: 0x3e
    text: |-
      Zzz... Zzz...\stop
      Mmh... Je
      dors...
      Je DORS!\stop
      Merci... petit
      gars... Zzz...

  - name: TX_5a3f
    index: 0x3f
    text: |-
      Plus besoin de
      compter les
      moutons...\stop
      Je ferme les
      yeux, et hop!
      Je rêve d'un
      grand pré tout
      vert...\stop
      ...Zzz...

  - name: TX_5a40
    index: 0x40
    text: |-
      On joue aux
      chevaliers! Moi,
      je suis Link!\stop
      Et moi, je suis
      la mouette qui
      parle! Hi hi!

  - name: TX_5a41
    index: 0x41
    text: |-
      Des clients!
      Toutes mes
      chambres sont
      prises!\stop
      Tout le monde
      veut dormir à
      l'auberge de la
      Brume!\stop
      Et moi... je
      bâille... Hooaa!

  - name: TX_5a42
    index: 0x42
    text: |-
      \col(1)Marine\col(0): Bien
      joué! On a sauvé
      ces gens!\stop
      C'est ça que tu
      as fait pendant
      que j'étais au
      village?\stop
      Tu accomplissais
      des donjons et
      résolvais des
      énigmes?\stop
      Mais... c'est
      palpitant!\stop
      Je ne regrette
      pas d'être avec
      toi, finalement!\stop
      À l'abordaaaage!

  # Le Creuse-Rubis du forain (plage du forain, 1:ac ; code/ages/balladeCreuse.s)
  - name: TX_5a43
    index: 0x43
    text: |-
      Approche,
      approche! Le
      Creuse-Rubis!\stop
      Creuse le sable,
      ramasse les
      rubis... mais
      gare aux bombes!\stop
      Facile: 10 rubis
      Moyen: 20 rubis
      Dur: 30 rubis\stop
      \opt()Facile \opt()Moyen
      \opt()Dur \opt()Non

  - name: TX_5a44
    index: 0x44
    text: |-
      Creuse! Creuse!
      Le sable ne va
      pas se creuser
      tout seul!

  - name: TX_5a45
    index: 0x45
    text: |-
      Pas assez de
      rubis, mon
      petit! Reviens
      plus riche!

  - name: TX_5a46
    index: 0x46
    text: |-
      \col(1)Marine\col(0): Vert,
      rien autour.
      Bleu, une bombe.
      Rouge, deux...\stop
      Doré... cours!

  - name: TX_5a47
    index: 0x47
    text: |-
      BOUM!\stop
      Hé hé... La
      maison gagne
      toujours!

  - name: TX_5a48
    index: 0x48
    text: |-
      Quoi?! Tu as
      tout trouvé?!\stop
      Bon... bravo,
      petit.

  # ============================================================================
  # Chapitre 2 : Hameau-Grelot
  # ============================================================================

  # Le Bateau-Rondin (INTERAC_BALLADE_OBJECT $00) : autant d'îles que Marine en a repéré
  - name: TX_5a50
    index: 0x50
    text: |-
      \col(1)Marine\col(0): Je
      lis le vent...
      Où va-t-on?\stop
       \opt()Brume
       \opt()Grelot

  - name: TX_5a51
    index: 0x51
    text: |-
      \col(1)Marine\col(0): Je
      lis le vent...
      Où va-t-on?\stop
       \opt()Brume \opt()Grelot
       \opt()Lagune

  - name: TX_5a52
    index: 0x52
    text: |-
      \col(1)Marine\col(0): Je
      lis le vent...
      Où va-t-on?\stop
       \opt()Brume \opt()Grelot
       \opt()Lagune \opt()Braise

  - name: TX_5a53
    index: 0x53
    text: |-
      \col(1)Marine\col(0): Mais
      on y est déjà,
      gros malin!

  # Fin du chapitre 1, au port (après « À l'abordaaaage ! ») : Marine lit le vent
  - name: TX_5a54
    index: 0x54
    text: |-
      \col(1)Marine\col(0): Chut!
      Écoute...\stop
      Le vent... Il
      sent le sucre
      d'orge.\stop
      Et il fait
      tinter des
      grelots!\stop
      Il y a une île,
      là-bas, au nord!
      Des gens y ont
      perdu leurs
      rêves, je le
      sens.\stop
      Ton vieux rondin
      flotte encore au
      Ponton, à
      l'ouest du
      village.\stop
      Avec quelques
      cordes, ça fera
      un radeau!\stop
      Je lirai le
      vent... et toi,
      tu rameras!

  # En arrivant à Hameau-Grelot, la première fois (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a55
    index: 0x55
    text: |-
      \col(1)Marine\col(0): Terre!\stop
      Des maisons de
      toutes les
      couleurs... et
      ce bruit de
      grelots!\stop
      Mais c'est
      vraiment calme,
      pour un village
      plein d'enfants.

  # La grotte de la Boîte (5:b0), en entrant la première fois : Marine apprend à porter une bombe
  - name: TX_5a56
    index: 0x56
    text: |-
      \col(1)Marine\col(0): Oh!
      Un grelot, de
      l'autre coté du
      gouffre!\stop
      Si on le faisait
      sonner?\stop
      J'ai une idée!
      Tiens une bombe
      au-dessus de ta
      tête, et appuie
      sur \col(1)SELECT\col(0)!\stop
      Je la porterai
      par-dessus le
      trou. Mais fais
      vite: ça brûle!

  # Devant la falaise de la grotte (1:32), la première fois
  - name: TX_5a57
    index: 0x57
    text: |-
      \col(1)Marine\col(0): Des
      rochers bouchent
      une grotte...\stop
      Une bombe ferait
      l'affaire. Le
      marchand du
      village en vend
      peut-être?

  # L'aubergiste donne le Carnet des Rêves (tour du village, ou plus tard en lui parlant)
  - name: TX_5a58
    index: 0x58
    text: |-
      Tiens, petit:
      mon vieux livre
      d'or.\stop
      Avant, mes
      clients y
      écrivaient leurs
      rêves.\stop
      Note-y ceux que
      tu rendras aux
      gens!

  # Lila (maison de Lila, 3:21), avant de retrouver son jouet
  - name: TX_5a59
    index: 0x59
    text: |-
      \col(1)Lila\col(0): Je ne
      sais plus jouer.\stop
      Avant, Sire
      Bouchon et moi,
      on chassait les
      dragons...\stop
      Mais il est
      tombé dans la
      grotte de la
      Boîte. Et les
      rochers l'ont
      bouchée.\stop
      Sans lui, je
      n'arrive plus à
      faire semblant.

  # Lila retrouve Sire Bouchon, et s'endort
  - name: TX_5a5a
    index: 0x5a
    text: |-
      \col(1)Lila\col(0): Sire
      Bouchon! Tu l'as
      retrouvé!\stop
      Oh... il a l'air
      de dire qu'il a
      vu un dragon...\stop
      *bâille*
      J'ai sommeil,
      tout à coup...\stop
      Viens jouer dans
      mon rêve, toi
      aussi... Zzz...

  - name: TX_5a5b
    index: 0x5b
    text: |-
      \col(1)Marine\col(0): Elle
      s'est endormie!\stop
      Allonge-toi sur
      le lit, à coté:
      on entrera dans
      son rêve!

  - name: TX_5a5c
    index: 0x5c
    text: |-
      \col(1)Lila\col(0): Zzz...
      À l'attaque,
      Sire Bouchon...
      Zzz...

  # Dans le rêve de Lila (2:21)
  - name: TX_5a5d
    index: 0x5d
    text: |-
      \col(1)Lila\col(0): Tu es
      venu! Bienvenue
      dans mon rêve!\stop
      Mes jouets sont
      dans le grand
      coffre...\stop
      Mais un vilain
      Pantin les garde
      tous! Il ne veut
      plus qu'on joue.\stop
      Tu les sauves,
      dis?

  - name: TX_5a5e
    index: 0x5e
    text: |-
      Le \col(1)Coffre à
      Jouets\col(0). Entrer?
       \opt()Oui \opt()Non

  # Le Carnet des Rêves (ITEM_12), selon le nombre d'îles sauvées
  - name: TX_5a60
    index: 0x60
    text: |-
      \col(1)Carnet des
      Rêves\col(0)\stop
      \col(1)Brume\col(0): la
      dame dort, le
      vieux ne compte
      plus. Rendus!\stop
      \col(1)Grelot\col(0): Lila
      ne sait plus
      faire semblant.
      Les enfants ne
      jouent plus...

  - name: TX_5a61
    index: 0x61
    text: |-
      \col(1)Carnet des
      Rêves\col(0)\stop
      \col(1)Brume\col(0): la
      dame dort, le
      vieux ne compte
      plus. Rendus!\stop
      \col(1)Grelot\col(0): Lila
      invente des
      chevaliers. Les
      enfants jouent!

  # Le Coffre à Jouets : Marine devant le grelot (4:34)
  - name: TX_5a62
    index: 0x62
    text: |-
      \col(1)Marine\col(0): Encore
      un grelot, de
      l'autre coté du
      trou!\stop
      Tu sais ce qu'il
      faut faire: une
      bombe, et
      \col(1)SELECT\col(0)!

  # Pantin-Sans-Fil (le boss, 4:2b) menace ; Marine répond
  - name: TX_5a63
    index: 0x63
    text: |-
      \col(2)Pantin\col(0): Qui
      tient mes fils?
      Personne!\stop
      Alors je danse
      tout seul...
      et je t'écrase!\stop
      \col(1)Marine\col(0): Tu
      danses mal.\stop
      Link, il est
      trop haut pour
      toi. Mets-toi
      dessous, une
      bombe, \col(1)SELECT\col(0):
      je la lui fais
      avaler!\stop
      Mais il faut
      qu'il soit
      \col(1)rouge\col(0) quand
      j'arrive!\stop
      Tiens la bombe
      prête, et lance-
      moi dès qu'il
      devient violet!

  # Fin du chapitre 2 : Lila se réveille (3:21)
  - name: TX_5a64
    index: 0x64
    text: |-
      \col(1)Lila\col(0): Oh! Tu
      es là!\stop
      J'ai rêvé d'un
      chevalier tout
      vert...\stop
      Il avait une
      mouette dans sa
      tunique! Et il a
      coupé les fils
      d'un vilain
      pantin!\stop
      Sire Bouchon et
      lui, ils sont
      copains,
      maintenant!

  - name: TX_5a65
    index: 0x65
    text: |-
      \col(1)Marine\col(0): Hi
      hi... Un
      chevalier tout
      vert, hein?\stop
      Viens, allons
      voir dehors!

  # Fin du chapitre 2 : la place du Grelot (1:11)
  - name: TX_5a66
    index: 0x66
    text: |-
      Les enfants
      jouent de
      nouveau! On
      entend rire
      partout.\stop
      \col(1)Marine\col(0): Le
      grelot s'est
      remis à tinter!

  - name: TX_5a67
    index: 0x67
    text: |-
      \col(1)Marine\col(0): Chut...
      le vent a
      changé.\stop
      Il sent le sel
      et la fleur
      d'oranger.\stop
      Une île en
      forme d'anneau,
      au sud-est...\stop
      Quelqu'un y
      attend
      quelqu'un. Je le
      sens.

  # Les enfants de la place (INTERAC_BALLADE_OBJECT $0b, $0c), avant et après le Coffre à Jouets
  - name: TX_5a68
    index: 0x68
    text: |-
      On attend.\stop
      On n'a pas le
      droit de jouer.\stop
      Qui a dit ça?
      On ne sait
      plus...

  - name: TX_5a69
    index: 0x69
    text: |-
      On joue aux
      chevaliers!
      Toi, tu fais le
      Pantin!

  - name: TX_5a6a
    index: 0x6a
    text: |-
      Avant, on
      jouait à cache-
      cache...\stop
      Mais se cacher,
      à quoi bon?
      Personne ne
      cherche.

  - name: TX_5a6b
    index: 0x6b
    text: |-
      Chut! Je me
      cache!\stop
      Tu ne m'as pas
      vu, hein?

  # Mme Bonnet, la maîtresse (l'école, 3:22 ; INTERAC_BALLADE_OBJECT $0d)
  - name: TX_5a6c
    index: 0x6c
    text: |-
      \col(1)Mme Bonnet\col(0):
      Deux fois deux,
      quatre. Trois
      fois deux, six.\stop
      Avant, je
      racontais des
      histoires...\stop
      Je ne sais plus
      comment elles
      commencent.

  - name: TX_5a6d
    index: 0x6d
    text: |-
      \col(1)Mme Bonnet\col(0):
      Il était une
      fois... un
      chevalier vert,
      et une mouette
      qui chantait!\stop
      Ça me revient!

  # Lila, après le Coffre à Jouets
  - name: TX_5a6e
    index: 0x6e
    text: |-
      \col(1)Lila\col(0): Sire
      Bouchon et moi,
      on part chasser
      le dragon!\stop
      Tu viens?

  # Chapitre 3 : la Lagune des Serments (1:04-37)
  # En arrivant au ponton (1:24), la première fois (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a70
    index: 0x70
    text: |-
      \col(1)Marine\col(0): Une
      lagune! L'eau
      est toute
      turquoise...\stop
      Il y a une
      maison, là-haut.
      On va dire
      bonjour?

  # Gaspard (3:23 ; INTERAC_BALLADE_OBJECT $11) : avant la bouteille
  - name: TX_5a71
    index: 0x71
    text: |-
      \col(1)Gaspard\col(0):
      Bonjour, jeune
      homme. Je suis
      Gaspard.\stop
      La dame, là?
      Je ne la connais
      pas. Elle me
      fait du thé
      chaque matin.\stop
      Un jour, j'ai
      jeté une
      bouteille à la
      mer. Pour
      quelqu'un...\stop
      Elle est restée
      sur l'îlot, au
      milieu de la
      lagune.\stop
      Mais je ne sais
      plus pour qui.
      Ni comment on
      nage.\stop
      \col(1)Marine\col(0): La
      lagune est trop
      profonde...\stop
      Mais dans un
      rêve, la mer, ça
      s'écarte! Du
      coté ouest,
      peut-être?

  # Gaspard : Link lui rend la bouteille (il donne les Palmes de Zora)
  - name: TX_5a72
    index: 0x72
    text: |-
      \col(1)Gaspard\col(0): Ma
      bouteille! Il y
      a une lettre...\stop
      "Héloïse, je
      te retrouverai,
      même si tu
      m'oublies. G."\stop
      Héloïse...
      Héloïse!
      C'est ma femme!\stop
      Tiens, prends
      mes \col(1)Palmes de
      Zora\col(0).\stop
      Elles sont pour
      quelqu'un qui a
      encore quelqu'un
      à retrouver.\stop
      \col(1)Marine\col(0): ...Il
      parle de moi, tu
      crois?

  # Gaspard, après
  - name: TX_5a73
    index: 0x73
    text: |-
      \col(1)Gaspard\col(0): Chaque
      matin, je
      demande Héloïse
      en mariage.\stop
      Elle dit oui,
      à chaque fois!

  # Héloïse (3:23 ; INTERAC_BALLADE_OBJECT $0e) : avant / après le Récif Murmurant
  - name: TX_5a74
    index: 0x74
    text: |-
      \col(1)Héloïse\col(0):
      Bonjour! Ce
      monsieur? Un
      voisin, je
      crois.\stop
      Il a de beaux
      yeux tristes.
      Je lui fais du
      thé, ça l'aide.

  - name: TX_5a75
    index: 0x75
    text: |-
      \col(1)Héloïse\col(0): On
      s'est mariés sur
      la plage, là-
      haut. Je m'en
      souviens!\stop
      Il avait mis
      des palmes. Pour
      danser. Quel
      idiot!

  # Bulle, la monitrice du club de plongée (3:24 ; $0f)
  - name: TX_5a76
    index: 0x76
    text: |-
      \col(1)Bulle\col(0): Bienvenue
      au club de
      plongée!\stop
      Enfin... il est
      fermé. Plus
      personne ne rêve
      de voir le fond.

  - name: TX_5a77
    index: 0x77
    text: |-
      \col(1)Bulle\col(0): Le fond
      de la lagune
      brille à
      nouveau!\stop
      Reviens vite:
      on va plonger!

  # Le facteur des bouteilles (la plage des bouteilles, 1:35 ; $10)
  - name: TX_5a78
    index: 0x78
    text: |-
      \col(1)Le facteur\col(0): Je
      ramasse les
      bouteilles à la
      mer.\stop
      Mais je ne sais
      plus à qui
      rendre les
      lettres...\stop
      Moi, personne ne
      m'a jamais
      écrit.

  - name: TX_5a79
    index: 0x79
    text: |-
      \col(1)Le facteur\col(0): Une
      bouteille, ce
      matin! Pour
      moi!\stop
      "Merci d'avoir
      gardé nos mots.
      H. et G."

  # La grotte des amoureux (5:b1), en entrant (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a7a
    index: 0x7a
    text: |-
      \col(1)Marine\col(0): Des
      cœurs gravés
      partout...\stop
      "G + H, pour
      toujours."\stop
      Gaspard et
      Héloïse!\stop
      ...Hé! Ne me
      regarde pas
      comme ça!

  # Devant le Récif Murmurant (1:36), la première fois
  - name: TX_5a7b
    index: 0x7b
    text: |-
      \col(1)Marine\col(0): Le Récif
      Murmurant... Tu
      l'entends
      chuchoter?\stop
      Là-dedans, c'est
      l'eau partout.
      Une mouette, ça
      ne plonge pas.\stop
      Je t'attends
      ici, \Link.
      Reviens vite.

  # Fin du chapitre 3 : la plage des bouteilles (1:35), Marine attendait
  # Le Carnet des Rêves, après la Lagune des Serments (3 îles sauvées)
  - name: TX_5a7f
    index: 0x7f
    text: |-
      \col(1)Carnet des
      Rêves\col(0)\stop
      \col(1)Brume\col(0): la
      dame dort, le
      vieux ne compte
      plus. Rendus!\stop
      \col(1)Grelot\col(0): Lila
      invente des
      chevaliers. Les
      enfants jouent!\stop
      \col(1)Lagune\col(0):
      Héloïse et
      Gaspard se
      souviennent.
      Mariés tous les
      matins!

  - name: TX_5a7c
    index: 0x7c
    text: |-
      \col(1)Marine\col(0): \Link!\stop
      Tu as été long.
      Ne refais jamais
      ça.\stop
      ...Tu sais quoi?
      C'est ce que dit
      le troisième
      couplet. Mot
      pour mot.\stop
      Viens. Ça parle,
      chez Gaspard!

  # Chez Héloïse et Gaspard (3:23)
  - name: TX_5a7d
    index: 0x7d
    text: |-
      \col(1)Héloïse\col(0):
      Gaspard!
      Tu as mis tes
      palmes pour
      danser, ce jour-
      là...\stop
      \col(1)Gaspard\col(0): Et
      toi, tu as
      pleuré de rire.
      Bonjour, ma
      femme.

  - name: TX_5a7e
    index: 0x7e
    text: |-
      \col(1)Marine\col(0): Chut...
      le vent a
      tourné.\stop
      Il sent la
      fumée et le fer
      chaud.\stop
      Une montagne qui
      fume, au nord...
      On y entend
      cogner.


  # Le menu de test caché (code/ages/balladeDebug.s ; HAUT tenu 5 s à l'écran titre) :
  # la langue, l'île, le moment, et dans le donjon l'endroit. Le même dans les deux fichiers.
  - name: TX_5af0
    index: 0xf0
    text: |-
       \opt()Français
       \opt()English

  - name: TX_5af1
    index: 0xf1
    text: |-
       \opt()1 \opt()2 \opt()3 \opt()4
       \opt()5 \opt()6 \opt()7 \opt()8

  - name: TX_5af2
    index: 0xf2
    text: |-
       \opt()Plage \opt()Ville
       \opt()Donjon \opt()Fin

  - name: TX_5af3
    index: 0xf3
    text: |-
       \opt()Entrée \opt()M-boss
       \opt()Boss

  # Le choix de la langue, au début d'une nouvelle partie (le même dans les deux fichiers)
  - name: TX_5a17
    index: 0x17
    text: |-
         \opt()Français
         \opt()English

  # Chapitre 4 : Mont-Braise (1:08-3c)
  # En arrivant au ponton (1:38), la première fois (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a80
    index: 0x80
    text: |-
      \col(1)Marine\col(0): Pouah,
      ça sent l'œuf
      pourri!\stop
      Un volcan...
      Il dort, mais
      il ronfle.\stop
      On entend
      cogner, là-haut.
      Toujours le même
      coup. Bong.
      Bong. Bong.

  # Brasia, la forgeronne goron (1:2a ; INTERAC_BALLADE_OBJECT $14) : avant le tableau
  - name: TX_5a81
    index: 0x81
    text: |-
      \col(1)Brasia\col(0): Bong!
      Quatre cent
      douze épées!
      Toutes
      pareilles!\stop
      Je n'ai plus
      d'idées, petit.
      Plus une. Le
      volcan dort, ma
      tête aussi.\stop
      Si quelqu'un me
      montrait un truc
      que je n'ai
      jamais vu...

  # Brasia : Link lui montre le tableau de la mer (elle donne le Bracelet de force)
  - name: TX_5a82
    index: 0x82
    text: |-
      \col(1)Brasia\col(0): C'est...
      la mer?! Bleue,
      qui bouge, qui
      ne tient pas en
      place!\stop
      Une épée en
      forme de vague!
      J'ai une idée!
      UNE IDÉE!\stop
      Tiens, mon
      \col(1)Bracelet de
      force\col(0). Je n'en
      ai plus besoin:
      j'ai une idée!

  - name: TX_5a83
    index: 0x83
    text: |-
      \col(1)Brasia\col(0): Bong!
      Une vague! Bong!
      Une autre vague!
      Aucune pareille!

  # Pinceau, le peintre (1:19, dans le Réel ; $15) : avant / après la Forge Endormie
  - name: TX_5a84
    index: 0x84
    text: |-
      \col(1)Pinceau\col(0): Le
      volcan. Encore
      le volcan.\stop
      Je ne sais
      peindre que lui.
      Pourtant, il
      paraît qu'il y a
      la mer, en bas.\stop
      Je ne la vois
      pas. Même les
      yeux fermés.

  - name: TX_5a85
    index: 0x85
    text: |-
      \col(1)Pinceau\col(0): Je
      peins la mer,
      la lagune, une
      mouette...\stop
      Elle te
      ressemble, ta
      mouette!

  # Pinceau dans le Songe (0:19 ; $16) : il voit la mer, et peint ; il donne le tableau
  - name: TX_5a86
    index: 0x86
    text: |-
      \col(1)Pinceau\col(0): La
      mer! Je la vois!
      Les yeux fermés,
      je la vois!\stop
      Vite, vite...
      Voilà!\stop
      Prends ce
      tableau. Montre-
      le à quelqu'un
      qui en a besoin.

  - name: TX_5a87
    index: 0x87
    text: |-
      \col(1)Pinceau\col(0): Je
      peins encore la
      mer. Et le ciel.
      Et toi!

  # Un musicien des Cuivres, la fanfare goron (1:2a ; $17)
  - name: TX_5a88
    index: 0x88
    text: |-
      \col(1)Les Cuivres\col(0):
      Pouet. Pouet.
      Pouet.\stop
      On joue la même
      note depuis cent
      ans. Elle est
      jolie, non?

  - name: TX_5a89
    index: 0x89
    text: |-
      \col(1)Les Cuivres\col(0):
      Pouet-tagada-
      pouet! On a
      trouvé une
      deuxième note!

  # Le marchand de copies (1:3a ; $18)
  - name: TX_5a8a
    index: 0x8a
    text: |-
      \col(1)Le marchand\col(0):
      Des copies! Des
      copies de
      copies!\stop
      Un quart de
      cœur? Tout
      neuf! Enfin...
      un dessin de
      quart de cœur.

  - name: TX_5a8b
    index: 0x8b
    text: |-
      \col(1)Le marchand\col(0):
      Plus personne
      n'achète mes
      copies...\stop
      Tant mieux!
      J'en ai marre
      de recopier.

  # Fin du chapitre 4 : le village goron (1:2a), l'essence de la Forge Endormie
  - name: TX_5a8c
    index: 0x8c
    text: |-
      \col(1)Marine\col(0): Écoute!
      Ça ne cogne plus
      pareil. Bong!
      Bing! Badaboum!\stop
      Le volcan s'est
      réveillé... mais
      en douceur.

  - name: TX_5a8d
    index: 0x8d
    text: |-
      \col(1)Brasia\col(0): Une
      épée-vague! Une
      épée-nuage! Une
      épée-mouette!\stop
      \col(1)Les Cuivres\col(0):
      Pouet-tagada-
      boum-pouet!\stop
      \col(1)Marine\col(0): Une
      épée-mouette?
      Ça me plaît!

  - name: TX_5a8e
    index: 0x8e
    text: |-
      \col(1)Marine\col(0): Chut...
      le vent a
      tourné.\stop
      Il sent la
      cloche, le
      vieux papier...\stop
      Une île, à
      l'ouest, où tout
      se répète deux
      fois. Deux fois.

  # Chapitre 5 : l'île des Échos (1:40-74)
  # En arrivant au ponton (1:70), la première fois
  - name: TX_5a90
    index: 0x90
    text: |-
      \col(1)Marine\col(0): ...C'est
      tout gris, ici.\stop
      Tu entends? Les
      cloches. Le vent
      les fait sonner
      toutes seules.\stop
      On dirait que
      l'île entière
      se souvient de
      quelqu'un.

  # Le cimetière de l'est, devant la tombe fleurie, la première fois
  - name: TX_5a91
    index: 0x91
    text: |-
      \col(1)Marine\col(0): Une
      tombe avec des
      fleurs fraîches.\stop
      Quelqu'un vient
      encore lui
      parler...

  # Bêche, le fossoyeur (3:25) : il prête la Pelle
  - name: TX_5a92
    index: 0x92
    text: |-
      \col(1)Bêche\col(0): Un
      visiteur? Ici?
      Personne ne
      vient plus.\stop
      Moi, je creuse.
      Tous les jours.
      Pour ne pas
      penser.\stop
      Tiens, prends
      ma \col(1)Pelle\col(0).
      Déterre ce qui
      doit l'être.

  - name: TX_5a93
    index: 0x93
    text: |-
      \col(1)Bêche\col(0): Ma
      pelle te va
      bien. Creuse
      doucement: la
      terre se
      souvient.

  # Noé, sur la place du silence (1:62 ; $1a) : avant / après la cathédrale
  - name: TX_5a94
    index: 0x94
    text: |-
      \col(1)Noé\col(0): Mamie
      chantait tout le
      temps.\stop
      Mais je ne me
      souviens plus
      de sa voix.\stop
      Même en fermant
      les yeux.
      Surtout en
      fermant les
      yeux.

  - name: TX_5a95
    index: 0x95
    text: |-
      \col(1)Noé\col(0): Je
      l'entends!
      La la laa...\stop
      C'est sa
      chanson. Je
      l'avais dans la
      tête, en fait!

  # La grand-mère de Noé, dans le Songe (0:62 ; $1b) : où est la clé
  - name: TX_5a96
    index: 0x96
    text: |-
      \col(1)Mamie Rose\col(0): Oh!
      Un petit
      chevalier, dans
      le rêve de mon
      Noé!\stop
      Le sonneur a
      fermé la
      cathédrale. Il
      avait peur du
      silence.\stop
      Moi, j'ai
      enterré la clé.
      Devant la tombe
      fleurie, au
      cimetière de
      l'est.\stop
      C'est la mienne,
      de tombe. Les
      fleurs, c'est
      Noé.

  # Elle donne le quart de cœur (sa boîte à couture)
  - name: TX_5a97
    index: 0x97
    text: |-
      \col(1)Mamie Rose\col(0): Tu
      as trouvé la
      clé? Alors
      tiens.\stop
      Je l'avais
      caché dans ma
      boîte à couture.
      Pour un jour
      comme ça.

  - name: TX_5a98
    index: 0x98
    text: |-
      \col(1)Mamie Rose\col(0): Dis
      à Noé que je
      chante encore.
      Il n'a qu'à
      écouter.

  # La grille de la cathédrale, sans la clé
  - name: TX_5a99
    index: 0x99
    text: |-
      La grille est
      fermée à clé.
      Une vieille
      serrure,
      rouillée.

  # La veuve Marée (1:74 ; $1c)
  - name: TX_5a9a
    index: 0x9a
    text: |-
      \col(1)Marée\col(0): Mon
      mari était
      pêcheur. Il
      partait avant
      l'aube.\stop
      Avant, je le
      voyais en rêve.
      Maintenant, je
      ne rêve plus.

  - name: TX_5a9b
    index: 0x9b
    text: |-
      \col(1)Marée\col(0): Cette
      nuit, il m'a
      fait signe. De
      loin. Il
      souriait.\stop
      Je crois que je
      vais bien
      dormir.

  # Le sonneur (1:63 ; $1d)
  - name: TX_5a9c
    index: 0x9c
    text: |-
      \col(1)Le sonneur\col(0):
      Ding! Dong!
      Je sonne, je
      sonne!\stop
      Si j'arrête, il
      n'y a plus que
      le silence. Et
      dans le silence,
      on se souvient.

  - name: TX_5a9d
    index: 0x9d
    text: |-
      \col(1)Le sonneur\col(0):
      Je sonne moins
      fort, ce soir.\stop
      Le silence, au
      fond, ça
      s'écoute.

  # La Cathédrale des Échos : l'entrée (5:aa), la première fois
  - name: TX_5a9e
    index: 0x9e
    text: |-
      \col(1)Marine\col(0): Chut!
      Quelqu'un veille
      ici.\stop
      Les Veilleurs
      de l'Insomnis.
      Ils ne dorment
      jamais.\stop
      S'ils te voient,
      tu te réveilles
      à l'entrée de
      la salle.\stop
      Passe dans leur
      dos. Cache-toi
      derrière les
      statues.

  # Le chœur (5:7b), la première fois : l'escalier vers le souvenir
  - name: TX_5a9f
    index: 0x9f
    text: |-
      \col(1)Marine\col(0): Cet
      escalier...\stop
      Ça sent le sel.
      Et la soupe
      chaude.\stop
      ...Je connais
      cette odeur.

  # Tarkin, dans le souvenir (3:26, la maison de Marine à Mabe ; $20) : la scène
  - name: TX_5aa0
    index: 0xa0
    text: |-
      \col(1)Tarkin\col(0): Oh! Un
      visiteur!\stop
      Assieds-toi,
      petit. La soupe
      est presque
      prête.\stop
      Je mets toujours
      trois assiettes.
      Ma fille va
      rentrer.\stop
      Elle chante au
      bord de la mer.
      Elle rentre
      toujours.

  - name: TX_5aa1
    index: 0xa1
    text: |-
      \col(1)Marine\col(0): ...Papa.\stop
      Il ne me voit
      pas. Je ne suis
      qu'une mouette,
      ici.\stop
      Ça ne fait
      rien. Je vais
      lui chanter le
      couplet.

  - name: TX_5aa2
    index: 0xa2
    text: |-
      \col(1)Tarkin\col(0): Tiens!
      Cette mouette
      chante comme
      ma Marine.\stop
      "Si un jour tu
      m'oublies,
      écoute la mer:
      je chante
      encore."\stop
      ...C'est d'elle,
      ça. J'en suis
      sûr.

  - name: TX_5aa3
    index: 0xa3
    text: |-
      \col(1)Tarkin\col(0): Elle va
      rentrer. Elle
      rentre toujours.

  # Fin du chapitre 5 : la place du silence (1:62), les cloches chantent
  - name: TX_5aa4
    index: 0xa4
    text: |-
      \col(1)Noé\col(0): Écoutez!
      Les cloches...
      elles chantent!\stop
      La la laa...
      C'est la
      chanson de
      Mamie!\stop
      \col(1)Le sonneur\col(0):
      Je n'ai touché
      à rien! C'est
      le vent qui
      sonne.

  - name: TX_5aa5
    index: 0xa5
    text: |-
      \col(1)Marine\col(0): Chut...
      le vent a
      tourné.\stop
      Il monte. Tout
      droit, vers les
      nuages.\stop
      Il sent la
      plume... Une île
      là-haut, dans
      le ciel?

  # Le Carnet des Rêves, 4 îles sauvées
  - name: TX_5aa6
    index: 0xa6
    text: |-
      \col(1)Carnet des
      Rêves\col(0)\stop
      \col(1)Brume\col(0): la
      dame dort, le
      vieux ne compte
      plus. Rendus!\stop
      \col(1)Grelot\col(0): Lila
      invente des
      chevaliers. Les
      enfants jouent!\stop
      \col(1)Lagune\col(0):
      Héloïse et
      Gaspard se
      souviennent.
      Mariés tous les
      matins!\stop
      \col(1)Braise\col(0):
      Pinceau peint
      la mer. Plus
      deux épées
      pareilles!

  # Le Carnet des Rêves, 5 îles sauvées
  - name: TX_5aa7
    index: 0xa7
    text: |-
      \col(1)Carnet des
      Rêves\col(0)\stop
      \col(1)Brume\col(0): la
      dame dort, le
      vieux ne compte
      plus. Rendus!\stop
      \col(1)Grelot\col(0): Lila
      invente des
      chevaliers. Les
      enfants jouent!\stop
      \col(1)Lagune\col(0):
      Héloïse et
      Gaspard se
      souviennent.
      Mariés tous les
      matins!\stop
      \col(1)Braise\col(0):
      Pinceau peint
      la mer. Plus
      deux épées
      pareilles!\stop
      \col(1)Échos\col(0): Noé
      entend chanter
      sa Mamie. Marée
      rêve encore.

  # Le Bateau-Rondin, plus de 4 îles : la première page (« Suite » : la deuxième)
  - name: TX_5aa8
    index: 0xa8
    text: |-
      \col(1)Marine\col(0): Je
      lis le vent...
      Où va-t-on?\stop
       \opt()Brume \opt()Grelot
       \opt()Lagune \opt()Suite

  # La deuxième page : 5 îles repérées
  - name: TX_5aa9
    index: 0xa9
    text: |-
      \col(1)Marine\col(0): Plus
      loin, alors...\stop
       \opt()Braise
       \opt()Échos

  # 6 îles
  - name: TX_5aaa
    index: 0xaa
    text: |-
      \col(1)Marine\col(0): Plus
      loin, alors...\stop
       \opt()Braise \opt()Échos
       \opt()Nid

  # 7 îles
  - name: TX_5aab
    index: 0xab
    text: |-
      \col(1)Marine\col(0): Plus
      loin, alors...\stop
       \opt()Braise \opt()Échos
       \opt()Nid \opt()Sommeil

  # 8 îles (l'Œil de l'Insomnis ne se rejoint pas en radeau)
  - name: TX_5aac
    index: 0xac
    text: |-
      \col(1)Marine\col(0): Plus
      loin, alors...\stop
       \opt()Braise \opt()Échos
       \opt()Nid \opt()Sommeil

  # Chapitre 6 : le Nid des Vents (1:45-78)
  # En arrivant au courant ascendant (1:75), la première fois
  - name: TX_5aad
    index: 0xad
    text: |-
      \col(1)Marine\col(0): On
      vole!\stop
      ...Non: c'est
      l'île qui vole.
      Accroche-toi,
      ça souffle.\stop
      Et regarde où tu
      marches. En bas,
      il n'y a que des
      nuages.

  # Le pont de nuages (1:57), la première fois
  - name: TX_5aae
    index: 0xae
    text: |-
      \col(1)Marine\col(0): Il
      manque des
      planches...\stop
      Tu te souviens?
      Dans le Songe,
      rien ne tombe.
      Les nuages
      tiennent,
      là-bas.

  # Le Rito égaré (1:76 ; $21) : avant / après le Nid
  - name: TX_5aaf
    index: 0xaf
    text: |-
      \col(1)Rito\col(0): Je suis
      un Rito. Je
      crois.\stop
      J'ai oublié le
      chemin de la
      maison...\stop
      Et comment on
      vole. C'est
      bête, pour un
      oiseau.

  - name: TX_5ab0
    index: 0xb0
    text: |-
      \col(1)Rito\col(0): Le vent
      chante! Je me
      souviens!\stop
      On ouvre les
      bras, et on se
      laisse porter.
      Au revoir!

  # Zéphyr (1:67 ; $22) : avant / après le Nid
  - name: TX_5ab1
    index: 0xb1
    text: |-
      \col(1)Zéphyr\col(0): Ces
      ailes, je les ai
      faites moi-même.\stop
      Mais sauter...
      Et si elles ne
      marchaient pas?\stop
      Je m'entraîne.
      Je regarde en
      bas. Beaucoup.

  - name: TX_5ab2
    index: 0xb2
    text: |-
      \col(1)Zéphyr\col(0): J'ai
      sauté!\stop
      J'ai plané
      jusqu'aux
      moulins! Elles
      marchent, mes
      ailes!

  # Zéphyr dans le Songe (0:67 ; $23)
  - name: TX_5ab3
    index: 0xb3
    text: |-
      \col(1)Zéphyr\col(0): Dans
      mes rêves, je
      vole!\stop
      Et les nuages
      tiennent debout.
      Le pont aussi:
      on marche
      dessus.

  # Les meuniers (1:66 ; $24) : avant / après le Nid
  - name: TX_5ab4
    index: 0xb4
    text: |-
      \col(1)Meunier\col(0): Le
      vent s'est
      arrêté.\stop
      Les ailes du
      moulin dorment.
      Et le grain
      aussi.

  - name: TX_5ab5
    index: 0xb5
    text: |-
      \col(1)Meunier\col(0): Ça
      tourne! Ça
      chante!\stop
      On n'avait
      jamais moulu si
      fin.

  # Mère Plume, au Nid (1:48 ; $25) : elle donne la Plume de Roc
  - name: TX_5ab6
    index: 0xb6
    text: |-
      \col(1)Mère Plume\col(0):
      Un petit
      d'homme, venu
      sans ailes
      jusqu'à mon nid?\stop
      Tiens. Une plume
      de Roc: elle
      t'apprendra à
      sauter.

  - name: TX_5ab7
    index: 0xb7
    text: |-
      \col(1)Mère Plume\col(0):
      Le Nid t'attend.
      Saute, petit.\stop
      Le ciel
      rattrape ceux
      qui sautent.

  # La Spirale Céleste : l'entrée (4:3c), la première fois
  - name: TX_5ab8
    index: 0xb8
    text: |-
      \col(1)Marine\col(0): Une
      spirale... On
      tourne autour du
      cœur du nid.\stop
      Des trous
      partout. Ne
      regarde pas en
      bas: saute!

  # L'Ombre de Marine (4:54) : elle parle avec la voix de Marine ; Marine lui répond
  - name: TX_5ab9
    index: 0xb9
    text: |-
      \col(1)L'Ombre\col(0): Reste
      endormi, \Link.\stop
      Reste avec moi.
      Ici, personne ne
      s'en va jamais.\stop
      \col(1)Marine\col(0): ...Non.\stop
      Moi, je chante
      pour qu'il se
      réveille.

  # Fin du chapitre 6 : le village des plumes (1:67), le vent revient
  - name: TX_5aba
    index: 0xba
    text: |-
      \col(1)Meunier\col(0): Ça
      tourne! Les
      moulins
      tournent!\stop
      \col(1)Zéphyr\col(0): Le vent
      est revenu. Je
      saute!\stop
      ...Il plane! Il
      plane jusqu'aux
      moulins!\stop
      \col(1)Rito\col(0): Merci!
      Je rentre chez
      moi!

  - name: TX_5abb
    index: 0xbb
    text: |-
      \col(1)Marine\col(0): Chut...
      le vent a
      tourné.\stop
      Il est froid. Il
      sent la neige...
      et le sommeil.\stop
      Une île où tout
      le monde dort.
      Sans se
      réveiller.








# ==============================================================================
# Textes d'Ages remplacés (même nom) : les objets qu'on trouve parlent français
# ==============================================================================
- group: 0x00
  data:
  # L'essence du 2e donjon : le deuxième couplet
  - name: TX_000f
    index: 0x0f
    text: |-
      \pos(2)\slow()Le Pantin n'a
      plus de fils.
      Les jouets de
      Lila dansent!\stop
      Tu as trouvé le
      \col(1)deuxième couplet\col(0)
      de la chanson de
      Marine!\stop
      \col(1)Marine\col(0): Deux
      couplets...\stop
      Celui-là parle
      d'une petite
      fille qui rêve
      d'un chevalier.\stop
      ...Il te
      ressemble un
      peu, non?

  - name: TX_0022
    index: 0x22
    text: |-
      Le \col(1)Boomerang-
      Toupie\col(0)! Il
      frappe de loin
      et revient!\stop
      Il atteint les
      cristaux qu'on
      ne touche pas
      à l'épée.
  # La Lagune : la bouteille (objet d'échange 1, l'ancien papier à lettres d'Ages)
  - name: TX_005b
    index: 0x5b
    text: |-
      Une \col(1)bouteille
      à la mer\col(0)!\stop
      Dedans, une
      vieille lettre,
      toute roulée.

  - name: TX_0031
    index: 0x31
    text: |-
      Les \col(1)Palmes de
      Zora\col(0)! Tu sais
      nager!\stop
      Va dans l'eau,
      et \bbtn pour
      plonger.

  # Les Écailles de Sirène (le costume de sirène d'Ages)
  - name: TX_0036
    index: 0x36
    text: |-
      Les \col(1)Écailles de
      Sirène\col(0)!\stop
      Tu nages dans
      l'eau profonde,
      et \bbtn: tu
      plonges!

  # L'essence du 3e donjon : le troisième couplet
  - name: TX_0010
    index: 0x10
    text: |-
      \pos(2)\slow()La Murène a
      rendu les mots
      doux qu'elle
      avait avalés.\stop
      Tu as trouvé le
      \col(1)troisième
      couplet\col(0) de la
      chanson de
      Marine!



  - name: TX_005a
    index: 0x5a
    text: |-
      Tu as retrouvé
      \col(1)Sire Bouchon\col(0)!\stop
      Le chevalier de
      bois de Lila...
      Il a l'air de
      s'ennuyer.

  - name: TX_0072
    index: 0x72
    text: |-
      Le \col(1)Carnet des
      Rêves\col(0)!\stop
      Les rêves que
      tu rends aux
      gens y sont
      notés.\stop
      Mets-le sur un
      bouton (Start)
      pour le lire.

  - name: TX_004d
    index: 0x4d
    text: |-
      Tu as eu dix
      \col(1)bombes\col(0)!

  - name: TX_004c
    index: 0x4c
    text: |-
      Tu as eu trois
      \col(1)cœurs\col(0)!
  - name: TX_006d
    index: 0x6d
    text: |-
      Une \col(1)fée en
      bouteille\col(0)! Elle
      te relèvera si
      tu n'as plus de
      cœurs!

  # L'essence du 1er donjon devient le premier couplet de la chanson de Marine
  - name: TX_000e
    index: 0x0e
    text: |-
      \pos(2)\slow()Le Veilleur dort
      enfin. Il rêve
      de sa femme, qui
      lui apporte la
      soupe...\stop
      Tu as trouvé le
      \col(1)premier couplet\col(0)
      de la chanson de
      Marine!\stop
      \col(1)Marine\col(0): Tu
      l'entends? Ce
      n'est pas la
      Ballade du
      Poisson-Rêve...\stop
      C'est la mienne.
      Ma chanson à
      moi!

  - name: TX_0016
    index: 0x16
    text: |-
      Tu as trouvé un
      \col(1)réceptacle de
      cœur\col(0)!

  - name: TX_001a
    index: 0x1a
    text: |-
      Tu as trouvé une
      \col(1)petite clé\col(0)!\stop
      Elle ouvre une
      porte ou un bloc
      verrouillé de ce
      donjon.

  - name: TX_001b
    index: 0x1b
    text: |-
      Tu as trouvé la
      \col(1)clé du boss\col(0)!

  - name: TX_001c
    index: 0x1c
    text: |-
      Tu as retrouvé
      ton \col(1)épée\col(0)!\stop
      Garde \abtn ou \bbtn
      enfoncé pour la
      charger, puis
      lâche pour une
      attaque
      tournoyante.

  - name: TX_0071
    index: 0x71
    text: |-
      Tu as trouvé la
      \col(1)Lanterne des
      Songes\col(0)!\stop
      Sa lumière vient
      du monde des
      rêves...

  # Rubis, cœurs, carte, boussole (traduits pour la démo)
  - name: TX_0000
    index: 0x00
    text: |-
      Tu as trouvé
      \col(1)1 rubis\col(0)!\stop
      ...
      C'est un début.
  - name: TX_0002
    index: 0x02
    text: |-
      Tu as trouvé
      \col(1)5 rubis\col(0)!
  - name: TX_0003
    index: 0x03
    text: |-
      Tu as trouvé
      \col(1)10 rubis\col(0)!
  - name: TX_0004
    index: 0x04
    text: |-
      Tu as trouvé
      \col(1)20 rubis\col(0)!
      Pas mal!
  - name: TX_0005
    index: 0x05
    text: |-
      Tu as trouvé
      \col(1)30 rubis\col(0)!
      Joli!
  - name: TX_0006
    index: 0x06
    text: |-
      Tu as trouvé
      \col(1)50 rubis\col(0)!
      Quelle chance!
  - name: TX_0007
    index: 0x07
    text: |-
      Tu as trouvé
      \col(1)100 rubis\col(0)!
      Tu dois être
      ravi!
  - name: TX_0008
    index: 0x08
    text: |-
      Tu as trouvé
      \col(1)150 rubis\col(0)!
      Bravo!!!
  - name: TX_0009
    index: 0x09
    text: |-
      Tu as trouvé
      \col(1)200 rubis\col(0)!
      Le bonheur!
  - name: TX_0017
    index: 0x17
    text: |-
      Tu as trouvé un
      \col(1)quart de cœur\col(0)!
      \heartpiece
      Réunis-en quatre
      pour gagner un
      cœur de plus!

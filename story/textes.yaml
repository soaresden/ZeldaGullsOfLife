      rêvé d'une fille
      avec une lampe.\stop
      Elle attendait
      quelqu'un.
      Toi, peut-être?
  - name: TX_5b1f
    index: 0x1f
    text: |-
      \col(1)Le facteur\col(0): Une
      lettre pour toi!
      De Hyrule!\stop
      Elle dit juste:
      "Le jour."
  - name: TX_5b20
    index: 0x20
    text: |-
      \col(1)Noé\col(0): Cette
      nuit, Mamie a
      chanté dans mon
      rêve.\stop
      Une chanson de
      mouette.
  - name: TX_5b21
    index: 0x21
    text: |-
      \col(1)Marée\col(0): J'ai
      dormi d'un
      trait.\stop
      Mon mari me
      souriait, en
      rêve.
  - name: TX_5b22
    index: 0x22
    text: |-
      Tout le monde
      dort, la nuit,
      maintenant!\stop
      Même moi.
      Surtout moi.
  - name: TX_5b23
    index: 0x23
    text: |-
      J'ai rêvé que tu
      chassais un gros
      monstre qui ne
      dormait jamais!

  # Marine suit Link, avec son épée (après la fin)
  - name: TX_5b24
    index: 0x24
    text: |-
      \col(1)Marine\col(0): Je
      viens! J'ai mon
      épée, regarde!\stop
      Partout où tu
      vas, je vais.
      Même dans les
      donjons!
  - name: TX_5b25
    index: 0x25
    text: |-
      \col(1)Marine\col(0): Ma
      maison! Je reste
      un peu ici.\stop
      Reviens me
      chercher sur la
      plage!

  # Les Songes des Héros (code/ages/balladeSonges.s) : au Nid des Vents, dans le Songe
  - name: TX_5b26
    index: 0x26
    text: |-
      \col(1)Marine\col(0): Le
      Nid des Vents...\stop
      Ici passent les
      rêves de ceux
      qui voulaient
      voler.\stop
      Et ceux des
      héros d'avant
      toi! Touche une
      bulle, tu vas
      voir!

  # La fée qui parle tout le temps (1er rêve)
  - name: TX_5b27
    index: 0x27

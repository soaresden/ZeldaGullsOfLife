# Textes du jeu, en français (UTF-8 : é, è, à, ç, œ... sont acceptés tels quels).
# tools/make_text.py les ajoute au texte d'Oracle of Ages (groupe 0x5a, libre).
#
# Règles du moteur : 16 caractères par ligne au maximum (le style ">-" coupe
# les lignes tout seul, mais le style "|-" avec des
# retours à la ligne choisis à la main rend mieux), \stop = attendre A puis vider la boîte, \opt() = choix,
# \Link = nom du joueur. Pas d'espace avant ! et ? (comme la VF officielle).
#
# Chapitre 1 : la plage

groups:
- group: 0x5a
  data:

  # Prologue (film d'ouverture)
  - name: TX_5a00
    index: 0x00
    text: |-
      Le Poisson-Rêve
      s'était éveillé.
      L'île Cocolint
      avait disparu
      dans l'écume.\stop
      Accroché à une
      épave, le héros
      dériva de longs
      jours...\stop
      ...jusqu'à un
      archipel où plus
      personne ne
      rêvait.

  # La mouette se pose à côté de Link
  - name: TX_5a01
    index: 0x01
    text: |-
      Hé!
      Réveille-toi,
      gros dormeur!\stop
      ...\stop
      Tu ne me
      reconnais pas?\stop
      Pourtant, je
      t'ai déjà sorti
      de l'eau une
      fois.\stop
      Ça devient une
      habitude!

  # Link est debout
  - name: TX_5a02
    index: 0x02
    text: |-
      C'est moi,
      \col(1)Marine\col(0)!\stop
      Tu te souviens?
      Sur la plage, je
      t'avais dit que
      si j'étais une
      mouette, je
      volerais au-delà
      de la mer...\stop
      Avant de se
      réveiller, le
      Poisson-Rêve a
      entendu mon vœu.\stop
      Il m'a dit:
      "Ce qui est rêvé
      assez fort ne
      disparaît jamais
      vraiment."\stop
      Et voilà: vœu
      exaucé, mot pour
      mot!\stop
      J'aurais peut-
      être dû préciser
      que je voulais
      garder mes
      mains...\stop
      Mais je ne vais
      pas me plaindre!\stop
      Tu es content
      de me revoir?
        \opt()Oui \opt()Bien sûr

  - name: TX_5a03
    index: 0x03
    text: |-
      Juste "oui"?\stop
      Toujours aussi
      bavard, toi.\stop
      Ça m'avait
      manqué,
      figure-toi.\stop
      Allez, viens.
      Il y a quelque
      chose de bizarre
      sur cette île...

  - name: TX_5a04
    index: 0x04
    text: |-
      Hi hi!
      Moi aussi,
      tu sais.\stop
      Allez, viens.
      Il y a quelque
      chose de bizarre
      sur cette île...

  # Elle a froid : elle va se mettre dans la tunique de Link
  - name: TX_5a05
    index: 0x05
    text: |-
      Tu sens ça,
      \Link?
      Cet archipel est
      trop calme.\stop
      Brr! Et le vent
      de la mer est
      glacé...\stop
      Bon. Je me mets
      au chaud dans ta
      tunique!\stop
      Et pas de
      commentaire!

  # Depuis la tunique (elle y passera toute l'aventure)
  - name: TX_5a06
    index: 0x06
    text: |-
      Mmh... Ça sent
      le sel et
      l'aventure,
      là-dedans.\stop
      Allons voir s'il
      y a quelqu'un.\stop
      Et ne casse pas
      toutes leurs
      jarres, cette
      fois!\stop
      Si tu veux me
      parler, appuie
      sur \col(1)SELECT\col(0).\stop
      Pour ta carte,
      garde \col(1)SELECT\col(0)
      enfoncé.

  # ============================================================================
  # Select (appui court) : Marine parle depuis la tunique (code/ages/balladeMarine.s)
  # ============================================================================

  # Sur la plage du réveil
  - name: TX_5a07
    index: 0x07
    text: |-
      Personne sur la
      plage...\stop
      Les gens doivent
      vivre plus loin.
      Allons voir!

  # Partout ailleurs : une réplique au hasard
  - name: TX_5a10
    index: 0x10
    text: |-
      Oui? Tu as
      besoin de moi?\stop
      Je faisais une
      petite sieste...

  - name: TX_5a11
    index: 0x11
    text: |-
      Hé! Arrête de
      me secouer!\stop
      Je suis très
      bien installée,
      moi!

  - name: TX_5a12
    index: 0x12
    text: |-
      Tu sais que tu
      ronfles, quand
      tu dors?\stop
      Comme mon père.\stop
      ...Ça me fait
      un peu de bien,
      en fait.

  - name: TX_5a13
    index: 0x13
    text: |-
      Perdu? Garde
      \col(1)SELECT\col(0) enfoncé
      pour ta carte.\stop
      Et pour moi, un
      petit appui
      suffit!

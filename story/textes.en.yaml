- group: 0x00
  data:
  # Our rings (unused Ages texts: the ring box, fairy powder...)
  - name: TX_0057
    index: 0x57
    text: |-
      The \col(1)Power
      Ring\col(0)!\stop
      Your sword hits
      harder, but you
      take more harm.
      A in the menu
      to wear it.
  - name: TX_0058
    index: 0x58
    text: |-
      The \col(1)Armor
      Ring\col(0)!\stop
      You take less
      harm, but your
      sword hits
      softer.
  - name: TX_0059
    index: 0x59
    text: |-
      The \col(1)Charge
      Ring\col(0)!\stop
      Your Spin Attack
      charges much
      faster.
  - name: TX_0055

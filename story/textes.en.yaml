      The \col(1)Chameleon
      Ring\col(0)!\stop
      Wear it in the
      menu: you pick
      your tunic's
      color!
  - name: TX_0056
    index: 0x56
    text: |-
      The \col(1)Easter
      Egg Ring\col(0)!
  # A ring (appraised right away)
  - name: TX_0054
    index: 0x54
    text: |-
      You got a
      \col(1)ring\col(0)! It is
      in your box
      (menu).
  # The 2nd dungeon's essence: the second verse
  - name: TX_000f
    index: 0x0f
    text: |-
      \pos(2)\slow()The Puppet's
      strings are cut.
      Lila's toys
      dance again!\stop
      You found the
      \col(1)second verse\col(0) of
      Marin's song!\stop
      \col(1)Marin\col(0): Two
      verses...\stop
      This one's about
      a little girl
      who dreams of a
      knight.\stop
      ...He looks a
      bit like you,
      doesn't he?

  - name: TX_0022
    index: 0x22
    text: |-
      The \col(1)Spinning
      Boomerang\col(0)! It
      hits from afar
      and comes back!\stop
      It reaches the
      crystals your
      sword can't.
  # The Lagoon: the bottle (trade item 1, Ages' old stationery)
  - name: TX_005b
    index: 0x5b
    text: |-
      A \col(1)message in a
      bottle\col(0)!\stop
      Inside, an old
      rolled-up
      letter.

  - name: TX_0031
    index: 0x31
    text: |-
      \col(1)Zora's
      Flippers\col(0)! You
      can swim now!\stop
      Get in the
      water, and \bbtn
      to dive.

  # The Mermaid Scales (Ages' mermaid suit)
  - name: TX_0036
    index: 0x36
    text: |-
      The \col(1)Mermaid
      Scales\col(0)!\stop
      You can swim in
      deep water, and
      \bbtn to dive!

  # The 3rd dungeon's essence: the third verse
  - name: TX_0010
    index: 0x10
    text: |-
      \pos(2)\slow()The Eel has
      given back the
      sweet words it
      swallowed.\stop
      You found the
      \col(1)third verse\col(0) of
      Marin's song!



  - name: TX_005a
    index: 0x5a
    text: |-
      You found
      \col(1)Sir Cork\col(0)!\stop
      Lila's wooden
      knight... He
      looks bored.

  - name: TX_0067
    index: 0x67
    text: |-
      The \col(1)Hourglass\col(0)!\stop
      Turn it over:
      time stops for a
      moment.\stop
      Every blow you
      strike meanwhile
      bursts out at
      the end, louder
      and louder!

  - name: TX_0072
    index: 0x72
    text: |-
      The \col(1)Dream
      Notebook\col(0)!\stop
      The dreams you
      give back to
      people are
      written here.\stop
      Put it on a
      button (Start)
      to read it.

  - name: TX_006d
    index: 0x6d
    text: |-
      You got a \col(1)Fairy
      in a Bottle\col(0)! It
      revives you when
      you run out of
      hearts!

  # The first dungeon's essence becomes the first verse of Marin's song
  - name: TX_000e
    index: 0x0e
    text: |-
      \pos(2)\slow()The Keeper is
      finally asleep.
      He dreams of his
      wife, bringing
      him soup...\stop
      You found the
      \col(1)first verse\col(0) of
      Marin's song!\stop
      \col(1)Marin\col(0): Do you
      hear it? It's
      not the Ballad
      of the Wind
      Fish...\stop
      It's mine.
      My very own
      song!

  - name: TX_001c
    index: 0x1c
    text: |-
      You got your
      \col(1)sword\col(0) back!\stop
      Hold \abtn or \bbtn
      to charge it,
      then let go for
      a spin attack.

  - name: TX_0071
    index: 0x71
    text: |-
      You got the
      \col(1)Lantern of
      Dreams\col(0)!\stop
      In a dungeon,
      its flame lights
      the torches.\stop
      Outside, its
      light opens the
      way to the
      \col(1)Dream\col(0): the
      world of dreams!

  # The Power Bracelet (Brasia)
  - name: TX_0026
    index: 0x26
    text: |-
      \pos(2)The \col(1)Power
      Bracelet\col(0)!\stop
      Facing a rock,
      hold the button
      and pull: you
      lift it!

  # The painting of the sea (Pinceau, trade item 2: Ages' old stink bag)
  - name: TX_005c
    index: 0x5c
    text: |-
      The \col(1)painting
      of the sea\col(0)!\stop
      Waves, a red
      sun... The paint
      is still wet.

  # The Cane of Dreams (Ages' Cane of Somaria)
  - name: TX_0073
    index: 0x73
    text: |-
      The \col(1)Cane of
      Dreams\col(0)!\stop
      It makes a block
      appear in front
      of you. Just one
      at a time!

  # The 4th dungeon's essence: the fourth verse
  - name: TX_0011
    index: 0x11
    text: |-
      \pos(2)\slow()The Forge has
      woken. No two
      swords alike
      anymore!\stop
      You found the
      \col(1)fourth verse\col(0)
      of Marin's song!\stop
      \col(1)Marin\col(0): "Make up
      a path for me
      that nobody has
      taken."\stop
      ...Pretty,
      right? I wrote
      that one!

  # The Shovel (Spade)
  - name: TX_0025
    index: 0x25
    text: |-
      The \col(1)Shovel\col(0)!\stop
      Use it facing
      the ground: you
      dig!

  # The cathedral key (Ages' graveyard key)
  - name: TX_0023
    index: 0x23
    text: |-
      The \col(1)cathedral
      key\col(0)!\stop
      An old key, all
      rusty.

  # The 5th dungeon's essence: the fifth verse
  - name: TX_0012
    index: 0x12
    text: |-
      \pos(2)\slow()The memory
      has closed,
      gently.\stop
      You found the
      \col(1)fifth verse\col(0)
      of Marin's song!\stop
      \col(1)Marin\col(0): "If one
      day you forget
      me, listen to
      the sea: I'm
      still singing."\stop
      ...I wrote that
      one for him.

  # The Echo Hook (Ages' Switch Hook)
  - name: TX_0030
    index: 0x30
    text: |-
      The \col(1)Echo
      Hook\col(0)!\stop
      Aim at an
      object to switch
      places with it.

  # Roc's Feather (Mother Plume)
  - name: TX_0027
    index: 0x27
    text: |-
      \col(1)Roc's
      Feather\col(0)!\stop
      Press the
      button: you
      jump!

  # The 6th dungeon's essence: the sixth verse
  - name: TX_0013
    index: 0x13
    text: |-
      \pos(2)\slow()The Shadow has
      flown away. The
      wind is back!\stop
      You found the
      \col(1)sixth verse\col(0)
      of Marin's song!\stop
      \col(1)Marin\col(0): "Open
      your arms: the
      wind knows the
      way."\stop
      ...The wind
      whispered that
      one to me.

  # Roc's Cape (the feather, level 2)
  - name: TX_00_GET_ROCSCAPE
    index: auto
    text: |-
      \col(1)Roc's Cape\col(0)!\stop
      Jump, then press
      again: you jump
      a second time!

  # The Seed Shooter (the watchman)
  - name: TX_002e
    index: 0x2e
    text: |-
      The \col(1)Seed
      Shooter\col(0)!\stop
      Pick your seeds
      and fire: they
      bounce off
      walls.

  # The Dawn Bell (the Frost Palace)
  - name: TX_003b
    index: 0x3b
    text: |-
      The \col(1)Dawn
      Bell\col(0)!\stop
      Its ring wakes
      sleepers up.

  # The essence of the 7th dungeon: the seventh verse
  - name: TX_0014
    index: 0x14
    text: |-
      \pos(2)\slow()The Frostling
      has melted. The
      island wakes!\stop
      You found the
      \col(1)seventh
      verse\col(0) of
      Marin's song!\stop
      \col(1)Marin\col(0): "Even
      the longest
      night ends with
      a morning."










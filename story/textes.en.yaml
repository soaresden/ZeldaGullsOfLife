# The game's text, in English. Same text names as story/textes.yaml (French): the game picks
# one or the other with the language chosen at the start of a new game (wActiveLanguage).
#
# Engine rules: 16 characters per line at most (tools/check_text.py), \stop = wait for A then
# clear the box, \opt() = choice, \Link = the player's name. Texts of Ages that aren't listed
# here keep their original English.

groups:
- group: 0x5a
  data:

  # Prologue (opening film)
  - name: TX_5a00
    index: 0x00
    text: |-
      The Wind Fish
      had awoken.
      Koholint Island
      had vanished
      into the foam.\stop
      Clinging to a
      wreck, the hero
      drifted for long
      days...\stop
      ...until he
      reached islands
      where no one
      dreamed anymore.

  # The seagull lands next to Link
  - name: TX_5a01
    index: 0x01
    text: |-
      Hey!
      Wake up,
      sleepyhead!\stop
      ...\stop
      Don't you
      recognize me?\stop
      I've already
      pulled you out
      of the water
      once, you know.\stop
      It's becoming a
      habit!

  # Link stands up
  - name: TX_5a02
    index: 0x02
    text: |-
      It's me,
      \col(1)Marin\col(0)!\stop
      Remember? On the
      beach, I told
      you that if I
      were a seagull,
      I'd fly beyond
      the sea...\stop
      Before waking
      up, the Wind
      Fish heard my
      wish.\stop
      He told me:
      "What is dreamed
      strongly enough
      never truly
      disappears."\stop
      And there you
      go: wish granted
      word for word!\stop
      Maybe I should
      have said I
      wanted to keep
      my hands...\stop
      But I won't
      complain!\stop
      Are you happy
      to see me?
        \opt()Yes \opt()Totally!

  - name: TX_5a03
    index: 0x03
    text: |-
      Just "yes"?\stop
      Chatty as ever,
      aren't you?\stop
      I missed that,
      you know.\stop
      Come on.
      Something is
      strange about
      this island...

  - name: TX_5a04
    index: 0x04
    text: |-
      Hee hee!
      Me too,
      you know.\stop
      Come on.
      Something is
      strange about
      this island...

  # The Snakes' Burrow (optional dungeon; code/ages/balladeTerrier.s)
  - name: TX_5a18
    index: 0x18
    text: |-
      \col(1)Marin\col(0): A
      burrow... Looks
      like a snakes'
      nest.\stop
      Sneak in
      quietly, \Link.
      Like a snake!

  - name: TX_5a19
    index: 0x19
    text: |-
      You got the
      \col(1)Soul Gauntlet\col(0)!\stop
      When an enemy
      falls, it
      absorbs its
      soul.\stop
      \col(1)Marin\col(0): Brr...
      It's hungry.
      The doors here
      want souls!

  - name: TX_5a1a
    index: 0x1a
    text: |-
      A soul door. It
      still needs
      \num1 more.

  - name: TX_5a1b
    index: 0x1b
    text: |-
      \col(1)Marin\col(0): Souls
      everywhere!\stop
      We need more...
      Something waits
      for us.

  - name: TX_5a1c
    index: 0x1c
    text: |-
      \col(1)Marin\col(0): A war
      machine?!\stop
      No... A ghost
      is inside! It's
      making it walk!

  - name: TX_5a1d
    index: 0x1d
    text: |-
      The gauntlet
      absorbed its
      soul.\stop
      It becomes a
      relic: the
      \col(1)Soul Bracelet\col(0)!\stop
      Your Spin Attack
      draws out the
      souls of foes
      around you.

  # Where did all the items of Link's Awakening go?
  - name: TX_5a15
    index: 0x15
    text: |-
      Wait...
      Where's all
      your gear?\stop
      Your feather,
      your bracelet,
      your boots, your
      flippers...\stop
      The hookshot,
      the boomerang,
      the mirror
      shield, the
      fire rod...\stop
      The bow, the
      bombs, and even
      the magic
      powder?!\stop
      You lost it all
      at sea?!\stop
      ...\stop
      Well. You've got
      me, that's not
      bad, right?

  # She's cold: she slips into Link's tunic
  - name: TX_5a05
    index: 0x05
    text: |-
      Do you feel it,
      \Link?
      These islands
      are too quiet.\stop
      Brr! And the sea
      wind is
      freezing...\stop
      Right. I'm
      getting warm in
      your tunic!\stop
      And no comments!

  # From the tunic (where she spends the whole adventure)
  - name: TX_5a06
    index: 0x06
    text: |-
      Mmh... It smells
      of salt and
      adventure in
      here.\stop
      Let's see if
      anyone's around.\stop
      And don't break
      all their pots
      this time!\stop
      If you want to
      talk to me, hold
      \col(1)SELECT\col(0).\stop
      For your map,
      just tap it.

  # ============================================================================
  # SELECT held: Marin talks from the tunic (code/ages/balladeMarine.s)
  # ============================================================================

  # On the beach where Link woke up
  - name: TX_5a07
    index: 0x07
    text: |-
      Nobody on the
      beach...\stop
      People must live
      further in.
      Let's go see!

  # Port-Veille, in front of the inn (1:9a)
  - name: TX_5a08
    index: 0x08
    text: |-
      An inn!\stop
      They must have
      beds, right? A
      bed is for
      sleeping...\stop
      And when you
      sleep, you
      dream. That's
      your real
      talent.

  # The square of Port-Veille (1:9b)
  - name: TX_5a09
    index: 0x09
    text: |-
      They all have
      bags under their
      eyes...\stop
      Doesn't anyone
      sleep on this
      island? Brr. It
      gives me chills.

  # The east beach (1:9c)
  - name: TX_5a0a
    index: 0x0a
    text: |-
      Children who
      don't play...
      That's not
      normal.\stop
      On Koholint, we
      spent our days
      pretending!

  # The fishing port (1:ab)
  - name: TX_5a0b
    index: 0x0b
    text: |-
      A lighthouse...
      Did you see it,
      up north? It's
      completely dark.\stop
      A dark
      lighthouse is
      like a song no
      one sings
      anymore.

  # The path with the broken bridge (1:8a)
  - name: TX_5a0c
    index: 0x0c
    text: |-
      The bridge fell
      apart... There's
      nothing left!\stop
      The island is
      cut in two, with
      the sea running
      between.\stop
      And not a single
      worker on this
      island to build
      it again!\stop
      If only we could
      cross in a
      dream!\stop
      ...Wait. What if
      we could?

  # Inside the inn (3:9e)
  - name: TX_5a0d
    index: 0x0d
    text: |-
      The bed, over
      there! Stand in
      front of it and
      press \col(1)A\col(0) to
      lie down.\stop
      Me, I'm not
      moving. It's so
      cozy in your
      tunic!

  # Anywhere else: a random line
  - name: TX_5a10
    index: 0x10
    text: |-
      Yes? Do you
      need me?\stop
      I was taking a
      little nap...

  - name: TX_5a11
    index: 0x11
    text: |-
      Hey! Stop
      shaking me!\stop
      I'm very
      comfortable
      in here!

  - name: TX_5a12
    index: 0x12
    text: |-
      Did you know you
      snore when you
      sleep?\stop
      Just like my
      dad.\stop
      ...It actually
      feels kind of
      nice.

  - name: TX_5a13
    index: 0x13
    text: |-
      Lost? Tap
      \col(1)SELECT\col(0) for the
      map.\stop
      And for me,
      hold it down!

  # ============================================================================
  # The people of Port-Veille (INTERAC_BALLADE_NPC, scripts/ages/ballade.s)
  # ============================================================================

  # The innkeeper (3:9e)
  - name: TX_5a20
    index: 0x20
    text: |-
      Welcome to the
      Mist Inn...\stop
      A room?
      What for...\stop
      Nobody sleeps
      here anymore.
      Not since the
      lighthouse went
      dark.\stop
      We close our
      eyes, and...
      nothing. Black.
      As if our heads
      were emptied.\stop
      But you look
      exhausted. The
      bed is in the
      back. Free:
      no one uses it
      anymore.

  # The old fisherman (1:ab)
  - name: TX_5a21
    index: 0x21
    text: |-
      The lighthouse
      light used to
      guide our
      boats...\stop
      ...and it
      rocked our
      nights.\stop
      Since it went
      out, the mist
      never leaves
      the island.\stop
      And neither does
      sleeplessness.\stop
      The lighthouse
      is up north,
      past the cliffs.
      But the path's
      bridge has
      collapsed.\stop
      Nothing's left:
      the island is
      cut in two!\stop
      Workers, here?
      There aren't
      any. We're
      fishermen.

  # A boy (1:9c)
  - name: TX_5a22
    index: 0x22
    text: |-
      Play? What's
      playing?\stop
      Mom says we used
      to pretend to
      be knights.\stop
      Me, I can't
      pretend anymore.

  # Another child (1:9c)
  - name: TX_5a23
    index: 0x23
    text: |-
      I wanted to
      build a sand
      castle.\stop
      But I don't
      remember what a
      castle looks
      like...\stop
      I'd have to
      dream of one.

  # The sleepless lady (1:9b)
  - name: TX_5a24
    index: 0x24
    text: |-
      Three weeks
      without a wink
      of sleep.\stop
      I counted the
      stars, the
      waves, the
      grains of
      sand...\stop
      I was always
      one short.

  # The old man counting sheep (1:9b)
  - name: TX_5a25
    index: 0x25
    text: |-
      One hundred and
      forty-two
      sheep...
      One hundred and
      forty-three...\stop
      Ah! You made me
      lose count!\stop
      And there aren't
      even any sheep
      on this island!\stop
      \col(1)Marin\col(0):
      Pfft! Hee hee!

  # The teen who dreams of being a sailor (1:9a)
  - name: TX_5a26
    index: 0x26
    text: |-
      They say a
      lantern once
      burned atop the
      lighthouse, and
      it made all the
      islands dream.\stop
      I want to become
      a sailor.\stop
      But for that, I
      would have to
      dream of it
      first, right?

  # ============================================================================
  # The Dream World: human Marin (the dream inn, 2:9e)
  # ============================================================================

  # The first meeting: the hands scene
  - name: TX_5a27
    index: 0x27
    text: |-
      ...\stop
      Oh.\stop
      Oh!\stop
      I have hands!
      And feet!\stop
      I forgot how
      bad feet are
      for balance!\stop
      \Link!

  # The reunion hug
  - name: TX_5a2c
    index: 0x2c
    text: |-
      ...\stop
      I'm here.
      I'm alive.
      I have a body!\stop
      So I can finally
      hold you in my
      arms!

  # In his arms
  - name: TX_5a2f
    index: 0x2f
    text: |-
      I'm so, so,
      so happy!\stop
      Don't move.
      Just a little
      longer.\stop
      ...\stop
      Okay! Sorry.
      It's just...
      I was so scared
      of disappearing
      forever.

  # She steps back... and teases him
  - name: TX_5a32
    index: 0x32
    text: |-
      But hey...\stop
      I'm in YOUR
      dream!\stop
      What does that
      mean, huh?\stop
      You dream about
      me?! Hee hee!

  # What she never dared to ask
  - name: TX_5a2d
    index: 0x2d
    text: |-
      You know... on
      Koholint, I
      never knew if
      you really saw
      me.\stop
      Or if I was
      just the girl
      singing on the
      beach.
        \opt()I saw you
        \opt()...

  - name: TX_5a28
    index: 0x28
    text: |-
      ...Dummy.\stop
      I'm going to
      cry, and even
      in a dream, it's
      still wet.

  - name: TX_5a29
    index: 0x29
    text: |-
      Chatty as
      ever.\stop
      It's okay. I
      understood
      anyway.

  # Afterwards, when you talk to her
  - name: TX_5a2a
    index: 0x2a
    text: |-
      This is the
      \col(1)Dream World\col(0):
      the world as we
      dream it.\stop
      I can only be
      myself when you
      sleep. So don't
      stay up too
      late, okay?\stop
      In the world of
      dreams, anything
      is possible!\stop
      Even parting the
      sea in two, like
      Moses!\stop
      Go and look
      where the bridge
      used to be!\stop
      Hee hee! You're
      a sleepwalker
      now!\stop
      And you'll wake
      up right where
      you are.\stop
      But hurry!
      Outside, the sun
      rises fast...\stop
      Run, don't
      dawdle!

  # At the inn, A in front of the bed
  - name: TX_5a16
    index: 0x16
    text: |-
      This bed looks
      really cozy...
      Take a nap?
        \opt()Yes \opt()No

  # In the Dream World, SELECT: wake up?
  - name: TX_5a14
    index: 0x14
    text: |-
      Do you want to
      wake up?
        \opt()Yes \opt()No

  # ============================================================================
  # The old fisherman gives Link his sword back (the first time you talk to him)
  # ============================================================================
  - name: TX_5a2b
    index: 0x2b
    text: |-
      Hey, you! You're
      the castaway,
      right?\stop
      I fished this
      out yesterday,
      in my nets.\stop
      A sword! It must
      be yours.\stop
      The rest of your
      stuff? Oh, I saw
      things floating,
      far out...\stop
      But row all the
      way out there?
      Too lazy!\stop
      Heh heh! You'll
      have to start
      from scratch,
      pal!\stop
      Take it. The
      lighthouse up
      north isn't safe
      since it went
      dark.

  # Right after: Marin, from the tunic, about the sword
  - name: TX_5a2e
    index: 0x2e
    text: |-
      \col(1)Marin\col(0):
      Wait... Wasn't
      your sword a
      level 3 sword?\stop
      This says
      level 1!\stop
      Did the sea salt
      rust it? Or did
      you pack it
      badly...\stop
      No backpack,
      that's the
      problem!

  # ============================================================================
  # The Dark Lighthouse
  # ============================================================================

  # Marin, entering the lighthouse (SELECT)
  - name: TX_5a0e
    index: 0x0e
    text: |-
      Brr... It's cold
      in here.\stop
      The lighthouse
      should shine all
      the way up
      there. Shall we
      climb?

  # ============================================================================
  # After the lighthouse: on a black screen, Marin talks, then "To be continued"
  # ============================================================================
  - name: TX_5a30
    index: 0x30
    text: |-
      \col(1)Marin\col(0): Link!
      Look! The
      lighthouse is
      shining again!\stop
      Tonight, all of
      Port-Veille will
      dream...\stop
      Come on, let's
      go and see!

  - name: TX_5a31
    index: 0x31
    text: |-

       To be continued

  # The sleepwalker: just before waking up (INTERAC_BALLADE_DREAM_FX)
  - name: TX_5a33
    index: 0x33
    text: |-
      \col(1)Marin\col(0): The
      sun is rising...
      You're about to
      wake up!

  # The Lighthouse, boss room: Jack (the pumpkin) threatens, Marin answers back
  - name: TX_5a34
    index: 0x34
    text: |-
      \col(2)Jack\col(0): Heh
      heh heh... A
      little hero and
      his seagull?\stop
      This lighthouse
      is mine! It will
      stay dark
      forever!\stop
      I'll snuff you
      both out like
      candles!

  - name: TX_5a35
    index: 0x35
    text: |-
      \col(1)Marin\col(0): Oh
      yeah?! I don't
      even like
      pumpkin, but
      we'll carve you
      up anyway, Jack!

  # The rhythm final boss (INTERAC_BALLADE_RHYTHM): Marin cheers Link on (Denis's ideas). Two
  # lines only (a 3rd one would wait for A); she just talks: the box closes by itself after ~3
  # seconds (\wait), during the bars with no note to hit.
  # At the start, during the count-in
  - name: TX_5a36
    index: 0x36
    text: |-
      Come on, give me
      an 'A'!\wait(120)

  # A good round: the song comes back (level 2)
  - name: TX_5a37
    index: 0x37
    text: |-
      Yeah... I know
      this one!...\wait(120)

  # Another good round (level 3): she focuses, she catches her breath
  - name: TX_5a38
    index: 0x38
    text: |-
      I'm catching
      my breath...\wait(120)

  # The last good round: she is about to sing
  - name: TX_5a39
    index: 0x39
    text: |-
      You remembered
      \heart!\wait(120)

  # She starts singing
  - name: TX_5a3a
    index: 0x3a
    text: |-
      I'm gonna get
      him!\wait(120)

  # The finishing blow, at the end of her song
  - name: TX_5a3b
    index: 0x3b
    text: |-
      GO BACK WHERE
      YOU CAME FROM!\wait(120)

  # After level 2 (5 levels, like the 5 stages of Lorule Castle)
  - name: TX_5a3c
    index: 0x3c
    text: |-
      That's it!
      Louder!\wait(120)

  # After level 4: her voice is coming back
  - name: TX_5a3d
    index: 0x3d
    text: |-
      My voice... it's
      coming back!\wait(120)

  # The end of chapter 1: the village tour (INTERAC_MARINE $05), then the villagers keep these
  # lines (scripts/ages/ballade.s)
  - name: TX_5a3e
    index: 0x3e
    text: |-
      Zzz... Zzz...\stop
      Mmm... I'm
      sleeping...
      I'm SLEEPING!\stop
      Thank you... kid
      ...Zzz...

  - name: TX_5a3f
    index: 0x3f
    text: |-
      No more counting
      sheep...\stop
      I close my
      eyes, and poof!
      I dream of a big
      green meadow...\stop
      ...Zzz...

  - name: TX_5a40
    index: 0x40
    text: |-
      Let's play
      knights! I'm
      Link!\stop
      And I'm the
      talking seagull!
      Hee hee!

  - name: TX_5a41
    index: 0x41
    text: |-
      Customers! All
      my rooms are
      taken!\stop
      Everyone wants
      to sleep at the
      Mist Inn!\stop
      And me... I'm
      yawning...
      Hooaah!

  - name: TX_5a42
    index: 0x42
    text: |-
      \col(1)Marin\col(0): Well
      done! We saved
      these people!\stop
      So that's what
      you were doing
      while I was in
      the village?\stop
      Clearing
      dungeons and
      solving
      puzzles?\stop
      But... that's
      thrilling!\stop
      I don't regret
      coming with you
      after all!\stop
      All aboaaaard!

  # The fairground man's Rupee Dig (1:ac ; code/ages/balladeCreuse.s)
  - name: TX_5a43
    index: 0x43
    text: |-
      Step right up!
      Three games for
      you!\stop
      The Rupee Dig:
      dig, grab the
      rupees... and
      watch for bombs!\stop
      The Mamono:
      monsters sleep
      under the sand!\stop
      The Maze: grab
      the rupees, run
      from the Lynels!\stop
      \opt()Dig \opt()Mamono
      \opt()Lynels \opt()No

  - name: TX_5a44
    index: 0x44
    text: |-
      Link levels up!
      The monsters
      suddenly look
      smaller.

  - name: TX_5a45
    index: 0x45
    text: |-
      Not enough
      rupees, kid!
      Come back
      richer!

  - name: TX_5a46
    index: 0x46
    text: |-
      \col(1)Marin\col(0): The
      number: bombs
      around.\stop
      The more there
      are, the bigger
      the rupee!

  - name: TX_5a47
    index: 0x47
    text: |-
      BOOM!\stop
      Heh heh... The
      house always
      wins!

  - name: TX_5a48
    index: 0x48
    text: |-
      What?! You found
      them all?!\stop
      Well... nice
      job, kid.

  # The fairground man's Mamono (code/ages/balladeCreuse.s)
  - name: TX_5a4a
    index: 0x4a
    text: |-
      The Mamono! The
      numbers tell how
      many monster
      levels sleep
      around.\stop
      Beat the small
      ones to grow...
      before you face
      the big ones!\stop
      \col(1)Marin\col(0): And
      don't dig at
      random: a
      startled monster
      hits hard!

  - name: TX_5a4b
    index: 0x4b
    text: |-
      Easy: 10 rupees
      Hard: 30, and
      the jackpot!\stop
      \opt()Easy \opt()Hard
      \opt()No

  - name: TX_5a4d
    index: 0x4d
    text: |-
      Ouch! You're
      exhausted!\stop
      Heh heh... The
      house always
      wins!

  # The fairground man's Lynel Maze (code/ages/balladePac.s)
  - name: TX_5a4c
    index: 0x4c
    text: |-
      The Lynel Maze!
      Grab every
      rupee.\stop
      The Lynels are
      invincible...
      unless you take
      a power gem!\stop
      While you glow,
      one sword swing
      takes them down!\stop
      \opt()Let's go \opt()No

  - name: TX_5a4e
    index: 0x4e
    text: |-
      All the rupees?!\stop
      Here, 20 more...
      now scram before
      the Lynels get
      mad!

  - name: TX_5a4f
    index: 0x4f
    text: |-
      The Lynels got
      you!\stop
      Heh heh... The
      house always
      wins!

  # ============================================================================
  # Chapter 2: Jingle Hamlet
  # ============================================================================

  # The Log Boat (INTERAC_BALLADE_OBJECT $00): as many islands as Marin has spotted
  - name: TX_5a50
    index: 0x50
    text: |-
      \col(1)Marin\col(0): I'm
      reading the
      wind... Where
      to?\stop
       \opt()Mist
       \opt()Jingle

  - name: TX_5a51
    index: 0x51
    text: |-
      \col(1)Marin\col(0): I'm
      reading the
      wind... Where
      to?\stop
       \opt()Mist \opt()Jingle
       \opt()Lagoon

  - name: TX_5a52
    index: 0x52
    text: |-
      \col(1)Marin\col(0): I'm
      reading the
      wind... Where
      to?\stop
       \opt()Mist \opt()Jingle
       \opt()Lagoon \opt()Ember

  - name: TX_5a53
    index: 0x53
    text: |-
      \col(1)Marin\col(0): We're
      already here,
      silly!

  # End of chapter 1, at the harbour (after "All aboaaaard!"): Marin reads the wind
  - name: TX_5a54
    index: 0x54
    text: |-
      \col(1)Marin\col(0): Shh!
      Listen...\stop
      The wind... It
      smells like
      candy.\stop
      And it jingles
      like little
      bells!\stop
      There's an
      island up north!
      People there
      have lost their
      dreams, I can
      feel it.\stop
      Your old log is
      still floating
      by the Jetty,
      west of the
      village.\stop
      With some rope,
      it'll make a
      raft!\stop
      I'll read the
      wind... and
      you'll row!

  # Arriving at Jingle Hamlet, the first time (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a55
    index: 0x55
    text: |-
      \col(1)Marin\col(0): Land!\stop
      Houses of every
      color... and
      that jingling
      sound!\stop
      But it's awfully
      quiet for a
      village full of
      kids.

  # The Box Cave (5:b0), on first entering: Marin learns to carry a bomb
  - name: TX_5a56
    index: 0x56
    text: |-
      \col(1)Marin\col(0): Oh!
      A bell, across
      the chasm!\stop
      What if we made
      it ring?\stop
      I've got an
      idea! Hold a
      bomb over your
      head and press
      \col(1)SELECT\col(0)!\stop
      I'll carry it
      over the pit.
      But hurry, it's
      hot!

  # In front of the cave cliff (1:32), the first time
  - name: TX_5a57
    index: 0x57
    text: |-
      \col(1)Marin\col(0): Rocks
      are blocking a
      cave...\stop
      A bomb would do
      the trick. Maybe
      the village shop
      sells some?

  # The innkeeper gives the Dream Notebook (village tour, or later when spoken to)
  - name: TX_5a58
    index: 0x58
    text: |-
      Here, kid: my
      old guestbook.\stop
      My guests used
      to write their
      dreams in it.\stop
      Write down the
      ones you give
      back to people!

  # Lila (Lila's house, 3:21), before finding her toy
  - name: TX_5a59
    index: 0x59
    text: |-
      \col(1)Lila\col(0): I don't
      know how to play
      anymore.\stop
      Sir Cork and I
      used to hunt
      dragons...\stop
      But he fell in
      the Box Cave.
      And rocks
      blocked it.\stop
      Without him, I
      can't pretend
      anymore.

  # Lila gets Sir Cork back and falls asleep
  - name: TX_5a5a
    index: 0x5a
    text: |-
      \col(1)Lila\col(0): Sir
      Cork! You found
      him!\stop
      Oh... he says he
      saw a dragon...\stop
      *yawn*
      I'm so sleepy,
      all of a
      sudden...\stop
      Come play in my
      dream, too...
      Zzz...

  - name: TX_5a5b
    index: 0x5b
    text: |-
      \col(1)Marin\col(0): She
      fell asleep!\stop
      Lie down on the
      bed next to her:
      we'll get into
      her dream!

  - name: TX_5a5c
    index: 0x5c
    text: |-
      \col(1)Lila\col(0): Zzz...
      Charge, Sir
      Cork... Zzz...

  # In Lila's dream (2:21)
  - name: TX_5a5d
    index: 0x5d
    text: |-
      \col(1)Lila\col(0): You
      came! Welcome to
      my dream!\stop
      My toys are in
      the big chest...\stop
      But a nasty
      Puppet guards
      them all! He
      won't let anyone
      play.\stop
      You'll save
      them, right?

  - name: TX_5a5e
    index: 0x5e
    text: |-
      The \col(1)Toy Chest\col(0).
      Go in?
       \opt()Yes \opt()No

  # The Dream Notebook (ITEM_12), depending on how many islands are saved
  - name: TX_5a60
    index: 0x60
    text: |-
      \col(1)Dream
      Notebook\col(0)\stop
      \col(1)Mist\col(0): the
      lady sleeps, the
      old man stopped
      counting. Back!\stop
      \col(1)Jingle\col(0): Lila
      can't pretend
      anymore. The
      kids don't play.

  - name: TX_5a61
    index: 0x61
    text: |-
      \col(1)Dream
      Notebook\col(0)\stop
      \col(1)Mist\col(0): the
      lady sleeps, the
      old man stopped
      counting. Back!\stop
      \col(1)Jingle\col(0): Lila
      makes up
      knights. The
      kids play again!

  # The Toy Chest: Marin in front of the bell (4:34)
  - name: TX_5a62
    index: 0x62
    text: |-
      \col(1)Marin\col(0): Another
      bell, across
      the pit!\stop
      You know what
      to do: a bomb,
      and \col(1)SELECT\col(0)!

  # Stringless Puppet (the boss, 4:2b) threatens; Marin answers
  - name: TX_5a63
    index: 0x63
    text: |-
      \col(2)Puppet\col(0): Who
      holds my
      strings? Nobody!\stop
      So I dance on
      my own... and I
      crush you!\stop
      \col(1)Marin\col(0): You
      dance badly.\stop
      Link, he's too
      high for you.
      Stand under
      him, a bomb,
      \col(1)SELECT\col(0): I'll
      make him eat it!\stop
      But he has to
      be \col(1)red\col(0) when I
      get there!\stop
      Hold the bomb
      ready, and send
      me as soon as he
      turns purple!

  # End of chapter 2: Lila wakes up (3:21)
  - name: TX_5a64
    index: 0x64
    text: |-
      \col(1)Lila\col(0): Oh!
      You're here!\stop
      I dreamed of a
      knight all in
      green...\stop
      He had a gull in
      his tunic! And
      he cut the
      strings of a
      nasty puppet!\stop
      He and Sir Cork
      are friends now!

  - name: TX_5a65
    index: 0x65
    text: |-
      \col(1)Marin\col(0): Hee
      hee... A knight
      all in green,
      huh?\stop
      Come on, let's
      go see outside!

  # End of chapter 2: the Jingle square (1:11)
  - name: TX_5a66
    index: 0x66
    text: |-
      The kids are
      playing again!
      Laughter
      everywhere.\stop
      \col(1)Marin\col(0): The
      bell is jingling
      again!

  - name: TX_5a67
    index: 0x67
    text: |-
      \col(1)Marin\col(0): Shh...
      the wind has
      changed.\stop
      It smells of
      salt and orange
      blossom.\stop
      A ring-shaped
      island, to the
      southeast...\stop
      Someone there is
      waiting for
      someone. I can
      feel it.

  # The kids in the square (INTERAC_BALLADE_OBJECT $0b, $0c), before and after the Toy Chest
  - name: TX_5a68
    index: 0x68
    text: |-
      We're waiting.\stop
      We're not
      allowed to play.\stop
      Who said that?
      We don't
      remember...

  - name: TX_5a69
    index: 0x69
    text: |-
      We're playing
      knights! You can
      be the Puppet!

  - name: TX_5a6a
    index: 0x6a
    text: |-
      We used to play
      hide-and-seek...\stop
      But why hide?
      Nobody comes
      looking.

  - name: TX_5a6b
    index: 0x6b
    text: |-
      Shh! I'm
      hiding!\stop
      You didn't see
      me, right?

  # Mrs. Bonnet, the teacher (the school, 3:22; INTERAC_BALLADE_OBJECT $0d)
  - name: TX_5a6c
    index: 0x6c
    text: |-
      \col(1)Mrs. Bonnet\col(0):
      Two times two,
      four. Three
      times two, six.\stop
      I used to tell
      stories...\stop
      I can't remember
      how they begin.

  - name: TX_5a6d
    index: 0x6d
    text: |-
      \col(1)Mrs. Bonnet\col(0):
      Once upon a
      time... a green
      knight, and a
      singing gull!\stop
      It's coming
      back to me!

  # Lila, after the Toy Chest
  - name: TX_5a6e
    index: 0x6e
    text: |-
      \col(1)Lila\col(0): Sir Cork
      and I are off to
      hunt the dragon!\stop
      Want to come?

  # Chapter 3: Lagoon of Vows (1:04-37)
  # Arriving at the jetty (1:24), the first time (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a70
    index: 0x70
    text: |-
      \col(1)Marin\col(0): A
      lagoon! The
      water is all
      turquoise...\stop
      There's a house
      up there. Shall
      we say hello?

  # Gaspard (3:23 ; INTERAC_BALLADE_OBJECT $11): before the bottle
  - name: TX_5a71
    index: 0x71
    text: |-
      \col(1)Gaspard\col(0): Hello,
      young man. I'm
      Gaspard.\stop
      That lady? I
      don't know her.
      She makes me tea
      every morning.\stop
      Once, I threw a
      bottle into the
      sea. For
      someone...\stop
      It got stuck on
      the islet in the
      middle of the
      lagoon.\stop
      But I forgot who
      it was for. And
      how to swim.\stop
      \col(1)Marin\col(0): The
      lagoon is too
      deep...\stop
      But in a dream,
      the sea parts!
      From the west
      side, maybe?

  # Gaspard: Link gives back the bottle (he gives Zora's Flippers)
  - name: TX_5a72
    index: 0x72
    text: |-
      \col(1)Gaspard\col(0): My
      bottle! There's
      a letter...\stop
      "Heloise, I'll
      find you again,
      even if you
      forget me. G."\stop
      Heloise...
      Heloise!
      She's my wife!\stop
      Here, take my
      \col(1)Zora's
      Flippers\col(0).\stop
      They're for
      someone who
      still has
      someone to find.\stop
      \col(1)Marin\col(0): ...Is he
      talking about
      me, you think?

  # Gaspard, after
  - name: TX_5a73
    index: 0x73
    text: |-
      \col(1)Gaspard\col(0): Every
      morning, I ask
      Heloise to marry
      me.\stop
      She says yes,
      every time!

  # Heloise (3:23 ; INTERAC_BALLADE_OBJECT $0e): before / after the Murmuring Reef
  - name: TX_5a74
    index: 0x74
    text: |-
      \col(1)Heloise\col(0): Hello!
      That gentleman?
      A neighbour, I
      think.\stop
      He has lovely
      sad eyes. I make
      him tea. It
      helps.

  - name: TX_5a75
    index: 0x75
    text: |-
      \col(1)Heloise\col(0): We got
      married on the
      beach up there.
      I remember!\stop
      He wore
      flippers. To
      dance. What a
      fool!

  # Bulle, the diving instructor (3:24 ; $0f)
  - name: TX_5a76
    index: 0x76
    text: |-
      \col(1)Bulle\col(0): Welcome
      to the diving
      club!\stop
      Well... it's
      closed. Nobody
      dreams of seeing
      the bottom now.

  - name: TX_5a77
    index: 0x77
    text: |-
      \col(1)Bulle\col(0): The
      bottom of the
      lagoon shines
      again!\stop
      Come back soon:
      we'll go diving!

  # The bottle postman (the bottle beach, 1:35 ; $10)
  - name: TX_5a78
    index: 0x78
    text: |-
      \col(1)Postman\col(0): I pick
      up bottles from
      the sea.\stop
      But I can't
      remember who the
      letters are
      for...\stop
      Me, nobody ever
      wrote to me.

  - name: TX_5a79
    index: 0x79
    text: |-
      \col(1)Postman\col(0): A
      bottle, this
      morning! For me!\stop
      "Thank you for
      keeping our
      words. H. and
      G."\stop
      And this one has
      no name... Just
      a map.\stop
      Take it, you're
      the traveler!\stop
      An X, between
      two rocks, by a
      big rock...\stop
      Off the Isle of
      Echoes.\stop
      \col(1)Marin\col(0): A
      treasure under
      the sea! We'll
      have to dive...
      for a long time!

  # The treasure map: Link surfaces too soon from the channel (1:74; code/ages/balladeTresor.s)
  - name: TX_5a5f
    index: 0x5f
    text: |-
      \col(1)Marin\col(0): The X
      is right here!\stop
      But you have to
      stay down over
      10 seconds!\stop
      Like a
      mermaid...

  # The lovers' cave (5:b1), on entering (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a7a
    index: 0x7a
    text: |-
      \col(1)Marin\col(0): Hearts
      carved
      everywhere...\stop
      "G + H,
      forever."\stop
      Gaspard and
      Heloise!\stop
      ...Hey! Don't
      look at me like
      that!

  # In front of the Murmuring Reef (1:36), the first time
  - name: TX_5a7b
    index: 0x7b
    text: |-
      \col(1)Marin\col(0): The
      Murmuring
      Reef... Can you
      hear it
      whisper?\stop
      In there, it's
      water all over.
      Seagulls don't
      dive.\stop
      I'll wait here,
      \Link. Come back
      soon.

  # End of chapter 3: the bottle beach (1:35), Marin was waiting
  # Le Carnet des Rêves, après la Lagune des Serments (3 îles sauvées)
  - name: TX_5a7f
    index: 0x7f
    text: |-
      \col(1)Dream
      Notebook\col(0)\stop
      \col(1)Mist\col(0): the
      lady sleeps, the
      old man stopped
      counting. Back!\stop
      \col(1)Jingle\col(0): Lila
      makes up
      knights. The
      kids play again!\stop
      \col(1)Lagoon\col(0):
      Heloise and
      Gaspard
      remember.
      Married every
      morning!

  - name: TX_5a7c
    index: 0x7c
    text: |-
      \col(1)Marin\col(0): \Link!\stop
      You took so
      long. Don't ever
      do that again.\stop
      ...You know
      what? That's
      what the third
      verse says. Word
      for word.\stop
      Come on. Things
      are happening at
      Gaspard's!

  # At Heloise and Gaspard's (3:23)
  - name: TX_5a7d
    index: 0x7d
    text: |-
      \col(1)Heloise\col(0):
      Gaspard!
      You wore your
      flippers to
      dance, that
      day...\stop
      \col(1)Gaspard\col(0): And
      you cried with
      laughter. Hello,
      my wife.

  - name: TX_5a7e
    index: 0x7e
    text: |-
      \col(1)Marin\col(0): Shh...
      the wind has
      turned.\stop
      It smells of
      smoke and hot
      iron.\stop
      A smoking
      mountain, to the
      north... I can
      hear hammering.


  # Le menu de test caché (code/ages/balladeDebug.s ; HAUT tenu 5 s à l'écran titre) :
  # la langue, l'île, le moment, et dans le donjon l'endroit. Le même dans les deux fichiers.
  - name: TX_5af0
    index: 0xf0
    text: |-
       \opt()Français
       \opt()English

  - name: TX_5af1
    index: 0xf1
    text: |-
       \opt()1 \opt()2 \opt()3 \opt()4
       \opt()5 \opt()6 \opt()7 \opt()8

  - name: TX_5af2
    index: 0xf2
    text: |-
       \opt()Plage \opt()Ville
       \opt()Donjon \opt()Fin

  - name: TX_5af3
    index: 0xf3
    text: |-
       \opt()Entrée \opt()M-boss
       \opt()Boss

  # The language choice, at the start of a new game (the same in both files)
  - name: TX_5a17
    index: 0x17
    text: |-
         \opt()Français
         \opt()English

  # Chapter 4: Ember Peak (1:08-3c)
  # Arriving at the jetty (1:38), the first time (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a80
    index: 0x80
    text: |-
      \col(1)Marin\col(0): Ugh,
      it smells like
      rotten eggs!\stop
      A volcano...
      It's asleep, but
      it snores.\stop
      Someone's
      hammering up
      there. Always
      the same blow.
      Bong. Bong.

  # Brasia, the Goron smith (1:2a ; INTERAC_BALLADE_OBJECT $14): before the painting
  - name: TX_5a81
    index: 0x81
    text: |-
      \col(1)Brasia\col(0): Bong!
      Four hundred
      and twelve
      swords! All the
      same!\stop
      I'm out of
      ideas, kid. Not
      one left. The
      volcano sleeps,
      so does my head.\stop
      If someone
      showed me
      something I've
      never seen...

  # Brasia: Link shows her the painting of the sea (she gives the Power Bracelet)
  - name: TX_5a82
    index: 0x82
    text: |-
      \col(1)Brasia\col(0): Is
      that...
      the sea?! At
      sunset! Moving,
      never sitting
      still!\stop
      A sword shaped
      like a wave! I
      have an idea!
      AN IDEA!\stop
      Here, my
      \col(1)Power
      Bracelet\col(0). I
      don't need it:
      I have an idea!

  - name: TX_5a83
    index: 0x83
    text: |-
      \col(1)Brasia\col(0): Bong!
      A wave! Bong!
      Another wave!
      No two alike!

  # Pinceau, the painter (1:19, in the Real ; $15): before / after the Sleeping Forge
  - name: TX_5a84
    index: 0x84
    text: |-
      \col(1)Pinceau\col(0): The
      volcano. The
      volcano again.\stop
      And my paints
      dried up! No
      yellow, no
      orange, no red.\stop
      Yellow: the
      sulphur of the
      hot spring.\stop
      Orange: the
      embers of
      Brasia's forge.\stop
      Red: the lava,
      by the lookout.\stop
      But lava burns!
      You'd have to
      dream it cold.

  - name: TX_5a85
    index: 0x85
    text: |-
      \col(1)Pinceau\col(0): I
      paint the sea,
      the lagoon, a
      seagull...\stop
      Your seagull
      looks just like
      you!

  # Pinceau in the Dream (0:19 ; $16): he sees the sea, and paints; he gives the painting
  - name: TX_5a86
    index: 0x86
    text: |-
      \col(1)Pinceau\col(0): The
      sea! I can see
      it! And the sun
      setting on it!\stop
      Your yellow,
      your orange,
      your red...
      Quick, quick...
      There!\stop
      Take this
      painting. Show
      it to someone
      who needs it.

  - name: TX_5a87
    index: 0x87
    text: |-
      \col(1)Pinceau\col(0): I
      still paint the
      sea. And the
      sky. And you!

  # A Brass musician, the Goron band (1:2a ; $17)
  - name: TX_5a88
    index: 0x88
    text: |-
      \col(1)The Brass\col(0):
      Toot. Toot.
      Toot.\stop
      We've played
      the same note
      for a hundred
      years. Pretty,
      isn't it?

  - name: TX_5a89
    index: 0x89
    text: |-
      \col(1)The Brass\col(0):
      Toot-ta-da-
      toot! We found
      a second note!

  # The copy merchant (1:3a ; $18)
  - name: TX_5a8a
    index: 0x8a
    text: |-
      \col(1)Merchant\col(0):
      Copies! Copies
      of copies!\stop
      A Piece of
      Heart? Brand
      new! Well...
      a drawing of a
      Piece of Heart.

  - name: TX_5a8b
    index: 0x8b
    text: |-
      \col(1)Merchant\col(0):
      Nobody buys my
      copies
      anymore...\stop
      Good! I'm sick
      of copying.

  # End of chapter 4: the Goron village (1:2a), the Sleeping Forge's essence
  - name: TX_5a8c
    index: 0x8c
    text: |-
      \col(1)Marin\col(0): Listen!
      The hammering
      changed. Bong!
      Bing! Kaboom!\stop
      And the grey
      smoke is gone!\stop
      The volcano woke
      up... but
      gently.

  - name: TX_5a8d
    index: 0x8d
    text: |-
      \col(1)Brasia\col(0): A wave
      sword! A cloud
      sword! A seagull
      sword!\stop
      \col(1)The Brass\col(0):
      Toot-ta-da-
      boom-toot!\stop
      \col(1)Marin\col(0): A
      seagull sword?
      I like that!

  - name: TX_5a8e
    index: 0x8e
    text: |-
      \col(1)Marin\col(0): Shh...
      the wind has
      turned.\stop
      It smells of
      bells, of old
      paper...\stop
      An island to the
      west, where
      everything
      happens twice.
      Twice.

  # Chapter 5: the Isle of Echoes (1:40-74)
  # Arriving at the jetty (1:70), the first time
  - name: TX_5a90
    index: 0x90
    text: |-
      \col(1)Marin\col(0): ...It's
      all grey here.\stop
      Hear that? The
      bells. The wind
      rings them all
      by itself.\stop
      It's like the
      whole island
      remembers
      someone.

  # The east graveyard, by the flowered grave, the first time
  - name: TX_5a91
    index: 0x91
    text: |-
      \col(1)Marin\col(0): A
      grave with fresh
      flowers.\stop
      Someone still
      comes to talk
      to her...

  # Spade, the gravedigger (3:25): he lends the Shovel
  - name: TX_5a92
    index: 0x92
    text: |-
      \col(1)Spade\col(0): A
      visitor? Here?
      Nobody comes
      anymore.\stop
      Me, I dig.
      Every day. So I
      don't have to
      think.\stop
      Here, take my
      \col(1)Shovel\col(0). Dig
      up what needs
      digging up.

  - name: TX_5a93
    index: 0x93
    text: |-
      \col(1)Spade\col(0): My
      shovel suits
      you. Dig gently:
      the earth
      remembers.

  # Noah, in the square of silence (1:62 ; $1a): before / after the cathedral
  - name: TX_5a94
    index: 0x94
    text: |-
      \col(1)Noah\col(0): Granny
      was always
      singing.\stop
      But I can't
      remember her
      voice anymore.\stop
      Not even with my
      eyes closed.
      Especially with
      my eyes closed.

  - name: TX_5a95
    index: 0x95
    text: |-
      \col(1)Noah\col(0): I can
      hear it!
      La la laa...\stop
      It's her song.
      It was in my
      head all along!

  # Noah's granny, in the Dream (0:62 ; $1b): where the key is
  - name: TX_5a96
    index: 0x96
    text: |-
      \col(1)Granny Rose\col(0):
      Oh! A little
      knight, in my
      Noah's dream!\stop
      The bell-ringer
      locked the
      cathedral. He
      was afraid of
      the silence.\stop
      Me, I buried the
      key. In front of
      the flowered
      grave, in the
      east graveyard.\stop
      It's my grave.
      The flowers are
      from Noah.

  # She gives the Piece of Heart (her sewing box)
  - name: TX_5a97
    index: 0x97
    text: |-
      \col(1)Granny Rose\col(0):
      You found the
      key? Then take
      this.\stop
      I hid it in my
      sewing box. For
      a day like this.

  - name: TX_5a98
    index: 0x98
    text: |-
      \col(1)Granny Rose\col(0):
      Tell Noah I'm
      still singing.
      He only has to
      listen.

  # The cathedral gate, without the key
  - name: TX_5a99
    index: 0x99
    text: |-
      The gate is
      locked. An old,
      rusty lock.

  # The widow Tide (1:74 ; $1c)
  - name: TX_5a9a
    index: 0x9a
    text: |-
      \col(1)Tide\col(0): My
      husband was a
      fisherman. He
      left before
      dawn.\stop
      I used to see
      him in my
      dreams. Now I
      don't dream at
      all.

  - name: TX_5a9b
    index: 0x9b
    text: |-
      \col(1)Tide\col(0): Last
      night he waved
      at me. From far
      away. He was
      smiling.\stop
      I think I'll
      sleep well.

  # The bell-ringer (1:63 ; $1d)
  - name: TX_5a9c
    index: 0x9c
    text: |-
      \col(1)Bell-ringer\col(0):
      Ding! Dong!
      I ring, I ring!\stop
      If I stop, all
      that's left is
      silence. And in
      silence, you
      remember.

  - name: TX_5a9d
    index: 0x9d
    text: |-
      \col(1)Bell-ringer\col(0):
      I'm ringing more
      softly tonight.\stop
      Silence... you
      can listen to
      it, after all.

  # The Echo Cathedral: the entrance (5:aa), the first time
  - name: TX_5a9e
    index: 0x9e
    text: |-
      \col(1)Marin\col(0): Shh!
      Someone's
      watching here.\stop
      The Insomnis's
      Watchers. They
      never sleep.\stop
      If they see
      you, you wake up
      at the start of
      the room.\stop
      Stay behind
      them. Hide
      behind the
      statues.

  # The choir (5:7b), the first time: the stairs to the memory
  - name: TX_5a9f
    index: 0x9f
    text: |-
      \col(1)Marin\col(0): These
      stairs...\stop
      It smells of
      salt. And warm
      soup.\stop
      ...I know that
      smell.

  # Tarin, in the memory (3:26, Marin's house in Mabe; $20): the scene
  - name: TX_5aa0
    index: 0xa0
    text: |-
      \col(1)Tarin\col(0): Oh! A
      visitor!\stop
      Sit down, kid.
      The soup's
      almost ready.\stop
      I always set
      three plates.
      My daughter's
      coming home.\stop
      She sings by
      the sea. She
      always comes
      home.

  - name: TX_5aa1
    index: 0xa1
    text: |-
      \col(1)Marin\col(0): ...Dad.\stop
      He can't see
      me. I'm just a
      seagull, here.\stop
      It doesn't
      matter. I'll
      sing him the
      verse.

  - name: TX_5aa2
    index: 0xa2
    text: |-
      \col(1)Tarin\col(0): Well!
      That seagull
      sings just like
      my Marin.\stop
      "If one day you
      forget me,
      listen to the
      sea: I'm still
      singing."\stop
      ...That's hers.
      I'm sure of it.

  - name: TX_5aa3
    index: 0xa3
    text: |-
      \col(1)Tarin\col(0): She'll be
      home soon. She
      always comes
      home.

  # End of chapter 5: the square of silence (1:62), the bells sing
  - name: TX_5aa4
    index: 0xa4
    text: |-
      \col(1)Noah\col(0): Listen!
      The bells...
      they're singing!\stop
      La la laa...
      It's Granny's
      song!\stop
      \col(1)Bell-ringer\col(0):
      I didn't touch a
      thing! It's the
      wind ringing.

  - name: TX_5aa5
    index: 0xa5
    text: |-
      \col(1)Marin\col(0): Shh...
      the wind has
      turned.\stop
      It's rising.
      Straight up, to
      the clouds.\stop
      It smells of
      feathers... An
      island up there,
      in the sky?

  # The Dream Notebook, 4 islands saved
  - name: TX_5aa6
    index: 0xa6
    text: |-
      \col(1)Dream
      Notebook\col(0)\stop
      \col(1)Mist\col(0): the
      lady sleeps, the
      old man stopped
      counting. Back!\stop
      \col(1)Jingle\col(0): Lila
      makes up
      knights. The
      kids play again!\stop
      \col(1)Lagoon\col(0):
      Heloise and
      Gaspard
      remember.
      Married every
      morning!\stop
      \col(1)Ember\col(0):
      Pinceau paints
      the sea. No two
      swords alike!

  # The Dream Notebook, 5 islands saved
  - name: TX_5aa7
    index: 0xa7
    text: |-
      \col(1)Dream
      Notebook\col(0)\stop
      \col(1)Mist\col(0): the
      lady sleeps, the
      old man stopped
      counting. Back!\stop
      \col(1)Jingle\col(0): Lila
      makes up
      knights. The
      kids play again!\stop
      \col(1)Lagoon\col(0):
      Heloise and
      Gaspard
      remember.
      Married every
      morning!\stop
      \col(1)Ember\col(0):
      Pinceau paints
      the sea. No two
      swords alike!\stop
      \col(1)Echoes\col(0): Noah
      hears Granny
      sing. Tide
      dreams again.

  # The raft, more than 4 islands: the first page ("More": the second one)
  - name: TX_5aa8
    index: 0xa8
    text: |-
      \col(1)Marin\col(0): I'm
      reading the
      wind... Where
      to?\stop
       \opt()Mist \opt()Jingle
       \opt()Lagoon \opt()More

  # The second page: 5 islands spotted
  - name: TX_5aa9
    index: 0xa9
    text: |-
      \col(1)Marin\col(0): Further
      out, then...\stop
       \opt()Ember
       \opt()Echoes

  # 6 islands
  - name: TX_5aaa
    index: 0xaa
    text: |-
      \col(1)Marin\col(0): Further
      out, then...\stop
       \opt()Ember \opt()Echoes
       \opt()Nest

  # 7 islands
  - name: TX_5aab
    index: 0xab
    text: |-
      \col(1)Marin\col(0): Further
      out, then...\stop
       \opt()Ember \opt()Echoes
       \opt()Nest \opt()Slumber

  # 8 islands (the Insomnis's Eye can't be reached by raft)
  - name: TX_5aac
    index: 0xac
    text: |-
      \col(1)Marin\col(0): Further
      out, then...\stop
       \opt()Ember \opt()Echoes
       \opt()Nest \opt()More

  # 8 islands: the third page
  - name: TX_5ade
    index: 0xde
    text: |-
      \col(1)Marin\col(0): Even
      further...\stop
       \opt()Slumber
       \opt()Eye

  # Bulle (3:24), after the Reef: her carbon fin (it was a surfboard)
  - name: TX_5adf
    index: 0xdf
    text: |-
      \col(1)Bulle\col(0): You
      silenced the
      Eel!\stop
      Here: my carbon
      fin. You'll zoom
      across the
      water!

  - name: TX_5ae0
    index: 0xe0
    text: |-
      The \col(1)carbon
      fin\col(0)!\stop
      On the water,
      you go twice as
      fast!

  # Chapter 6: the Nest of Winds (1:45-78)
  # Arriving at the updraft (1:75), the first time
  - name: TX_5ae1
    index: 0xe1
    text: |-
      \col(1)Bulle\col(0): Out
      at sea, the Pit
      goes down very,
      very deep.\stop
      Underwater, your
      hearts are your
      breath: the more
      you have, the
      longer you last.\stop
      At the bottom, a
      sword sleeps in
      the sand...
      or so they say.\stop
      Shall we dive?
        \opt()Yes \opt()No

  - name: TX_5ae2
    index: 0xe2
    text: |-
      Out of breath!\stop
      \col(1)Bulle\col(0) pulls the
      rope and brings
      you back up.

  - name: TX_5ae3
    index: 0xe3
    text: |-
      \col(1)Bulle\col(0): Any
      time you like!

  - name: TX_5ae4
    index: 0xe4
    text: |-
      The sword glows
      in the dark
      water...\stop
      \col(1)Bulle\col(0) pulls the
      rope: back up
      you go!

  - name: TX_5ae5
    index: 0xe5
    text: |-
      \col(1)Marin\col(0): Our
      blows do nothing
      to him!\stop
      Bulle spoke of a
      sword at the
      bottom of the
      Lagoon's Pit...\stop
      We need it!

  - name: TX_5ae6
    index: 0xe6
    text: |-
      \col(1)Bulle\col(0): Dive
      into the Pit
      again?
        \opt()Yes \opt()No

  - name: TX_5ae7
    index: 0xe7
    text: |-
      The sword is
      stuck in the
      sand...\stop
      You'd need more
      breath to free
      it: more hearts!

  - name: TX_5ae8
    index: 0xe8
    text: |-
      \col(1)Marin\col(0): Hey,
      what's that in
      your pocket...\stop
      Oh! Our photos!\stop
      How do you carry
      all that stuff?
      You don't even
      have a backpack!\stop
      ...But you kept
      a little room
      for our photos.\stop
      Let's look!

  - name: TX_5ae9
    index: 0xe9
    text: |-
      \col(1)Marin\col(0): Oh
      no... That one!\stop
      We do NOT talk
      about that one.

  - name: TX_5aea
    index: 0xea
    text: |-
      \col(1)Marin\col(0): Dad!
      And Bow Wow!\stop
      Dad feared him
      so much... Look:
      he's smiling
      anyway!

  - name: TX_5aeb
    index: 0xeb
    text: |-
      \col(1)Marin\col(0): Here
      I was showing
      you the sea...
      Remember?\stop
      ...Wait.\stop
      There was nobody
      else with us
      that day!\stop
      Who took this
      picture?!\stop
      ...And those
      gulls up high...\stop
      They were
      already there.

  - name: TX_5aec
    index: 0xec
    text: |-
      \col(1)Marin\col(0): Link?
      Link?!
      LIIIIIIINK!

  - name: TX_5aed
    index: 0xed
    text: |-
      \col(1)Marin\col(0): Shh...
      Nightmare ghosts
      on patrol.\stop
      If they see you,
      you wake up back
      at the start.\stop
      Sneak behind
      them... like a
      snake!

  - name: TX_5aee
    index: 0xee
    text: |-
      \col(1)Marin\col(0): So...
      Let's see if you
      remember
      Koholint...

  - name: TX_5aef
    index: 0xef
    text: |-
      \col(1)QUESTION!\col(0)\stop
      The village
      where I sang is
      called...?\stop
       \opt()Mabe \opt()Ukuku
       \opt()Animal

  - name: TX_5af4
    index: 0xf4
    text: |-
      And when I sang
      for the walrus,
      he...?\stop
       \opt()danced
       \opt()dove \opt()slept

  - name: TX_5af5
    index: 0xf5
    text: |-
      The noble with a
      castle on the
      island is...?\stop
       \opt()Richard
       \opt()Tarin \opt()Kanalet

  - name: TX_5af6
    index: 0xf6
    text: |-
      Koholint's totem
      animal is
      the...?\stop
       \opt()Flying Rooster
       \opt()Owl \opt()Walrus

  - name: TX_5af7
    index: 0xf7
    text: |-
      And my mother?
      Do you know who
      she is?\stop
       \opt()Yes... \opt()No

  - name: TX_5af8
    index: 0xf8
    text: |-
      ...Me neither.\stop
      Dad says she
      used to sing
      facing the sea,
      like me...\stop
      And one morning,
      she left with
      the wind.\stop
      ...I think I
      look like her.

  - name: TX_5af9
    index: 0xf9
    text: |-
      Last one! Who
      does Dad remind
      you of?\stop
       \opt()Mario \opt()Wario
       \opt()Luigi

  - name: TX_5afa
    index: 0xfa
    text: |-
      Mario? Who's
      that?\stop
      A plumber?! He
      breaks bricks
      with his head?!\stop
      Dad never broke
      a brick!\stop
      ...But it's true
      he sees a lot of
      stars.

  - name: TX_5afb
    index: 0xfb
    text: |-
      What?! His
      brother Luigi
      lives in the
      mountains?!\stop
      You even saw a
      Kirby in Eagle's
      Tower?!\stop
      What are you
      talking about?!
      As if your life
      was a game!\stop
      No more lives,
      and you start
      over?!\stop
      That's not what
      life is!\stop
      Stop believing
      you're in a
      game.\stop
      Don't play with
      my heart...\stop
      This is real.

  - name: TX_5afc
    index: 0xfc
    text: |-
      Yes! Well done!

  - name: TX_5afd
    index: 0xfd
    text: |-
      No... You forgot
      everything!

  - name: TX_5afe
    index: 0xfe
    text: |-
      \col(1)Marin\col(0): ...Well.
      You didn't
      forget a thing.\stop
      So... close your
      eyes.

  - name: TX_5aff
    index: 0xff
    text: |-
      \col(1)*Smack!*\col(0)\stop
      \col(1)Marin\col(0): Hehe!
      You're blushing!

  - name: TX_5a49
    index: 0x49
    text: |-
      \col(1)Marin\col(0): Hmm...
      You forgot some
      things.\stop
      We'll try again!
      And this time,
      study!

  - name: TX_5aad
    index: 0xad
    text: |-
      \col(1)Marin\col(0): We're
      flying!\stop
      ...No: the
      island is
      flying. Hold on,
      it's windy.\stop
      And watch your
      step. Down
      there, it's only
      clouds.

  # The cloud bridge (1:57), the first time
  - name: TX_5aae
    index: 0xae
    text: |-
      \col(1)Marin\col(0): Planks
      are missing...\stop
      Remember? In the
      Dream, nothing
      falls. The
      clouds hold,
      over there.

  # The lost Rito (1:76 ; $21): before / after the Nest
  - name: TX_5aaf
    index: 0xaf
    text: |-
      \col(1)Rito\col(0): I'm a
      Rito. I think.\stop
      I forgot the
      way home...\stop
      And how to fly.
      Silly, for a
      bird.

  - name: TX_5ab0
    index: 0xb0
    text: |-
      \col(1)Rito\col(0): The wind
      is singing! I
      remember!\stop
      You open your
      arms, and let it
      carry you.
      Goodbye!

  # Zephyr (1:67 ; $22): before / after the Nest
  - name: TX_5ab1
    index: 0xb1
    text: |-
      \col(1)Zephyr\col(0): I made
      these wings
      myself.\stop
      But jumping...
      What if they
      don't work?\stop
      I'm practicing.
      I look down. A
      lot.

  - name: TX_5ab2
    index: 0xb2
    text: |-
      \col(1)Zephyr\col(0): I
      jumped!\stop
      I glided all the
      way to the
      mills! My wings
      work!

  # Zephyr in the Dream (0:67 ; $23)
  - name: TX_5ab3
    index: 0xb3
    text: |-
      \col(1)Zephyr\col(0): In my
      dreams, I fly!\stop
      And the clouds
      hold you up.
      The bridge too:
      you can walk on
      it.

  # The millers (1:66 ; $24): before / after the Nest
  - name: TX_5ab4
    index: 0xb4
    text: |-
      \col(1)Miller\col(0): The
      wind stopped.\stop
      The mill's
      sails are
      asleep. And so
      is the grain.

  - name: TX_5ab5
    index: 0xb5
    text: |-
      \col(1)Miller\col(0): It's
      turning! It's
      singing!\stop
      We never ground
      it so fine.

  # Mother Plume, at the Nest (1:48 ; $25): she gives Roc's Feather
  - name: TX_5ab6
    index: 0xb6
    text: |-
      \col(1)Mother Plume\col(0):
      A little human,
      all the way to
      my nest without
      wings?\stop
      Here. A Roc's
      feather: it will
      teach you to
      jump.

  - name: TX_5ab7
    index: 0xb7
    text: |-
      \col(1)Mother Plume\col(0):
      The Nest awaits.
      Jump, little
      one.\stop
      The sky catches
      those who jump.

  # The Sky Spiral: the entrance (4:3c), the first time
  - name: TX_5ab8
    index: 0xb8
    text: |-
      \col(1)Marin\col(0): A
      spiral... We go
      around the heart
      of the nest.\stop
      Holes
      everywhere.
      Don't look down:
      jump!

  # Marin's Shadow (4:54): it speaks with Marin's voice; Marin answers
  - name: TX_5ab9
    index: 0xb9
    text: |-
      \col(1)Shadow\col(0): Stay
      asleep, \Link.\stop
      Stay with me.
      Here, nobody
      ever leaves.\stop
      \col(1)Marin\col(0): ...No.\stop
      I sing so he'll
      wake up.

  # End of chapter 6: the feather village (1:67), the wind comes back
  - name: TX_5aba
    index: 0xba
    text: |-
      \col(1)Miller\col(0): It's
      turning! The
      mills are
      turning!\stop
      \col(1)Zephyr\col(0): The
      wind is back.
      I'm jumping!\stop
      ...He's gliding!
      Gliding all the
      way to the
      mills!\stop
      \col(1)Rito\col(0): Thank
      you! I'm going
      home!

  - name: TX_5abb
    index: 0xbb
    text: |-
      \col(1)Marin\col(0): Shh...
      the wind has
      turned.\stop
      It's cold. It
      smells of
      snow... and of
      sleep.\stop
      An island where
      everyone sleeps.
      Without waking.

  # The Isle of Deep Sleep: the jetty (1:e1), on arrival
  - name: TX_5abc
    index: 0xbc
    text: |-
      \col(1)Marin\col(0): Brrr...
      Everything's
      frozen.\stop
      And so quiet...
      Listen. Someone
      is snoring.\stop
      The whole island
      is asleep!

  # The one-night king (1:e2): asleep / awake
  - name: TX_5abd
    index: 0xbd
    text: |-
      \col(1)Sleeper\col(0): Zzz...
      Kneel before
      your king...\stop
      Zzz... My
      palace... Zzz...

  - name: TX_5abe
    index: 0xbe
    text: |-
      \col(1)The king\col(0): Who
      woke me up?\stop
      In my dream,
      I was a king!\stop
      ...Well. Nice
      weather, at
      least.

  # The watchman (3:27): the Seed Shooter
  - name: TX_5abf
    index: 0xbf
    text: |-
      \col(1)Watchman\col(0): A
      visitor! Awake!\stop
      I'm the
      watchman: the
      only one who
      doesn't sleep.\stop
      The Frostling
      sings his
      lullaby in the
      Frost Palace.\stop
      It freezes
      everything. And
      everyone falls
      asleep.\stop
      Take my Seed
      Shooter. My
      hands are
      frozen.

  - name: TX_5ac0
    index: 0xc0
    text: |-
      \col(1)Watchman\col(0): The
      palace door is
      stuck in ice.\stop
      But in dreams,
      there is no
      ice...\stop
      The king talks
      about it in his
      sleep. Go and
      listen.

  # The little sister (3:28), the only one awake in her family
  - name: TX_5ac1
    index: 0xc1
    text: |-
      \col(1)Little girl\col(0):
      My family has
      slept
      for three years.\stop
      I don't want to
      sleep.\stop
      If I sleep, who
      will wake them?

  - name: TX_5ac2
    index: 0xc2
    text: |-
      \col(1)Little girl\col(0):
      They're awake!\stop
      Mom says I've
      grown up. I say
      they overslept.

  # The mother, the father (3:28)
  - name: TX_5ac3
    index: 0xc3
    text: |-
      \col(1)Mother\col(0): Zzz...
      my sweetie...
      it's
      so warm here...
      Zzz...

  - name: TX_5ac4
    index: 0xc4
    text: |-
      \col(1)Mother\col(0): Three
      years?! ...Come
      here, you. Come.

  - name: TX_5ac5
    index: 0xc5
    text: |-
      \col(1)Father\col(0): Zzz...
      five more
      minutes...
      Zzz...

  - name: TX_5ac6
    index: 0xc6
    text: |-
      \col(1)Father\col(0): What a
      night! I caught
      a fish as big
      as an island.

  # The singer (3:29): she sings in her sleep; the Dawn Bell wakes her up
  - name: TX_5ac7
    index: 0xc7
    text: |-
      (She sings in
      her sleep. A
      gentle tune.)\stop
      La la... laaa...

  - name: TX_5ac8
    index: 0xc8
    text: |-
      \col(1)Singer\col(0): That
      clear sound...
      you
      woke me up!\stop
      Thank you. Here:
      I kept this for
      whoever came.

  - name: TX_5ac9
    index: 0xc9
    text: |-
      \col(1)Singer\col(0): Your
      gull sings in
      tune.
      Tell her to
      hold the note!

  # The king in the Dream (0:e2): he is a king; he says where to hit
  - name: TX_5aca
    index: 0xca
    text: |-
      \col(1)The king\col(0):
      Welcome to my
      kingdom!\stop
      No ice here: my
      palace shines!\stop
      See the crystal
      on the islet?\stop
      My guard used to
      hit it from afar
      with seeds.\stop
      At an angle,
      like this! Hop!

  # The frozen palace door (1:c2), A in front
  - name: TX_5acb
    index: 0xcb
    text: |-
      The door is
      stuck in thick
      ice.\stop
      Nothing works.

  # The Dream crystal hit (0:c2)
  - name: TX_5acc
    index: 0xcc
    text: |-
      \col(1)Marin\col(0): The
      crystal sang!\stop
      In the Real,
      something must
      have given
      way...

  # The Frost Palace (1:c2), on arrival
  - name: TX_5acd
    index: 0xcd
    text: |-
      \col(1)Marin\col(0): The
      Frost Palace...
      Its
      door is frozen.\stop
      Someone here
      must know how to
      get in.

  # The Frost Palace: the entrance (4:55), the first time
  - name: TX_5ace
    index: 0xce
    text: |-
      \col(1)Marin\col(0): Crystals
      everywhere...\stop
      And the floor is
      frozen. Careful,
      it's slippery!

  # A guard asleep on his feet (the Frost Palace): asleep / woken up by the Bell
  - name: TX_5acf
    index: 0xcf
    text: |-
      (A guard is
      asleep on his
      feet. He snores
      loudly. No way
      through.)

  - name: TX_5ad0
    index: 0xd0
    text: |-
      \col(1)Guard\col(0): Huh?
      Is it morning?\stop
      ...Sorry, I was
      sleeping on my
      feet. I'm going
      home!

  # The Frostling (4:64); Marin answers
  - name: TX_5ad1
    index: 0xd1
    text: |-
      \col(1)Frostling\col(0): Let
      them sleep!\stop
      The cold is
      gentle. The cold
      doesn't hurt.\stop
      \col(1)Marin\col(0): Yes, it
      does.\stop
      It hurts when it
      stops.

  # End of chapter 7: the frozen village (1:b1), everyone wakes up
  - name: TX_5ad2
    index: 0xd2
    text: |-
      \col(1)Little girl\col(0):
      They're waking
      up!\stop
      Everyone's
      waking up! The
      cold is going
      away!\stop
      \col(1)The king\col(0): Well.
      I'm not a king
      anymore. But I
      slept well.

  - name: TX_5ad3
    index: 0xd3
    text: |-
      \col(1)Marin\col(0): Shh...
      the wind.\stop
      It comes from
      nowhere. It
      goes in circles.\stop
      Over there, a
      black tower, in
      the middle of
      the sea.\stop
      It never sleeps.

  # The Insomnis's Eye: the jetty (1:d9), on arrival
  - name: TX_5ad4
    index: 0xd4
    text: |-
      \col(1)Marin\col(0): A black
      tower...\stop
      And the sky: the
      sun and the
      moon, at the
      same time.\stop
      Here, it's never
      night.

  # The tower door (1:c9): closed, A in front
  - name: TX_5ad5
    index: 0xd5
    text: |-
      A black door,
      no handle.\stop
      Seven marks are
      carved on it.
      They look like
      notes.

  # The tower door opens: Marin sings the seven verses
  - name: TX_5ad6
    index: 0xd6
    text: |-
      \col(1)Marin\col(0): Seven
      marks... Seven
      verses.\stop
      I have them all.
      Listen.

  - name: TX_5ad7
    index: 0xd7
    text: |-
      \col(1)Marin\col(0): ...It's
      opening.\stop
      \Link, stay
      close to me.

  # The Sleepless Tower: the entrance (5:c0)
  - name: TX_5ad8
    index: 0xd8
    text: |-
      \col(1)Marin\col(0): Do you
      hear that?
      Music...\stop
      Almost nothing.
      A heartbeat.

  # 1F: the falling Moon (5:c1)
  - name: TX_5ad9
    index: 0xd9
    text: |-
      \col(1)Marin\col(0): Look
      up!\stop
      The moon... it's
      falling!\stop
      Quick! All four
      fires at once!

  # 2F: Dark Link (5:c4)
  - name: TX_5ada
    index: 0xda
    text: |-
      \col(1)Marin\col(0): \Link?
      ...No. It's
      your shadow.\stop
      I can't help you
      here. Not
      against you.

  # 3F: Ganon (5:c7)
  - name: TX_5adb
    index: 0xdb
    text: |-
      \col(1)Marin\col(0): That
      laugh...\stop
      You beat him
      already, right?\stop
      So why does he
      come back in
      your dreams?

  # 4F: the Nightmare of Koholint (5:ca)
  - name: TX_5adc
    index: 0xdc
    text: |-
      \col(1)???\col(0): DO YOU
      KNOW ME?\stop
      \col(1)Marin\col(0): ...\stop
      \Link. Don't
      answer it.

  # 1F: the moon goes back up (the four fires)
  - name: TX_5add
    index: 0xdd
    text: |-
      \col(1)Marin\col(0): Phew!
      The moon is
      going back
      up...\stop
      It dropped
      something!











# ==============================================================================
# Ages texts replaced (same name)
# ==============================================================================

# ==============================================================================
# La fin du jeu et l'après-jeu (le groupe 0x5a est plein)
# ==============================================================================
- group: 0x5b
  data:
  # The secret room (the Easter Egg, 5:ef): thanks, music test, sound test
  - name: TX_5b73
    index: 0x73
    text: |-
      \col(1)Thank you!\col(0)\stop
      To Denis: the
      ideas, the
      tests, the
      laughs.\stop
      To Drenn and the
      authors of
      oracles-disasm.\stop
      To Nintendo and
      Capcom: Oracle
      of Ages, Link's
      Awakening.\stop
      The winks:
      Konami, Pierre
      Bachelet, Taylor
      Davis, Euro-Mir.\stop
      And to you, for
      seeing it all!
  - name: TX_5b74
    index: 0x74
    text: |-
      Music \num1
       \opt()+1 \opt()-1
       \opt()Play \opt()Done
  - name: TX_5b75
    index: 0x75
    text: |-
      Sound \num1
       \opt()+1 \opt()-1
       \opt()Play \opt()Done
  # Marine on her island, everything done (the four game rings): her ring (Denis)
  - name: TX_5b72
    index: 0x72
    text: |-
      \col(1)Marine\col(0): You did
      it all, saw it
      all, won it all.\stop
      Here. It's...
      like an
      engagement ring.\stop
      Don't laugh!
      Keep it on you,
      always.
  # The Chameleon Ring, in the menu: setting the tunic color
  - name: TX_5b71
    index: 0x71
    text: |-
      Up, down: red,
      green, blue.
      Left, right:
      more or less.
      A: done!

  # The ending, on top of the Sleepless Tower (code/ages/balladeFin.s): Zelda, dreaming
  - name: TX_5b00
    index: 0x00
    text: |-
      \col(1)Zelda\col(0): Link...?
      Is that you...?\stop
      I waited for
      you so long...
      that I forgot
      how to sleep.
  - name: TX_5b01
    index: 0x01
    text: |-
      \col(1)Marin\col(0): It's
      her, isn't it?
      The one you were
      sailing home
      to...\stop
      She's the one
      who couldn't
      sleep. And the
      Insomnis fed on
      it.
  - name: TX_5b02
    index: 0x02
    text: |-
      \col(1)Marin\col(0): Sleep,
      princess. I know
      a song.\stop
      Mine. With its
      eighth verse.
  - name: TX_5b03
    index: 0x03
    text: |-
      \col(1)Marin\col(0): "Sleep,
      little light.
      What you dream
      hard is never
      lost."
  - name: TX_5b04
    index: 0x04
    text: |-
      The \col(1)Gull's
      Ballad\col(0) is
      complete!
  - name: TX_5b05
    index: 0x05
    text: |-
      \col(1)Zelda\col(0): Thank
      you... Link...
      I can finally...
      sleep...

  # The epilogue, on the waking beach (1:aa), and the credits
  - name: TX_5b06
    index: 0x06
    text: |-
      That night, for
      the first time,
      the whole
      archipelago fell
      asleep.\stop
      And in the
      morning...
  - name: TX_5b07
    index: 0x07
    text: |-
      \col(1)Marin\col(0): \Link!
      Look! My
      hands... in
      broad daylight!\stop
      The full song...
      The Wind Fish
      kept its word!
  - name: TX_5b08
    index: 0x08
    text: |-
      \col(1)Marin\col(0): I'm
      staying. I found
      an island all my
      own: the Gull's
      Nest.\stop
      Go home to
      Hyrule whenever
      you want...\stop
      But not before a
      game of
      volleyball!
  - name: TX_5b09
    index: 0x09
    text: |2-
       THE LEGEND OF
           ZELDA
       Gulls of Life
  - name: TX_5b0a
    index: 0x0a
    text: |-
      A game by
      Denis
      (soaresden).\stop
      Thank you,
      Denis: your
      ideas and your
      drive made this
      game.
  - name: TX_5b0b
    index: 0x0b
    text: |-
      Code, music and
      art:
      Claude
      (Anthropic).
  - name: TX_5b0c
    index: 0x0c
    text: |-
      Made with
      LynnaLab,
      oracles-disasm
      and hack-base.
  - name: TX_5b0d
    index: 0x0d
    text: |-
      Based on Link's
      Awakening and
      Oracle of Ages
      (Nintendo,
      Capcom).
  - name: TX_5b0e
    index: 0x0e
    text: |-
      Thank you for
      playing!\stop
            THE END

  # The Log Raft, page 3, after the ending: Marin's island too
  - name: TX_5b0f
    index: 0x0f
    text: |-
      \col(1)Marin\col(0): Even
      farther...\stop
      \opt()Slumber \opt()Eye
      \opt()Gull

  # Marin's island (the Gull's Nest), after the ending
  - name: TX_5b10
    index: 0x10
    text: |-
      \col(1)Marin\col(0): What
      do we do?\stop
      \opt()Volley \opt()Talk
      \opt()Come! \opt()Nothing
  - name: TX_5b11
    index: 0x11
    text: |-
      \col(1)Marin\col(0): First
      to 5!\stop
      Don't let the
      ball touch the
      sand on your
      side!
  - name: TX_5b12
    index: 0x12
    text: |-
      \col(1)Marin\col(0): What?!
      You won?!\stop
      ...Rematch!
  - name: TX_5b13
    index: 0x13
    text: |-
      \col(1)Marin\col(0): Heh
      heh! The gull
      always wins!
  - name: TX_5b14
    index: 0x14
    text: |-
      A seashell...
      It sings, very
      softly.\stop
      It seems to call
      far, far away.\stop
      \opt()Call \opt()No
  - name: TX_5b15
    index: 0x15
    text: |-
      \col(1)Zelda\col(0): Link!
      I can hear you!\stop
      Everyone sleeps
      well here now.\stop
      Come back
      whenever you
      want. I'll wait
      for you... by
      day!
  - name: TX_5b16
    index: 0x16
    text: |-
      \col(1)Zelda\col(0): Link!
      Still at
      Marin's?\stop
      Tell her thank
      you. For the
      song.

  # Volleyball: the score
  - name: TX_5b18
    index: 0x18
    text: |-
      Link: \num1
      Marin: \num2

  # Marin, on her island: what she says
  - name: TX_5b19
    index: 0x19
    text: |-
      \col(1)Marin\col(0): Hands,
      \Link! I can
      finally pinch
      you!
  - name: TX_5b1a
    index: 0x1a
    text: |-
      \col(1)Marin\col(0): My
      house looks like
      the one in Mabe.
      I like it.
  - name: TX_5b1b
    index: 0x1b
    text: |-
      \col(1)Marin\col(0): I
      sing for the
      gulls in the
      morning. They
      sing off-key.
  - name: TX_5b1c
    index: 0x1c
    text: |-
      \col(1)Marin\col(0): When
      are you going
      home to Hyrule?
      ...Nothing. Just
      asking.

  # After the ending: the islanders understood (code/ages/balladeObjects.s, villagerFinTexts)
  - name: TX_5b1d
    index: 0x1d
    text: |-
      We dreamed about
      you last night!\stop
      You were
      fighting a big
      shadow!
  - name: TX_5b1e
    index: 0x1e
    text: |-
      \col(1)Héloïse\col(0): I
      dreamed of a
      girl with a
      lamp.\stop
      She was waiting
      for someone.
      You, maybe?
  - name: TX_5b1f
    index: 0x1f
    text: |-
      \col(1)Postman\col(0): A
      letter for you!
      From Hyrule!\stop
      It just says:
      "By day."
  - name: TX_5b20
    index: 0x20
    text: |-
      \col(1)Noah\col(0): Last
      night, Granny
      sang in my
      dream.\stop
      A seagull song.
  - name: TX_5b21
    index: 0x21
    text: |-
      \col(1)Marée\col(0): I
      slept like a
      log.\stop
      My husband was
      smiling at me,
      in my dream.
  - name: TX_5b22
    index: 0x22
    text: |-
      Everyone sleeps
      at night now!\stop
      Even me.
      Especially me.
  - name: TX_5b23
    index: 0x23
    text: |-
      I dreamed you
      were chasing a
      big monster that
      never slept!

  # Marine suit Link, avec son épée (après la fin)
  - name: TX_5b24
    index: 0x24
    text: |-
      \col(1)Marin\col(0): I'm
      coming! I have
      my sword, look!\stop
      Wherever you
      go, I go. Even
      into dungeons!
  - name: TX_5b25
    index: 0x25
    text: |-
      \col(1)Marin\col(0): Home!
      I'll stay here
      for a bit.\stop
      Come get me on
      the beach!

  # Les Songes des Héros (code/ages/balladeSonges.s) : au Nid des Vents, dans le Songe
  - name: TX_5b26
    index: 0x26
    text: |-
      \col(1)Marin\col(0): The
      Nest of Winds...\stop
      The dreams of
      all who wanted
      to fly pass
      through here.\stop
      And the dreams
      of the heroes
      before you!
      Touch a bubble,
      you'll see!

  # La fée qui parle tout le temps (1er rêve)
  - name: TX_5b27
    index: 0x27
    text: |-
      \col(1)Fairy\col(0): Hey!
      Ho! Listen up!
  - name: TX_5b28
    index: 0x28
    text: |-
      \col(1)Fairy\col(0): Look!
      Look over there!
  - name: TX_5b29
    index: 0x29
    text: |-
      \col(1)Fairy\col(0): Link!
      Link! Are you
      listening?
  - name: TX_5b2a
    index: 0x2a
    text: |-
      \col(1)Fairy\col(0): Hey!
      Ho! It's this
      way!
  - name: TX_5b2b
    index: 0x2b
    text: |-
      \col(1)Marin\col(0): She
      talked like that
      ALL the time?!\stop
      I only talk
      when it helps.\stop
      ...Well,
      almost.

  # Les masques (2e rêve)
  - name: TX_5b2c
    index: 0x2c
    text: |-
      \col(1)Marin\col(0): Masks!
      Try them on,
      let's see!\stop
      A in front of
      one. All three,
      okay?
  - name: TX_5b2d
    index: 0x2d
    text: |-
      \col(1)Marin\col(0):
      \col(1)SMOKIN'!\col(0)\stop
      You look like a
      sulking nut!
  - name: TX_5b2e
    index: 0x2e
    text: |-
      \col(1)Marin\col(0):
      \col(1)SMOKIN'!\col(0)\stop
      You look...
      sturdy.\stop
      And a bit heavy.
      Sorry!
  - name: TX_5b2f
    index: 0x2f
    text: |-
      \col(1)Marin\col(0):
      \col(1)SMOKIN'!\col(0)\stop
      Oh! That one
      suits you! A
      boy of the
      sea...
  - name: TX_5b30
    index: 0x30
    text: |-
      \col(1)Marin\col(0): OK,
      give them back!
      These masks
      creep me out...

  # Célesbourg (3e rêve) : la princesse pousse Link ; Marine le rattrape
  - name: TX_5b31
    index: 0x31
    text: |-
      \col(1)Zelda\col(0): Link!
      Still afraid of
      heights?\stop
      Come on, jump!
      Your bird will
      catch you!
  - name: TX_5b32
    index: 0x32
    text: |-
      \col(1)Marin\col(0): Got
      you! Phew...\stop
      Your princess is
      crazy!\stop
      If you fall
      again, whistle.
      I'll come.
  - name: TX_5b33
    index: 0x33
    text: |-
      Marin's Whistle:
      if you fall, she
      catches you!

  # Bulle apprend le contre parfait (la Fosse, 3e profondeur ; code/ages/balladeObjects.s)
  - name: TX_5b34
    index: 0x34
    text: |-
      \col(1)Bulle\col(0): You
      went down deep!\stop
      Down there, you
      learn calm. The
      real kind.\stop
      Keep it in a
      fight: when an
      enemy strikes,
      draw your sword
      at the last
      moment.\stop
      Not before. Not
      after. Right on
      time: you slip
      through him!\stop
      You learned the
      \col(1)perfect parry\col(0)!

  # Marine félicite Link après chaque boss (INTERAC_MARINE $08, code/ages/balladeMarine.s)
  - name: TX_5b35
    index: 0x35
    text: |-
      \col(1)Marin\col(0): Well
      done! You're a
      real knight!
  - name: TX_5b36
    index: 0x36
    text: |-
      \col(1)Marin\col(0): Wow!
      You broke it
      like a toy!\stop
      Lila will be so
      proud of you!
  - name: TX_5b37
    index: 0x37
    text: |-
      \col(1)Marin\col(0): He
      made everything
      grey...\stop
      Look! The
      colors are
      coming back!
  - name: TX_5b38
    index: 0x38
    text: |-
      \col(1)Marin\col(0): She
      had my voice...\stop
      But you knew the
      real me. Thanks.
  - name: TX_5b39
    index: 0x39
    text: |-
      \col(1)Marin\col(0): You
      broke the ice!\stop
      Nothing scares
      the great Link!
  - name: TX_5b3a
    index: 0x3a
    text: |-
      \col(1)Marin\col(0): Your
      own shadow...
      and you beat it!\stop
      No one is like
      you, Link.
  - name: TX_5b3b
    index: 0x3b
    text: |-
      \col(1)Marin\col(0): Ganon!
      You beat him
      again!\stop
      You're a legend,
      Link!
  - name: TX_5b3c
    index: 0x3c
    text: |-
      \col(1)Marin\col(0): The
      nightmare of
      Koholint...\stop
      You fear nothing
      now. I'm so
      proud!
  - name: TX_5b3d
    index: 0x3d
    text: |-
      \col(1)Marin\col(0): A
      haunted machine,
      beaten!\stop
      Not even a snake
      could do better!

  # Le Mamono en Dur : gagné mais blessé ; le « perfect » (le gros lot)
  - name: TX_5b3e
    index: 0x3e
    text: |-
      Not bad at all!\stop
      But the jackpot
      means not one
      scratch! Come
      back anytime,
      champ.
  - name: TX_5b3f
    index: 0x3f
    text: |-
      Not one scratch!\stop
      Amazing! The
      jackpot is
      yours!

  # Le 1er labyrinthe des Lynels gagné : le forain envoie Link dans le 2e
  - name: TX_5b40
    index: 0x40
    text: |-
      Not bad, kid!\stop
      Now for the real
      maze: they're
      faster!

  # L'Arbre-Passage : on arrive sur l'île 1
  - name: TX_5b41
    index: 0x41
    text: |2-
          Island 1
        Mist Island

  - name: TX_5b42
    index: 0x42
    text: |2-
          Island 2
       Jingle Hamlet

  - name: TX_5b43
    index: 0x43
    text: |2-
          Island 3
         Lagoon of
            Vows

  - name: TX_5b44
    index: 0x44
    text: |2-
          Island 4
         Ember Peak

  - name: TX_5b45
    index: 0x45
    text: |2-
          Island 5
          Isle of
           Echoes

  - name: TX_5b46
    index: 0x46
    text: |2-
          Island 6
       Nest of Winds

  - name: TX_5b47
    index: 0x47
    text: |2-
          Island 7
        Isle of the
        Great Sleep

  - name: TX_5b48
    index: 0x48
    text: |2-
          Island 8
           Eye of
          Insomnis

  - name: TX_5b49
    index: 0x49
    text: |2-
          Island 9
        Gull's Nest

  # L'Arbre-Passage : le menu des îles (comme TX_5a50, 5a51, 5a52, 5aa8)
  - name: TX_5b4a
    index: 0x4a
    text: |-
      \col(1)Marin\col(0): The
      Passage Tree's
      roots reach
      every isle.
      Where to?\stop
       \opt()Mist
       \opt()Jingle

  - name: TX_5b4b
    index: 0x4b
    text: |-
      \col(1)Marin\col(0): The
      Passage Tree's
      roots reach
      every isle.
      Where to?\stop
       \opt()Mist \opt()Jingle
       \opt()Lagoon

  - name: TX_5b4c
    index: 0x4c
    text: |-
      \col(1)Marin\col(0): The
      Passage Tree's
      roots reach
      every isle.
      Where to?\stop
       \opt()Mist \opt()Jingle
       \opt()Lagoon \opt()Ember

  - name: TX_5b4d
    index: 0x4d
    text: |-
      \col(1)Marin\col(0): The
      Passage Tree's
      roots reach
      every isle.
      Where to?\stop
       \opt()Mist \opt()Jingle
       \opt()Lagoon \opt()More

  # The heart beep, 15 seconds idle: Marin gives a kiss (balladeMarine.kissCheck)
  - name: TX_5b4e
    index: 0x4e
    text: |-
      \col(1)Marin\col(0): That
      beeping is SO
      annoying!\stop
      Here, a kiss!

  # Bellhamlet, the Dream: Tic and Tac play hide-and-seek (balladeObjects.twins, hiding, kite)
  - name: TX_5b4f
    index: 0x4f
    text: |-
      Tic: Let's play
      hide-and-seek!\stop
      Tac: But we
      forgot how to
      hide...\stop
      Tic: So we just
      stand here, eyes
      wide open.\stop
      \col(1)Marin\col(0): In
      the Dream, I bet
      they'll dare!\stop
      Five hiding
      spots, Link.
      Your turn!
  - name: TX_5b50
    index: 0x50
    text: |-
      Tic: In your
      dreams, you
      found us \num1
      times out of 5!\stop
      Tic: Keep
      looking! We're
      good, huh?
  - name: TX_5b51
    index: 0x51
    text: |-
      Tic: You found
      us everywhere!\stop
      Even in the
      sandcastle!\stop
      Here, it's our
      treasure.
  - name: TX_5b52
    index: 0x52
    text: |-
      Tic: Now we
      hide for real!\stop
      Count to ten...
      And no peeking!
  - name: TX_5b53
    index: 0x53
    text: |-
      Tac: We close
      our eyes... but
      we still see
      everyone.
  - name: TX_5b54
    index: 0x54
    text: |-
      Tac: The
      sandcastle was
      my hiding spot!\stop
      Nobody ever
      found it.
  - name: TX_5b55
    index: 0x55
    text: |-
      Found! Drat!\stop
      \num1 hiding
      spots left!
  - name: TX_5b56
    index: 0x56
    text: |-
      Found! That was
      the last one!\stop
      Come see us at
      the playground,
      awake!
  - name: TX_5b57
    index: 0x57
    text: |-
      An old kite,
      stuck in the
      tree.\stop
      It doesn't move
      anymore.
  - name: TX_5b58
    index: 0x58
    text: |-
      Kite: Oh!
      Someone who
      dreams!\stop
      From up here, I
      see the whole
      island.\stop
      The twins at the
      playground are
      bored. Go see
      them!
  - name: TX_5b59
    index: 0x59
    text: |-
      Kite: I can see
      them from here!\stop
      In the woods, at
      the merry-go-
      round, the tops
      garden...\stop
      Under my tree,
      and in the
      sandcastle!
  - name: TX_5b5a
    index: 0x5a
    text: |-
      Kite: Well done!
      Someday, I'll
      ride the wind
      again too.
  - name: TX_5b5b
    index: 0x5b
    text: |-
      \col(1)Marin\col(0): Oh!
      The square is a
      giant board
      game!\stop
      In the Dream,
      even the paving
      wants to play!
  - name: TX_5b5c
    index: 0x5c
    text: |-
      \col(1)Marin\col(0): The
      drawbridge is
      down!\stop
      In the Real
      world, there's
      only water.\stop
      What if you
      woke up on the
      islet?

  # The Eye of the Insomnis: the sun and moon braziers (balladeObjects.brazier, towerDoor)
  - name: TX_5b5d
    index: 0x5d
    text: |-
      A brazier
      shaped like the
      sun. It's cold.
  - name: TX_5b5e
    index: 0x5e
    text: |-
      The sun shines
      on the west
      eyelid!
  - name: TX_5b5f
    index: 0x5f
    text: |-
      A brazier
      shaped like the
      moon. It's cold.
  - name: TX_5b60
    index: 0x60
    text: |-
      The moon shines
      on the east
      eyelid!
  - name: TX_5b61
    index: 0x61
    text: |-
      \col(1)Marin\col(0): The
      sun and the moon
      shine together!\stop
      The Eye will
      open. The tower
      is waiting!
  - name: TX_5b62
    index: 0x62
    text: |-
      \col(1)Marin\col(0): The
      flame went out!\stop
      This brazier is
      waiting for the
      moon.\stop
      A moon at
      night... in a
      dream, maybe?
  - name: TX_5b63
    index: 0x63
    text: |-
      \col(1)Marin\col(0): The
      flame went out!\stop
      There's no sun
      in dreams...
  - name: TX_5b64
    index: 0x64
    text: |-
      \col(1)Marin\col(0): The
      Eye stays shut.\stop
      The sun and the
      moon must shine
      in the sky
      together.\stop
      To the west, a
      sun brazier...\stop
      To the east, a
      moon brazier.

  # Le Récif Murmurant (5:39) : les coquillages-échos, la première fois (balladeObjects.echoShells)
  - name: TX_5b65
    index: 0x65
    text: |-
      Echo shells...\stop
      The big one
      sings a tune (A
      in front of it).\stop
      The small ones
      repeat it, in
      the same order.

  # Pinceau (1:19, $15): the missing color (balladeObjects.painter), then all three
  - name: TX_5b66
    index: 0x66
    text: |-
      \col(1)Pinceau\col(0): I
      still need
      yellow: the
      sulphur of the
      hot spring, to
      the east.

  - name: TX_5b67
    index: 0x67
    text: |-
      \col(1)Pinceau\col(0): I
      still need
      orange: the
      embers of
      Brasia's forge,
      in the village.

  - name: TX_5b68
    index: 0x68
    text: |-
      \col(1)Pinceau\col(0): I
      still need red:
      the lava by the
      lookout.\stop
      It burns! You'd
      have to dream
      it cold...

  - name: TX_5b69
    index: 0x69
    text: |-
      \col(1)Pinceau\col(0):
      Yellow, orange,
      red! Thank you!\stop
      But I still
      only see the
      volcano...\stop
      If only I could
      dream of the
      sea, just once.

  # Pinceau in the Dream (0:19, $16), without the three colors
  - name: TX_5b6a
    index: 0x6a
    text: |-
      \col(1)Pinceau\col(0): The
      sea! I can see
      it! With my eyes
      closed, I see
      it!\stop
      But my palette
      is empty... I
      need the colors
      of the volcano.

  # The sulphur crystal ($45, the hot spring 1:1b): yellow
  - name: TX_5b6b
    index: 0x6b
    text: |-
      A \col(1)sulphur
      crystal\col(0)! It
      smells like
      rotten eggs...\stop
      Yellow for
      Pinceau!

  # The forge hearth ($46, the village 1:2a): A in front; the Boomerang brings back an ember; after
  - name: TX_5b6c
    index: 0x6c
    text: |-
      The embers of
      Brasia's forge.
      Too hot for
      your hands!\stop
      You'd have to
      catch them from
      afar...

  - name: TX_5b6d
    index: 0x6d
    text: |-
      The
      \col(1)Boomerang\col(0)
      brings back an
      ember! Orange
      for Pinceau!

  # The lava stone ($47, the islet in the lava flow, 1:2c): red
  - name: TX_5b6e
    index: 0x6e
    text: |-
      A \col(1)lava stone\col(0),
      still red!\stop
      Red for
      Pinceau!

  - name: TX_5b6f
    index: 0x6f
    text: |-
      Brasia's embers
      glow softly.

  # Pinceau (1:19), the painting given, before the Sleeping Forge
  - name: TX_5b70
    index: 0x70
    text: |-
      \col(1)Pinceau\col(0): My
      sunset on the
      sea... Did you
      show it to
      anyone?



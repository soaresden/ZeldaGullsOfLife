# The Tin Soldier (the Armos Warrior, the Toy Chest's mini-boss)
- group: 0x2f
  data:
  # The Soot (the Sleeping Forge's mini-boss: Ages' Shadow Hag): she rises from Link's
  # shadow; the Lantern's flame burns her
  - name: TX_2f2b
    index: 0x2b
    text: |-
      Heh heh heh!\stop
      I am the Soot.
      I sleep in the
      Forge's
      shadows...\stop
      Your shadow will
      do nicely!\stop
      Looking for me?
      I'm always
      behind you!\stop
      Fire? Bah!
      Nobody lights
      the Forge
      anymore...


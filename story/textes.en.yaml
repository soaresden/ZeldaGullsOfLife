# The game's text, in English. Same text names as story/textes.yaml (French): the game picks
# one or the other with the language chosen at the start of a new game (wActiveLanguage).
#
# Engine rules: 16 characters per line at most (tools/check_text.py), \stop = wait for A then
# clear the box, \opt() = choice, \Link = the player's name. Texts of Ages that aren't listed
# here keep their original English.

groups:
- group: 0x5a
  data:

  # Prologue (opening film)
  - name: TX_5a00
    index: 0x00
    text: |-
      The Wind Fish
      had awoken.
      Koholint Island
      had vanished
      into the foam.\stop
      Clinging to a
      wreck, the hero
      drifted for long
      days...\stop
      ...until he
      reached islands
      where no one
      dreamed anymore.

  # The seagull lands next to Link
  - name: TX_5a01
    index: 0x01
    text: |-
      Hey!
      Wake up,
      sleepyhead!\stop
      ...\stop
      Don't you
      recognize me?\stop
      I've already
      pulled you out
      of the water
      once, you know.\stop
      It's becoming a
      habit!

  # Link stands up
  - name: TX_5a02
    index: 0x02
    text: |-
      It's me,
      \col(1)Marin\col(0)!\stop
      Remember? On the
      beach, I told
      you that if I
      were a seagull,
      I'd fly beyond
      the sea...\stop
      Before waking
      up, the Wind
      Fish heard my
      wish.\stop
      He told me:
      "What is dreamed
      strongly enough
      never truly
      disappears."\stop
      And there you
      go: wish granted
      word for word!\stop
      Maybe I should
      have said I
      wanted to keep
      my hands...\stop
      But I won't
      complain!\stop
      Are you happy
      to see me?
        \opt()Yes \opt()Totally!

  - name: TX_5a03
    index: 0x03
    text: |-
      Just "yes"?\stop
      Chatty as ever,
      aren't you?\stop
      I missed that,
      you know.\stop
      Come on.
      Something is
      strange about
      this island...

  - name: TX_5a04
    index: 0x04
    text: |-
      Hee hee!
      Me too,
      you know.\stop
      Come on.
      Something is
      strange about
      this island...

  # Where did all the items of Link's Awakening go?
  - name: TX_5a15
    index: 0x15
    text: |-
      Wait...
      Where's all
      your gear?\stop
      Your feather,
      your bracelet,
      your boots, your
      flippers...\stop
      The hookshot,
      the boomerang,
      the mirror
      shield, the
      fire rod...\stop
      The bow, the
      bombs, and even
      the magic
      powder?!\stop
      You lost it all
      at sea?!\stop
      ...\stop
      Well. You've got
      me, that's not
      bad, right?

  # She's cold: she slips into Link's tunic
  - name: TX_5a05
    index: 0x05
    text: |-
      Do you feel it,
      \Link?
      These islands
      are too quiet.\stop
      Brr! And the sea
      wind is
      freezing...\stop
      Right. I'm
      getting warm in
      your tunic!\stop
      And no comments!

  # From the tunic (where she spends the whole adventure)
  - name: TX_5a06
    index: 0x06
    text: |-
      Mmh... It smells
      of salt and
      adventure in
      here.\stop
      Let's see if
      anyone's around.\stop
      And don't break
      all their pots
      this time!\stop
      If you want to
      talk to me, hold
      \col(1)SELECT\col(0).\stop
      For your map,
      just tap it.

  # ============================================================================
  # SELECT held: Marin talks from the tunic (code/ages/balladeMarine.s)
  # ============================================================================

  # On the beach where Link woke up
  - name: TX_5a07
    index: 0x07
    text: |-
      Nobody on the
      beach...\stop
      People must live
      further in.
      Let's go see!

  # Port-Veille, in front of the inn (1:9a)
  - name: TX_5a08
    index: 0x08
    text: |-
      An inn!\stop
      They must have
      beds, right? A
      bed is for
      sleeping...\stop
      And when you
      sleep, you
      dream. That's
      your real
      talent.

  # The square of Port-Veille (1:9b)
  - name: TX_5a09
    index: 0x09
    text: |-
      They all have
      bags under their
      eyes...\stop
      Doesn't anyone
      sleep on this
      island? Brr. It
      gives me chills.

  # The east beach (1:9c)
  - name: TX_5a0a
    index: 0x0a
    text: |-
      Children who
      don't play...
      That's not
      normal.\stop
      On Koholint, we
      spent our days
      pretending!

  # The fishing port (1:ab)
  - name: TX_5a0b
    index: 0x0b
    text: |-
      A lighthouse...
      Did you see it,
      up north? It's
      completely dark.\stop
      A dark
      lighthouse is
      like a song no
      one sings
      anymore.

  # The path with the broken bridge (1:8a)
  - name: TX_5a0c
    index: 0x0c
    text: |-
      The bridge fell
      apart... There's
      nothing left!\stop
      The island is
      cut in two, with
      the sea running
      between.\stop
      And not a single
      worker on this
      island to build
      it again!\stop
      If only we could
      cross in a
      dream!\stop
      ...Wait. What if
      we could?

  # Inside the inn (3:9e)
  - name: TX_5a0d
    index: 0x0d
    text: |-
      The bed, over
      there! Stand in
      front of it and
      press \col(1)A\col(0) to
      lie down.\stop
      Me, I'm not
      moving. It's so
      cozy in your
      tunic!

  # Anywhere else: a random line
  - name: TX_5a10
    index: 0x10
    text: |-
      Yes? Do you
      need me?\stop
      I was taking a
      little nap...

  - name: TX_5a11
    index: 0x11
    text: |-
      Hey! Stop
      shaking me!\stop
      I'm very
      comfortable
      in here!

  - name: TX_5a12
    index: 0x12
    text: |-
      Did you know you
      snore when you
      sleep?\stop
      Just like my
      dad.\stop
      ...It actually
      feels kind of
      nice.

  - name: TX_5a13
    index: 0x13
    text: |-
      Lost? Tap
      \col(1)SELECT\col(0) for the
      map.\stop
      And for me,
      hold it down!

  # ============================================================================
  # The people of Port-Veille (INTERAC_BALLADE_NPC, scripts/ages/ballade.s)
  # ============================================================================

  # The innkeeper (3:9e)
  - name: TX_5a20
    index: 0x20
    text: |-
      Welcome to the
      Mist Inn...\stop
      A room?
      What for...\stop
      Nobody sleeps
      here anymore.
      Not since the
      lighthouse went
      dark.\stop
      We close our
      eyes, and...
      nothing. Black.
      As if our heads
      were emptied.\stop
      But you look
      exhausted. The
      bed is in the
      back. Free:
      no one uses it
      anymore.

  # The old fisherman (1:ab)
  - name: TX_5a21
    index: 0x21
    text: |-
      The lighthouse
      light used to
      guide our
      boats...\stop
      ...and it
      rocked our
      nights.\stop
      Since it went
      out, the mist
      never leaves
      the island.\stop
      And neither does
      sleeplessness.\stop
      The lighthouse
      is up north,
      past the cliffs.
      But the path's
      bridge has
      collapsed.\stop
      Nothing's left:
      the island is
      cut in two!\stop
      Workers, here?
      There aren't
      any. We're
      fishermen.

  # A boy (1:9c)
  - name: TX_5a22
    index: 0x22
    text: |-
      Play? What's
      playing?\stop
      Mom says we used
      to pretend to
      be knights.\stop
      Me, I can't
      pretend anymore.

  # Another child (1:9c)
  - name: TX_5a23
    index: 0x23
    text: |-
      I wanted to
      build a sand
      castle.\stop
      But I don't
      remember what a
      castle looks
      like...\stop
      I'd have to
      dream of one.

  # The sleepless lady (1:9b)
  - name: TX_5a24
    index: 0x24
    text: |-
      Three weeks
      without a wink
      of sleep.\stop
      I counted the
      stars, the
      waves, the
      grains of
      sand...\stop
      I was always
      one short.

  # The old man counting sheep (1:9b)
  - name: TX_5a25
    index: 0x25
    text: |-
      One hundred and
      forty-two
      sheep...
      One hundred and
      forty-three...\stop
      Ah! You made me
      lose count!\stop
      And there aren't
      even any sheep
      on this island!\stop
      \col(1)Marin\col(0):
      Pfft! Hee hee!

  # The teen who dreams of being a sailor (1:9a)
  - name: TX_5a26
    index: 0x26
    text: |-
      They say a
      lantern once
      burned atop the
      lighthouse, and
      it made all the
      islands dream.\stop
      I want to become
      a sailor.\stop
      But for that, I
      would have to
      dream of it
      first, right?

  # ============================================================================
  # The Dream World: human Marin (the dream inn, 2:9e)
  # ============================================================================

  # The first meeting: the hands scene
  - name: TX_5a27
    index: 0x27
    text: |-
      ...\stop
      Oh.\stop
      Oh!\stop
      I have hands!
      And feet!\stop
      I forgot how
      bad feet are
      for balance!\stop
      \Link!

  # The reunion hug
  - name: TX_5a2c
    index: 0x2c
    text: |-
      ...\stop
      I'm here.
      I'm alive.
      I have a body!\stop
      So I can finally
      hold you in my
      arms!

  # In his arms
  - name: TX_5a2f
    index: 0x2f
    text: |-
      I'm so, so,
      so happy!\stop
      Don't move.
      Just a little
      longer.\stop
      ...\stop
      Okay! Sorry.
      It's just...
      I was so scared
      of disappearing
      forever.

  # She steps back... and teases him
  - name: TX_5a32
    index: 0x32
    text: |-
      But hey...\stop
      I'm in YOUR
      dream!\stop
      What does that
      mean, huh?\stop
      You dream about
      me?! Hee hee!

  # What she never dared to ask
  - name: TX_5a2d
    index: 0x2d
    text: |-
      You know... on
      Koholint, I
      never knew if
      you really saw
      me.\stop
      Or if I was
      just the girl
      singing on the
      beach.
        \opt()I saw you
        \opt()...

  - name: TX_5a28
    index: 0x28
    text: |-
      ...Dummy.\stop
      I'm going to
      cry, and even
      in a dream, it's
      still wet.

  - name: TX_5a29
    index: 0x29
    text: |-
      Chatty as
      ever.\stop
      It's okay. I
      understood
      anyway.

  # Afterwards, when you talk to her
  - name: TX_5a2a
    index: 0x2a
    text: |-
      This is the
      \col(1)Dream World\col(0):
      the world as we
      dream it.\stop
      I can only be
      myself when you
      sleep. So don't
      stay up too
      late, okay?\stop
      In the world of
      dreams, anything
      is possible!\stop
      Even parting the
      sea in two, like
      Moses!\stop
      Go and look
      where the bridge
      used to be!\stop
      Hee hee! You're
      a sleepwalker
      now!\stop
      And you'll wake
      up right where
      you are.\stop
      But hurry!
      Outside, the sun
      rises fast...\stop
      Run, don't
      dawdle!

  # At the inn, A in front of the bed
  - name: TX_5a16
    index: 0x16
    text: |-
      This bed looks
      really cozy...
      Take a nap?
        \opt()Yes \opt()No

  # In the Dream World, SELECT: wake up?
  - name: TX_5a14
    index: 0x14
    text: |-
      Do you want to
      wake up?
        \opt()Yes \opt()No

  # ============================================================================
  # The old fisherman gives Link his sword back (the first time you talk to him)
  # ============================================================================
  - name: TX_5a2b
    index: 0x2b
    text: |-
      Hey, you! You're
      the castaway,
      right?\stop
      I fished this
      out yesterday,
      in my nets.\stop
      A sword! It must
      be yours.\stop
      The rest of your
      stuff? Oh, I saw
      things floating,
      far out...\stop
      But row all the
      way out there?
      Too lazy!\stop
      Heh heh! You'll
      have to start
      from scratch,
      pal!\stop
      Take it. The
      lighthouse up
      north isn't safe
      since it went
      dark.

  # Right after: Marin, from the tunic, about the sword
  - name: TX_5a2e
    index: 0x2e
    text: |-
      \col(1)Marin\col(0):
      Wait... Wasn't
      your sword a
      level 3 sword?\stop
      This says
      level 1!\stop
      Did the sea salt
      rust it? Or did
      you pack it
      badly...\stop
      No backpack,
      that's the
      problem!

  # ============================================================================
  # The Dark Lighthouse
  # ============================================================================

  # Marin, entering the lighthouse (SELECT)
  - name: TX_5a0e
    index: 0x0e
    text: |-
      Brr... It's cold
      in here.\stop
      The lighthouse
      should shine all
      the way up
      there. Shall we
      climb?

  # ============================================================================
  # After the lighthouse: on a black screen, Marin talks, then "To be continued"
  # ============================================================================
  - name: TX_5a30
    index: 0x30
    text: |-
      \col(1)Marin\col(0): Link!
      Look! The
      lighthouse is
      shining again!\stop
      Tonight, all of
      Port-Veille will
      dream...\stop
      Come on, let's
      go and see!

  - name: TX_5a31
    index: 0x31
    text: |-

       To be continued

  # The sleepwalker: just before waking up (INTERAC_BALLADE_DREAM_FX)
  - name: TX_5a33
    index: 0x33
    text: |-
      \col(1)Marin\col(0): The
      sun is rising...
      You're about to
      wake up!

  # The Lighthouse, boss room: Jack (the pumpkin) threatens, Marin answers back
  - name: TX_5a34
    index: 0x34
    text: |-
      \col(2)Jack\col(0): Heh
      heh heh... A
      little hero and
      his seagull?\stop
      This lighthouse
      is mine! It will
      stay dark
      forever!\stop
      I'll snuff you
      both out like
      candles!

  - name: TX_5a35
    index: 0x35
    text: |-
      \col(1)Marin\col(0): Oh
      yeah?! I don't
      even like
      pumpkin, but
      we'll carve you
      up anyway, Jack!

  # The rhythm final boss (INTERAC_BALLADE_RHYTHM): Marin cheers Link on (Denis's ideas). Two
  # lines only (a 3rd one would wait for A); she just talks: the box closes by itself after ~3
  # seconds (\wait), during the bars with no note to hit.
  # At the start, during the count-in
  - name: TX_5a36
    index: 0x36
    text: |-
      Come on, give me
      an 'A'!\wait(120)

  # A good round: the song comes back (level 2)
  - name: TX_5a37
    index: 0x37
    text: |-
      Yeah... I know
      this one!...\wait(120)

  # Another good round (level 3): she focuses, she catches her breath
  - name: TX_5a38
    index: 0x38
    text: |-
      I'm catching
      my breath...\wait(120)

  # The last good round: she is about to sing
  - name: TX_5a39
    index: 0x39
    text: |-
      You remembered
      \heart!\wait(120)

  # She starts singing
  - name: TX_5a3a
    index: 0x3a
    text: |-
      I'm gonna get
      him!\wait(120)

  # The finishing blow, at the end of her song
  - name: TX_5a3b
    index: 0x3b
    text: |-
      GO BACK WHERE
      YOU CAME FROM!\wait(120)

  # After level 2 (5 levels, like the 5 stages of Lorule Castle)
  - name: TX_5a3c
    index: 0x3c
    text: |-
      That's it!
      Louder!\wait(120)

  # After level 4: her voice is coming back
  - name: TX_5a3d
    index: 0x3d
    text: |-
      My voice... it's
      coming back!\wait(120)

  # The end of chapter 1: the village tour (INTERAC_MARINE $05), then the villagers keep these
  # lines (scripts/ages/ballade.s)
  - name: TX_5a3e
    index: 0x3e
    text: |-
      Zzz... Zzz...\stop
      Mmm... I'm
      sleeping...
      I'm SLEEPING!\stop
      Thank you... kid
      ...Zzz...

  - name: TX_5a3f
    index: 0x3f
    text: |-
      No more counting
      sheep...\stop
      I close my
      eyes, and poof!
      I dream of a big
      green meadow...\stop
      ...Zzz...

  - name: TX_5a40
    index: 0x40
    text: |-
      Let's play
      knights! I'm
      Link!\stop
      And I'm the
      talking seagull!
      Hee hee!

  - name: TX_5a41
    index: 0x41
    text: |-
      Customers! All
      my rooms are
      taken!\stop
      Everyone wants
      to sleep at the
      Mist Inn!\stop
      And me... I'm
      yawning...
      Hooaah!

  - name: TX_5a42
    index: 0x42
    text: |-
      \col(1)Marin\col(0): Well
      done! We saved
      these people!\stop
      So that's what
      you were doing
      while I was in
      the village?\stop
      Clearing
      dungeons and
      solving
      puzzles?\stop
      But... that's
      thrilling!\stop
      I don't regret
      coming with you
      after all!\stop
      All aboaaaard!

  # The fairground man's Rupee Dig (1:ac ; code/ages/balladeCreuse.s)
  - name: TX_5a43
    index: 0x43
    text: |-
      Step right up!
      The Rupee Dig!\stop
      Dig the sand,
      grab the
      rupees... but
      watch for bombs!\stop
      Easy: 10 rupees
      Medium: 20
      Hard: 30!\stop
      \opt()Easy \opt()Medium
      \opt()Hard \opt()No

  - name: TX_5a44
    index: 0x44
    text: |-
      Dig! Dig!
      The sand won't
      dig itself!

  - name: TX_5a45
    index: 0x45
    text: |-
      Not enough
      rupees, kid!
      Come back
      richer!

  - name: TX_5a46
    index: 0x46
    text: |-
      \col(1)Marin\col(0): Green,
      nothing around.
      Blue, one bomb.
      Red, two...\stop
      Gold... run!

  - name: TX_5a47
    index: 0x47
    text: |-
      BOOM!\stop
      Heh heh... The
      house always
      wins!

  - name: TX_5a48
    index: 0x48
    text: |-
      What?! You found
      them all?!\stop
      Well... nice
      job, kid.

  # ============================================================================
  # Chapter 2: Jingle Hamlet
  # ============================================================================

  # The Log Boat (INTERAC_BALLADE_OBJECT $00): as many islands as Marin has spotted
  - name: TX_5a50
    index: 0x50
    text: |-
      \col(1)Marin\col(0): I'm
      reading the
      wind... Where
      to?\stop
       \opt()Mist
       \opt()Jingle

  - name: TX_5a51
    index: 0x51
    text: |-
      \col(1)Marin\col(0): I'm
      reading the
      wind... Where
      to?\stop
       \opt()Mist \opt()Jingle
       \opt()Lagoon

  - name: TX_5a52
    index: 0x52
    text: |-
      \col(1)Marin\col(0): I'm
      reading the
      wind... Where
      to?\stop
       \opt()Mist \opt()Jingle
       \opt()Lagoon \opt()Ember

  - name: TX_5a53
    index: 0x53
    text: |-
      \col(1)Marin\col(0): We're
      already here,
      silly!

  # End of chapter 1, at the harbour (after "All aboaaaard!"): Marin reads the wind
  - name: TX_5a54
    index: 0x54
    text: |-
      \col(1)Marin\col(0): Shh!
      Listen...\stop
      The wind... It
      smells like
      candy.\stop
      And it jingles
      like little
      bells!\stop
      There's an
      island up north!
      People there
      have lost their
      dreams, I can
      feel it.\stop
      Your old log is
      still floating
      by the Jetty,
      west of the
      village.\stop
      With some rope,
      it'll make a
      raft!\stop
      I'll read the
      wind... and
      you'll row!

  # Arriving at Jingle Hamlet, the first time (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a55
    index: 0x55
    text: |-
      \col(1)Marin\col(0): Land!\stop
      Houses of every
      color... and
      that jingling
      sound!\stop
      But it's awfully
      quiet for a
      village full of
      kids.

  # The Box Cave (5:b0), on first entering: Marin learns to carry a bomb
  - name: TX_5a56
    index: 0x56
    text: |-
      \col(1)Marin\col(0): Oh!
      A bell, across
      the chasm!\stop
      What if we made
      it ring?\stop
      I've got an
      idea! Hold a
      bomb over your
      head and press
      \col(1)SELECT\col(0)!\stop
      I'll carry it
      over the pit.
      But hurry, it's
      hot!

  # In front of the cave cliff (1:32), the first time
  - name: TX_5a57
    index: 0x57
    text: |-
      \col(1)Marin\col(0): Rocks
      are blocking a
      cave...\stop
      A bomb would do
      the trick. Maybe
      the village shop
      sells some?

  # The innkeeper gives the Dream Notebook (village tour, or later when spoken to)
  - name: TX_5a58
    index: 0x58
    text: |-
      Here, kid: my
      old guestbook.\stop
      My guests used
      to write their
      dreams in it.\stop
      Write down the
      ones you give
      back to people!

  # Lila (Lila's house, 3:21), before finding her toy
  - name: TX_5a59
    index: 0x59
    text: |-
      \col(1)Lila\col(0): I don't
      know how to play
      anymore.\stop
      Sir Cork and I
      used to hunt
      dragons...\stop
      But he fell in
      the Box Cave.
      And rocks
      blocked it.\stop
      Without him, I
      can't pretend
      anymore.

  # Lila gets Sir Cork back and falls asleep
  - name: TX_5a5a
    index: 0x5a
    text: |-
      \col(1)Lila\col(0): Sir
      Cork! You found
      him!\stop
      Oh... he says he
      saw a dragon...\stop
      *yawn*
      I'm so sleepy,
      all of a
      sudden...\stop
      Come play in my
      dream, too...
      Zzz...

  - name: TX_5a5b
    index: 0x5b
    text: |-
      \col(1)Marin\col(0): She
      fell asleep!\stop
      Lie down on the
      bed next to her:
      we'll get into
      her dream!

  - name: TX_5a5c
    index: 0x5c
    text: |-
      \col(1)Lila\col(0): Zzz...
      Charge, Sir
      Cork... Zzz...

  # In Lila's dream (2:21)
  - name: TX_5a5d
    index: 0x5d
    text: |-
      \col(1)Lila\col(0): You
      came! Welcome to
      my dream!\stop
      My toys are in
      the big chest...\stop
      But a nasty
      Puppet guards
      them all! He
      won't let anyone
      play.\stop
      You'll save
      them, right?

  - name: TX_5a5e
    index: 0x5e
    text: |-
      The \col(1)Toy Chest\col(0).
      Go in?
       \opt()Yes \opt()No

  # The Dream Notebook (ITEM_12), depending on how many islands are saved
  - name: TX_5a60
    index: 0x60
    text: |-
      \col(1)Dream
      Notebook\col(0)\stop
      \col(1)Mist\col(0): the
      lady sleeps, the
      old man stopped
      counting. Back!\stop
      \col(1)Jingle\col(0): Lila
      can't pretend
      anymore. The
      kids don't play.

  - name: TX_5a61
    index: 0x61
    text: |-
      \col(1)Dream
      Notebook\col(0)\stop
      \col(1)Mist\col(0): the
      lady sleeps, the
      old man stopped
      counting. Back!\stop
      \col(1)Jingle\col(0): Lila
      makes up
      knights. The
      kids play again!

  # The Toy Chest: Marin in front of the bell (4:34)
  - name: TX_5a62
    index: 0x62
    text: |-
      \col(1)Marin\col(0): Another
      bell, across
      the pit!\stop
      You know what
      to do: a bomb,
      and \col(1)SELECT\col(0)!

  # Stringless Puppet (the boss, 4:2b) threatens; Marin answers
  - name: TX_5a63
    index: 0x63
    text: |-
      \col(2)Puppet\col(0): Who
      holds my
      strings? Nobody!\stop
      So I dance on
      my own... and I
      crush you!\stop
      \col(1)Marin\col(0): You
      dance badly.\stop
      Link, he's too
      high for you.
      Stand under
      him, a bomb,
      \col(1)SELECT\col(0): I'll
      make him eat it!\stop
      But he has to
      be \col(1)red\col(0) when I
      get there!\stop
      Hold the bomb
      ready, and send
      me as soon as he
      turns purple!

  # End of chapter 2: Lila wakes up (3:21)
  - name: TX_5a64
    index: 0x64
    text: |-
      \col(1)Lila\col(0): Oh!
      You're here!\stop
      I dreamed of a
      knight all in
      green...\stop
      He had a gull in
      his tunic! And
      he cut the
      strings of a
      nasty puppet!\stop
      He and Sir Cork
      are friends now!

  - name: TX_5a65
    index: 0x65
    text: |-
      \col(1)Marin\col(0): Hee
      hee... A knight
      all in green,
      huh?\stop
      Come on, let's
      go see outside!

  # End of chapter 2: the Jingle square (1:11)
  - name: TX_5a66
    index: 0x66
    text: |-
      The kids are
      playing again!
      Laughter
      everywhere.\stop
      \col(1)Marin\col(0): The
      bell is jingling
      again!

  - name: TX_5a67
    index: 0x67
    text: |-
      \col(1)Marin\col(0): Shh...
      the wind has
      changed.\stop
      It smells of
      salt and orange
      blossom.\stop
      A ring-shaped
      island, to the
      southeast...\stop
      Someone there is
      waiting for
      someone. I can
      feel it.

  # The kids in the square (INTERAC_BALLADE_OBJECT $0b, $0c), before and after the Toy Chest
  - name: TX_5a68
    index: 0x68
    text: |-
      We're waiting.\stop
      We're not
      allowed to play.\stop
      Who said that?
      We don't
      remember...

  - name: TX_5a69
    index: 0x69
    text: |-
      We're playing
      knights! You can
      be the Puppet!

  - name: TX_5a6a
    index: 0x6a
    text: |-
      We used to play
      hide-and-seek...\stop
      But why hide?
      Nobody comes
      looking.

  - name: TX_5a6b
    index: 0x6b
    text: |-
      Shh! I'm
      hiding!\stop
      You didn't see
      me, right?

  # Mrs. Bonnet, the teacher (the school, 3:22; INTERAC_BALLADE_OBJECT $0d)
  - name: TX_5a6c
    index: 0x6c
    text: |-
      \col(1)Mrs. Bonnet\col(0):
      Two times two,
      four. Three
      times two, six.\stop
      I used to tell
      stories...\stop
      I can't remember
      how they begin.

  - name: TX_5a6d
    index: 0x6d
    text: |-
      \col(1)Mrs. Bonnet\col(0):
      Once upon a
      time... a green
      knight, and a
      singing gull!\stop
      It's coming
      back to me!

  # Lila, after the Toy Chest
  - name: TX_5a6e
    index: 0x6e
    text: |-
      \col(1)Lila\col(0): Sir Cork
      and I are off to
      hunt the dragon!\stop
      Want to come?

  # Chapter 3: Lagoon of Vows (1:04-37)
  # Arriving at the jetty (1:24), the first time (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a70
    index: 0x70
    text: |-
      \col(1)Marin\col(0): A
      lagoon! The
      water is all
      turquoise...\stop
      There's a house
      up there. Shall
      we say hello?

  # Gaspard (3:23 ; INTERAC_BALLADE_OBJECT $11): before the bottle
  - name: TX_5a71
    index: 0x71
    text: |-
      \col(1)Gaspard\col(0): Hello,
      young man. I'm
      Gaspard.\stop
      That lady? I
      don't know her.
      She makes me tea
      every morning.\stop
      Once, I threw a
      bottle into the
      sea. For
      someone...\stop
      It got stuck on
      the islet in the
      middle of the
      lagoon.\stop
      But I forgot who
      it was for. And
      how to swim.\stop
      \col(1)Marin\col(0): The
      lagoon is too
      deep...\stop
      But in a dream,
      the sea parts!
      From the west
      side, maybe?

  # Gaspard: Link gives back the bottle (he gives Zora's Flippers)
  - name: TX_5a72
    index: 0x72
    text: |-
      \col(1)Gaspard\col(0): My
      bottle! There's
      a letter...\stop
      "Heloise, I'll
      find you again,
      even if you
      forget me. G."\stop
      Heloise...
      Heloise!
      She's my wife!\stop
      Here, take my
      \col(1)Zora's
      Flippers\col(0).\stop
      They're for
      someone who
      still has
      someone to find.\stop
      \col(1)Marin\col(0): ...Is he
      talking about
      me, you think?

  # Gaspard, after
  - name: TX_5a73
    index: 0x73
    text: |-
      \col(1)Gaspard\col(0): Every
      morning, I ask
      Heloise to marry
      me.\stop
      She says yes,
      every time!

  # Heloise (3:23 ; INTERAC_BALLADE_OBJECT $0e): before / after the Murmuring Reef
  - name: TX_5a74
    index: 0x74
    text: |-
      \col(1)Heloise\col(0): Hello!
      That gentleman?
      A neighbour, I
      think.\stop
      He has lovely
      sad eyes. I make
      him tea. It
      helps.

  - name: TX_5a75
    index: 0x75
    text: |-
      \col(1)Heloise\col(0): We got
      married on the
      beach up there.
      I remember!\stop
      He wore
      flippers. To
      dance. What a
      fool!

  # Bulle, the diving instructor (3:24 ; $0f)
  - name: TX_5a76
    index: 0x76
    text: |-
      \col(1)Bulle\col(0): Welcome
      to the diving
      club!\stop
      Well... it's
      closed. Nobody
      dreams of seeing
      the bottom now.

  - name: TX_5a77
    index: 0x77
    text: |-
      \col(1)Bulle\col(0): The
      bottom of the
      lagoon shines
      again!\stop
      Come back soon:
      we'll go diving!

  # The bottle postman (the bottle beach, 1:35 ; $10)
  - name: TX_5a78
    index: 0x78
    text: |-
      \col(1)Postman\col(0): I pick
      up bottles from
      the sea.\stop
      But I can't
      remember who the
      letters are
      for...\stop
      Me, nobody ever
      wrote to me.

  - name: TX_5a79
    index: 0x79
    text: |-
      \col(1)Postman\col(0): A
      bottle, this
      morning! For me!\stop
      "Thank you for
      keeping our
      words. H. and
      G."

  # The lovers' cave (5:b1), on entering (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a7a
    index: 0x7a
    text: |-
      \col(1)Marin\col(0): Hearts
      carved
      everywhere...\stop
      "G + H,
      forever."\stop
      Gaspard and
      Heloise!\stop
      ...Hey! Don't
      look at me like
      that!

  # In front of the Murmuring Reef (1:36), the first time
  - name: TX_5a7b
    index: 0x7b
    text: |-
      \col(1)Marin\col(0): The
      Murmuring
      Reef... Can you
      hear it
      whisper?\stop
      In there, it's
      water all over.
      Seagulls don't
      dive.\stop
      I'll wait here,
      \Link. Come back
      soon.

  # End of chapter 3: the bottle beach (1:35), Marin was waiting
  # Le Carnet des Rêves, après la Lagune des Serments (3 îles sauvées)
  - name: TX_5a7f
    index: 0x7f
    text: |-
      \col(1)Dream
      Notebook\col(0)\stop
      \col(1)Mist\col(0): the
      lady sleeps, the
      old man stopped
      counting. Back!\stop
      \col(1)Jingle\col(0): Lila
      makes up
      knights. The
      kids play again!\stop
      \col(1)Lagoon\col(0):
      Heloise and
      Gaspard
      remember.
      Married every
      morning!

  - name: TX_5a7c
    index: 0x7c
    text: |-
      \col(1)Marin\col(0): \Link!\stop
      You took so
      long. Don't ever
      do that again.\stop
      ...You know
      what? That's
      what the third
      verse says. Word
      for word.\stop
      Come on. Things
      are happening at
      Gaspard's!

  # At Heloise and Gaspard's (3:23)
  - name: TX_5a7d
    index: 0x7d
    text: |-
      \col(1)Heloise\col(0):
      Gaspard!
      You wore your
      flippers to
      dance, that
      day...\stop
      \col(1)Gaspard\col(0): And
      you cried with
      laughter. Hello,
      my wife.

  - name: TX_5a7e
    index: 0x7e
    text: |-
      \col(1)Marin\col(0): Shh...
      the wind has
      turned.\stop
      It smells of
      smoke and hot
      iron.\stop
      A smoking
      mountain, to the
      north... I can
      hear hammering.


  # Le menu de test caché (code/ages/balladeDebug.s ; HAUT tenu 5 s à l'écran titre) :
  # la langue, l'île, le moment, et dans le donjon l'endroit. Le même dans les deux fichiers.
  - name: TX_5af0
    index: 0xf0
    text: |-
       \opt()Français
       \opt()English

  - name: TX_5af1
    index: 0xf1
    text: |-
       \opt()1 \opt()2 \opt()3 \opt()4
       \opt()5 \opt()6 \opt()7 \opt()8

  - name: TX_5af2
    index: 0xf2
    text: |-
       \opt()Plage \opt()Ville
       \opt()Donjon \opt()Fin

  - name: TX_5af3
    index: 0xf3
    text: |-
       \opt()Entrée \opt()M-boss
       \opt()Boss

  # The language choice, at the start of a new game (the same in both files)
  - name: TX_5a17
    index: 0x17
    text: |-
         \opt()Français
         \opt()English

  # Chapter 4: Ember Peak (1:08-3c)
  # Arriving at the jetty (1:38), the first time (INTERAC_BALLADE_OBJECT $01)
  - name: TX_5a80
    index: 0x80
    text: |-
      \col(1)Marin\col(0): Ugh,
      it smells like
      rotten eggs!\stop
      A volcano...
      It's asleep, but
      it snores.\stop
      Someone's
      hammering up
      there. Always
      the same blow.
      Bong. Bong.

  # Brasia, the Goron smith (1:2a ; INTERAC_BALLADE_OBJECT $14): before the painting
  - name: TX_5a81
    index: 0x81
    text: |-
      \col(1)Brasia\col(0): Bong!
      Four hundred
      and twelve
      swords! All the
      same!\stop
      I'm out of
      ideas, kid. Not
      one left. The
      volcano sleeps,
      so does my head.\stop
      If someone
      showed me
      something I've
      never seen...

  # Brasia: Link shows her the painting of the sea (she gives the Power Bracelet)
  - name: TX_5a82
    index: 0x82
    text: |-
      \col(1)Brasia\col(0): Is
      that...
      the sea?!
      Blue, moving,
      never sitting
      still!\stop
      A sword shaped
      like a wave! I
      have an idea!
      AN IDEA!\stop
      Here, my
      \col(1)Power
      Bracelet\col(0). I
      don't need it:
      I have an idea!

  - name: TX_5a83
    index: 0x83
    text: |-
      \col(1)Brasia\col(0): Bong!
      A wave! Bong!
      Another wave!
      No two alike!

  # Pinceau, the painter (1:19, in the Real ; $15): before / after the Sleeping Forge
  - name: TX_5a84
    index: 0x84
    text: |-
      \col(1)Pinceau\col(0): The
      volcano. The
      volcano again.\stop
      It's all I can
      paint. They say
      there's a sea
      down below.\stop
      I can't see it.
      Not even with
      my eyes closed.

  - name: TX_5a85
    index: 0x85
    text: |-
      \col(1)Pinceau\col(0): I
      paint the sea,
      the lagoon, a
      seagull...\stop
      Your seagull
      looks just like
      you!

  # Pinceau in the Dream (0:19 ; $16): he sees the sea, and paints; he gives the painting
  - name: TX_5a86
    index: 0x86
    text: |-
      \col(1)Pinceau\col(0): The
      sea! I can see
      it! With my eyes
      closed, I see
      it!\stop
      Quick, quick...
      There!\stop
      Take this
      painting. Show
      it to someone
      who needs it.

  - name: TX_5a87
    index: 0x87
    text: |-
      \col(1)Pinceau\col(0): I
      still paint the
      sea. And the
      sky. And you!

  # A Brass musician, the Goron band (1:2a ; $17)
  - name: TX_5a88
    index: 0x88
    text: |-
      \col(1)The Brass\col(0):
      Toot. Toot.
      Toot.\stop
      We've played
      the same note
      for a hundred
      years. Pretty,
      isn't it?

  - name: TX_5a89
    index: 0x89
    text: |-
      \col(1)The Brass\col(0):
      Toot-ta-da-
      toot! We found
      a second note!

  # The copy merchant (1:3a ; $18)
  - name: TX_5a8a
    index: 0x8a
    text: |-
      \col(1)Merchant\col(0):
      Copies! Copies
      of copies!\stop
      A Piece of
      Heart? Brand
      new! Well...
      a drawing of a
      Piece of Heart.

  - name: TX_5a8b
    index: 0x8b
    text: |-
      \col(1)Merchant\col(0):
      Nobody buys my
      copies
      anymore...\stop
      Good! I'm sick
      of copying.



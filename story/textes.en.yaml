- group: 0x00
  data:
  # The 2nd dungeon's essence: the second verse
  - name: TX_000f
    index: 0x0f
    text: |-
      \pos(2)\slow()The Puppet's
      strings are cut.
      Lila's toys
      dance again!\stop
      You found the
      \col(1)second verse\col(0) of
      Marin's song!\stop
      \col(1)Marin\col(0): Two
      verses...\stop
      This one's about
      a little girl
      who dreams of a
      knight.\stop
      ...He looks a
      bit like you,
      doesn't he?

  - name: TX_0022
    index: 0x22
    text: |-
      The \col(1)Spinning
      Boomerang\col(0)! It
      hits from afar
      and comes back!\stop
      It reaches the
      crystals your
      sword can't.
  # The Lagoon: the bottle (trade item 1, Ages' old stationery)
  - name: TX_005b
    index: 0x5b
    text: |-
      A \col(1)message in a
      bottle\col(0)!\stop
      Inside, an old
      rolled-up
      letter.

  - name: TX_0031
    index: 0x31
    text: |-
      \col(1)Zora's
      Flippers\col(0)! You
      can swim now!\stop
      Get in the
      water, and \bbtn
      to dive.

  # The Mermaid Scales (Ages' mermaid suit)
  - name: TX_0036
    index: 0x36
    text: |-
      The \col(1)Mermaid
      Scales\col(0)!\stop
      You can swim in
      deep water, and
      \bbtn to dive!

  # The 3rd dungeon's essence: the third verse
  - name: TX_0010
    index: 0x10
    text: |-
      \pos(2)\slow()The Eel has
      given back the
      sweet words it
      swallowed.\stop
      You found the
      \col(1)third verse\col(0) of
      Marin's song!



  - name: TX_005a
    index: 0x5a
    text: |-
      You found
      \col(1)Sir Cork\col(0)!\stop
      Lila's wooden
      knight... He
      looks bored.

  - name: TX_0072
    index: 0x72
    text: |-
      The \col(1)Dream
      Notebook\col(0)!\stop
      The dreams you
      give back to
      people are
      written here.\stop
      Put it on a
      button (Start)
      to read it.

  - name: TX_006d
    index: 0x6d
    text: |-
      You got a \col(1)Fairy
      in a Bottle\col(0)! It
      revives you when
      you run out of
      hearts!

  # The first dungeon's essence becomes the first verse of Marin's song
  - name: TX_000e
    index: 0x0e
    text: |-
      \pos(2)\slow()The Keeper is
      finally asleep.
      He dreams of his
      wife, bringing
      him soup...\stop
      You found the
      \col(1)first verse\col(0) of
      Marin's song!\stop
      \col(1)Marin\col(0): Do you
      hear it? It's
      not the Ballad
      of the Wind
      Fish...\stop
      It's mine.
      My very own
      song!

  - name: TX_001c
    index: 0x1c
    text: |-
      You got your
      \col(1)sword\col(0) back!\stop
      Hold \abtn or \bbtn
      to charge it,
      then let go for
      a spin attack.

  - name: TX_0071
    index: 0x71
    text: |-
      You got the
      \col(1)Lantern of
      Dreams\col(0)!\stop
      Its light comes
      from the world
      of dreams...

  # The Power Bracelet (Brasia)
  - name: TX_0026
    index: 0x26
    text: |-
      \pos(2)The \col(1)Power
      Bracelet\col(0)!\stop
      Facing a rock,
      hold the button
      and pull: you
      lift it!

  # The painting of the sea (Pinceau, trade item 2: Ages' old stink bag)
  - name: TX_005c
    index: 0x5c
    text: |-
      The \col(1)painting
      of the sea\col(0)!\stop
      Waves, a red
      sun... The paint
      is still wet.


